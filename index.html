<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffdf9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171a">
<title>Michis</title>
<meta name="description" content="Michis: la agenda, el chat y las notitas de los dos.">
<meta name="application-name" content="Michis">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Michis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdf9; --card:#ffffff; --ink:#1f2328; --muted:#5b636d; --line:#e9e3d8; --soft:#f5f1ea;
  --accent:#d94f86; --accent-ink:#ffffff;
  --pa-bg:#fde4ee; --pa-bd:#e05b8f; --pa-tx:#8a1c4a;
  --pe-bg:#e1f2fd; --pe-bd:#3aa7d9; --pe-tx:#0b5a80;
  --qu-bg:#fff4bf; --qu-bd:#d4b400; --qu-tx:#5f4e00;
  --sa-bg:#ede6fb; --sa-bd:#8c6bc8; --sa-tx:#4527a0;
  --r:14px; --shadow:0 1px 2px rgba(31,35,40,.06),0 4px 14px rgba(31,35,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --card:#212328; --ink:#eceef1; --muted:#a6aeb8; --line:#33363d; --soft:#2a2d33;
    --pa-bg:#4a2033; --pa-tx:#ffd3e4; --pe-bg:#15364a; --pe-tx:#cfeaff;
    --qu-bg:#3f370f; --qu-tx:#fff0a6; --sa-bg:#2e2450; --sa-tx:#e2d8ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1400px;margin:0 auto;padding:16px}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{font-size:28px;line-height:1}
.rainbow{display:flex;gap:3px;width:170px;height:6px}
.rainbow span{flex:1;border-radius:3px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;min-height:40px}
.tabs button[aria-current="page"]{background:var(--card);box-shadow:var(--shadow)}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
.sync i{width:9px;height:9px;border-radius:50%;background:#b0b6bd;display:block}
.sync[data-mode="cloud"] i{background:#3fae5a}
.sync[data-mode="local"] i{background:#e3a21a}
.sync[data-mode="pin"] i,.sync[data-mode="error"] i{background:#e0503f}

/* Barra de herramientas */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.bar h2{font-size:20px;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#c0352b;border-color:#f0c4bf}
.seg{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:500;font-size:14px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}

/* Semana */
.daychips{display:none;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.daychips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:52px;font-size:12px;font-weight:600}
.daychips button b{font-size:17px;font-family:'Space Grotesk',sans-serif}
.daychips button[aria-pressed="true"]{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 30%,var(--card))}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.day>header{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;background:color-mix(in srgb,var(--dc) 38%,var(--card));border-bottom:2px solid var(--dc)}
.day>header .dn{font-weight:600;font-size:13px}
.day>header b{font-family:'Space Grotesk',sans-serif;font-size:20px;line-height:1}
.day>header .add{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;font-size:20px;line-height:1}
.day.today>header{box-shadow:inset 0 -3px 0 var(--ink)}
.day .list{display:flex;flex-direction:column;gap:6px;padding:8px}
.empty{color:var(--muted);font-size:13px;padding:8px 4px;text-align:center}
.blk{display:flex;align-items:flex-start;gap:6px;border-radius:10px;border-left:0;padding:6px 6px 6px 8px;background:var(--t-bg);color:var(--t-tx);border:1px solid color-mix(in srgb,var(--t-bd) 45%,transparent)}
.blk.done{opacity:.55}
.blk.done .ttl{text-decoration:line-through}
.blk .main{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;color:inherit}
.blk .time{font-size:11.5px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.blk .ttl{font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.blk .who{font-size:11.5px;opacity:.85;margin-top:2px}
/* Botón grande para marcar como hecha (fácil de tocar con el dedo) */
.blk{align-items:center}
.done-btn{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--t-bd);background:var(--card);color:transparent;font-size:17px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0;transition:background .15s,color .15s,transform .1s}
.done-btn:hover{color:color-mix(in srgb,var(--t-bd) 55%,transparent)}
.done-btn:active{transform:scale(.88)}
.done-btn[aria-pressed="true"]{background:var(--t-bd);color:#fff}
.blk.done{opacity:.6}
@media (pointer:coarse){ .done-btn{width:44px;height:44px;font-size:21px} }
.t-pareja{--t-bg:var(--pa-bg);--t-bd:var(--pa-bd);--t-tx:var(--pa-tx)}
.t-personal{--t-bg:var(--pe-bg);--t-bd:var(--pe-bd);--t-tx:var(--pe-tx)}
.t-quehacer{--t-bg:var(--qu-bg);--t-bd:var(--qu-bd);--t-tx:var(--qu-tx)}
.t-salida{--t-bg:var(--sa-bg);--t-bd:var(--sa-bd);--t-tx:var(--sa-tx)}
.mark{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1.5px dashed var(--k);background:color-mix(in srgb,var(--k) 14%,var(--card));border-radius:10px;padding:5px 8px;font-size:12.5px;font-weight:600}
.mark .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex-shrink:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:block;background:var(--t-bg);border:1.5px solid var(--t-bd)}

/* Mes */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead{text-align:center;font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;padding:6px 0;border-radius:8px;background:color-mix(in srgb,var(--dc) 55%,var(--card));color:var(--ink)}
.cell{min-height:104px;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--dc) 70%,var(--line));background:color-mix(in srgb,var(--dc) 10%,var(--card));text-align:left;min-width:0}
.cell.out{opacity:.4}
.cell.today{outline:2.5px solid var(--ink);outline-offset:1px}
.cell .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.pill{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--k) 20%,var(--card));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--k);flex-shrink:0}
.pill span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);font-weight:600}
.upcoming{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.upcoming h3{font-size:17px;margin-bottom:8px}
.up-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.up-row:first-of-type{border-top:0}
.up-date{min-width:64px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px}
.up-row .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex-shrink:0}
.up-row small{color:var(--muted);display:block}

/* Notitas */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.note{border-radius:6px 6px 18px 6px;padding:14px 14px 10px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 8px 18px rgba(31,35,40,.10);display:flex;flex-direction:column;gap:8px;min-height:200px;color:#2b2b2b;transform:rotate(var(--rot))}
.note textarea{flex:1;border:0;background:transparent;resize:none;min-height:120px;font-size:15.5px;line-height:1.45;outline:none;color:#2b2b2b}
.note footer{display:flex;align-items:center;gap:6px;font-size:12px;color:#4d4d4d}
.note footer .meta{flex:1 0 auto;white-space:nowrap}
.swatch{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);padding:0}
.note .del{border:0;background:rgba(0,0,0,.07);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:#4d4d4d}
.note-tag{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.07);border-radius:999px;padding:2px 8px;align-self:flex-start}

/* Ajustes */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);max-width:720px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:10px}
.panel p{margin:6px 0 10px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:400;font-size:15px;color:var(--ink);min-height:42px}
label.f textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Diálogo */
dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,24,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:19px}
.dlg .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.dlg .actions .danger{margin-right:auto}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:38px}
.choice input{accent-color:var(--accent)}
.daylist{display:flex;flex-direction:column;gap:6px}
.hidden{display:none!important}
/* Chat */
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;vertical-align:1px}
.tabs .badge:empty{display:none}
.chat{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;max-width:820px;margin:0 auto;height:70vh;min-height:340px}
.chat-list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.chat-empty{margin:auto;text-align:center;color:var(--muted);max-width:300px;font-size:14px}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(80%,440px)}
.msg.mine{align-self:flex-end;align-items:flex-end}
.bubble{background:var(--soft);border-radius:18px 18px 18px 6px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-wrap;max-width:100%}
.msg.mine .bubble{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px}
.bubble a{color:inherit;text-decoration:underline}
.bubble.gone{font-style:italic;color:var(--muted);background:transparent;border:1px dashed var(--line)}
.msg.mine .bubble.gone{color:var(--muted);background:transparent}
.msg.sending{opacity:.6}
.msg.failed .bubble{outline:2px solid #e0503f;outline-offset:1px}
.m-media{display:flex;flex-direction:column;gap:6px;margin-top:2px;max-width:100%}
.msg.mine .m-media{align-items:flex-end}
.m-meta{font-size:11px;color:var(--muted);margin:2px 8px 6px;display:flex;gap:10px;align-items:center}
.m-meta button{border:0;background:none;padding:0;color:inherit;font-size:11px;text-decoration:underline}
.day-sep{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 12px;margin:10px 0 6px}
.m-img{display:block;max-width:min(100%,320px);max-height:360px;width:auto;height:auto;border-radius:14px;background:var(--soft);cursor:zoom-in;border:0;padding:0}
.m-img img,.m-img video{display:block;max-width:100%;max-height:360px;width:auto;height:auto;border-radius:14px}
.yt{display:block;width:min(360px,68vw);aspect-ratio:16/9;border:0;border-radius:14px;background:#000 center/cover no-repeat;position:relative;padding:0}
.yt.tall{width:min(240px,58vw);aspect-ratio:9/16}
.yt span{position:absolute;inset:0;margin:auto;width:60px;height:42px;border-radius:12px;background:rgba(230,0,0,.92);color:#fff;display:grid;place-items:center;font-size:18px}
iframe.yt{background:#000}
.tt{width:min(325px,72vw);height:575px;border:0;border-radius:14px;background:#000}
.ig{width:min(340px,72vw);height:540px;border:0;border-radius:14px;background:#fff}
.sp{width:min(340px,72vw);height:152px;border:0;border-radius:14px}
.sp.big{height:352px}
.linkcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;text-decoration:none;max-width:320px}
.linkcard b{display:block;font-size:14px}
.linkcard small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.linkcard .ico{font-size:22px}
.actcard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--t-bd);background:var(--t-bg);color:var(--t-tx);border-radius:14px;padding:10px 12px;min-width:min(240px,68vw);max-width:100%}
.actcard .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.actcard b{font-size:15.5px;line-height:1.25}
.actcard small{font-size:12.5px;opacity:.9}
.actcard .go{font-size:12.5px;font-weight:600;margin-top:4px;text-decoration:underline}
.chat-note{font-size:13px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);background:var(--soft)}
.chat-note:empty{display:none}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--card)}
.inbox{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--bg);border:1.5px solid var(--line);border-radius:24px;padding:0 4px}
.inbox:focus-within{border-color:var(--accent)}
.ib{flex-shrink:0;width:38px;height:42px;border:0;background:transparent;font-size:19px;display:grid;place-items:center;border-radius:50%;padding:0}
.ib[aria-expanded="true"]{color:var(--accent)}
.inbox textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;max-height:140px;min-height:42px;height:42px;padding:11px 4px;line-height:1.3;font-size:15.5px;outline:none}
.send{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:18px;display:grid;place-items:center;padding:0 0 0 3px;box-shadow:var(--shadow)}
/* Panel de emojis, GIFs y stickers */
.picker{border-top:1px solid var(--line);background:var(--card);height:min(310px,42vh);display:flex;flex-direction:column}
.picker[hidden]{display:none}
.pk-tabs{display:flex;border-bottom:1px solid var(--line)}
.pk-tabs button{flex:1;border:0;background:transparent;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent}
.pk-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pk-body{flex:1;overflow-y:auto;padding:8px 10px 12px;overscroll-behavior:contain}
.pk-search{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--bg);font-size:15px;margin-bottom:8px;outline-color:var(--accent)}
.pk-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 2px 6px}
.pk-h button{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;text-transform:none;letter-spacing:0;padding:2px 4px}
.emo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px}
.emo-grid button{border:0;background:transparent;font-size:26px;height:44px;border-radius:10px;padding:0;line-height:1}
.emo-grid button:hover{background:var(--soft)}
.emo-cats{display:flex;gap:2px;overflow-x:auto;margin:-2px 0 4px;position:sticky;top:-8px;background:var(--card);padding:4px 0;z-index:1}
.emo-cats button{flex:0 0 auto;border:0;background:transparent;font-size:20px;width:38px;height:34px;border-radius:8px;padding:0}
.emo-cats button:hover{background:var(--soft)}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.pk-grid.stk{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.pk-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
.pk-grid.stk .pk-item{background:transparent}
.pk-pick{display:block;width:100%;height:100%;border:0;padding:0;background:transparent}
.pk-pick img{width:100%;height:100%;object-fit:cover;display:block}
.pk-grid.stk .pk-pick img{object-fit:contain;padding:4px}
.pk-star,.pk-del{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;display:grid;place-items:center;padding:0}
.pk-del{background:#e0503f}
.pk-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;height:100%;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:600}
.pk-new b{font-size:26px;line-height:1;color:var(--accent)}
.pk-note{color:var(--muted);font-size:13px;padding:6px 2px}
.pk-more{display:block;margin:10px auto 0}
.giphy{font-size:11px;color:var(--muted);text-align:right;margin-top:8px}
/* GIFs y stickers en el chat */
.stk-msg{border:0;background:transparent;padding:0;width:150px;height:150px;display:block}
.stk-msg img{width:100%;height:100%;object-fit:contain;display:block}
.gif-msg{position:relative}
.gif-msg::after{content:'GIF';position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px}
.stk-preview{width:220px;height:220px;margin:0 auto;display:block;border-radius:14px;background:repeating-conic-gradient(var(--soft) 0 25%,var(--card) 0 50%) 50%/20px 20px}
.pick{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border-radius:10px;padding:8px 10px;background:var(--t-bg);color:var(--t-tx);border:1px solid color-mix(in srgb,var(--t-bd) 50%,transparent)}
.pick small{display:block;font-size:12px;opacity:.85}
.imgview{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:12px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.banner{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.banner .ico{font-size:24px}
.banner .txt{flex:1;min-width:0;font-size:13.5px}
.banner .btn{flex-shrink:0;padding:8px 12px}
.banner .x{flex-shrink:0}
.banner .txt b{display:block;font-size:15px}
.banner .x{border:0;background:transparent;width:36px;height:36px;border-radius:50%;font-size:16px;color:var(--muted)}
.steps{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.steps li{margin:3px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow);z-index:10}

@media (max-width:900px){
  .daychips{display:flex}
  .week{grid-template-columns:minmax(0,1fr)}
  .week .day{display:none}
  .week .day.active{display:block}
  .cell{min-height:64px;padding:4px;gap:2px}
  .pill span{display:none}
  .pill{padding:2px 4px;justify-content:center}
  .mhead{font-size:11px}
}
@media (max-width:520px){
  .wrap{padding:12px}
  .brand h1{font-size:24px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:8px 4px;font-size:14px}
  .tabs .badge{margin-left:2px}
  .chat{border-radius:12px}
  .chat-list{padding:10px 8px}
  .msg{max-width:88%}
  .composer{padding:6px}
  .ib{width:34px}
}

/* =====================================================================
   Capa visual moderna: superficies de vidrio, profundidad suave,
   respuesta al tocar y movimiento con resorte.
   ===================================================================== */
:root{
  --r:16px; --r-lg:20px;
  --ease:cubic-bezier(.22,.8,.24,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --shadow:0 1px 2px rgba(31,35,40,.05),0 8px 24px -10px rgba(31,35,40,.16);
  --shadow-lg:0 28px 70px -16px rgba(31,35,40,.32);
  --glass:color-mix(in srgb,var(--bg) 76%,transparent);
  --accent-2:#ff8a65;
  --grad:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2)));
}
@media (prefers-color-scheme:dark){
  :root{ --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.6); --shadow-lg:0 30px 80px -16px rgba(0,0,0,.7); --accent:#ec6a9c }
}
html{-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(900px 520px at 0% -8%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 65%),
  radial-gradient(800px 480px at 100% 0%,color-mix(in srgb,#81d4fa 9%,transparent),transparent 60%),
  var(--bg);background-attachment:fixed}
button,a,input,select,textarea{touch-action:manipulation}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}

/* Encabezado fijo de vidrio */
.top{position:sticky;top:0;z-index:20;margin:-16px -16px 16px;padding:12px 16px;background:var(--glass);
  -webkit-backdrop-filter:saturate(1.7) blur(16px);backdrop-filter:saturate(1.7) blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.brand h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rainbow{height:5px}

/* Pestañas con indicador que se desliza */
.tabs{position:relative;gap:2px;flex-wrap:nowrap;background:color-mix(in srgb,var(--soft) 80%,transparent)}
.tabs button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;color:var(--muted);transition:color .25s var(--ease),transform .15s var(--ease)}
.tabs button:active{transform:scale(.94)}
.tabs button[aria-current="page"]{background:transparent;box-shadow:none;color:var(--ink)}
.tabs svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs svg .dots{stroke-width:2.6}
.tab-ind{position:absolute;z-index:0;top:4px;left:0;height:calc(100% - 8px);width:0;border-radius:999px;background:var(--card);box-shadow:var(--shadow);
  transition:transform .42s var(--spring),width .42s var(--spring);pointer-events:none}
.tab-ind.no-anim{transition:none}
.badge{animation:pop .4s var(--spring)}
.sync{transition:background .2s}
.sync[data-mode="cloud"] i{box-shadow:0 0 0 3px color-mix(in srgb,#3fae5a 25%,transparent)}

/* Botones: respuesta táctil */
.btn,.icon-btn,.send,.ib,.add,.seg button,.daychips button{transition:transform .14s var(--ease),background .2s,box-shadow .2s,border-color .2s}
.btn:active,.icon-btn:active,.send:active,.ib:active,.add:active,.seg button:active,.daychips button:active{transform:scale(.93)}
.btn:hover,.icon-btn:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.btn.primary,.send{background:var(--grad);border-color:transparent;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{border-color:transparent;filter:brightness(1.05)}
.seg button[aria-pressed="true"]{color:var(--accent)}

/* Tarjetas */
.day,.panel,.upcoming,.chat{border-radius:var(--r-lg);border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.day{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
@media (hover:hover){ .day:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)} }
.day>header{background:linear-gradient(180deg,color-mix(in srgb,var(--dc) 46%,var(--card)),color-mix(in srgb,var(--dc) 26%,var(--card)))}
.day.today>header{box-shadow:none}
.day.today>header .dn::after{content:'Hoy';margin-left:6px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--bg);vertical-align:1px}
.day .list{gap:7px;padding:9px}
.blk{border-radius:14px;padding:7px 8px;transition:opacity .3s var(--ease),transform .2s var(--ease),background .2s}
.blk .main{cursor:pointer}
.blk .ttl{transition:opacity .3s}
.done-btn{box-shadow:0 1px 2px rgba(0,0,0,.08)}
.done-btn.pop{animation:check .5s var(--spring)}
.mark{border-radius:12px;transition:transform .15s var(--ease)}
.mark:active{transform:scale(.97)}
/* Selector de días del celular: siempre caben exactos 5 y nunca queda uno cortado */
.daychips{--gap:6px;gap:var(--gap);scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 0 8px;margin-bottom:4px}
.daychips::-webkit-scrollbar{display:none}
.daychips button{flex:0 0 calc((100% - 4 * var(--gap)) / 5);min-width:0;scroll-snap-align:start;border-radius:14px;padding:8px 0}
.daychips button[aria-pressed="true"]{box-shadow:var(--shadow);transform:translateY(-1px)}
.cell{border-radius:14px;transition:transform .15s var(--ease),box-shadow .2s}
@media (hover:hover){ .cell:hover{box-shadow:var(--shadow);transform:translateY(-1px)} }
.cell:active{transform:scale(.97)}
.up-row{border-radius:12px;padding:10px 8px;transition:background .2s}
.up-row:hover{background:var(--soft)}
.note{transition:transform .3s var(--spring),box-shadow .3s}
/* Notitas: GIF/sticker pegado y respuestas */
.note footer{flex-wrap:wrap;row-gap:6px}
.note .sws{display:flex;gap:5px;flex-wrap:wrap}
.note .swatch{width:20px;height:20px}
.note.has-media textarea{min-height:56px}
.note-media{position:relative;align-self:flex-start;max-width:100%}
.note-media img{display:block;border-radius:10px;max-width:100%;max-height:220px;width:auto;height:auto}
.note-media.stk img{width:130px;height:130px;object-fit:contain}
.nm-del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;display:grid;place-items:center;padding:0}
.replies{display:flex;flex-direction:column;gap:8px;margin-top:2px;padding-left:10px;border-left:2.5px solid rgba(0,0,0,.12)}
.reply{border-radius:4px 12px 12px 12px;padding:8px 10px 6px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 4px 10px -4px rgba(31,35,40,.18);display:flex;flex-direction:column;gap:6px;animation:rise .3s var(--ease)}
.reply-h{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#4d4d4d}
.reply-h .meta{flex:1}
.reply .note-tag{font-size:11px}
.reply textarea{border:0;background:transparent;resize:none;min-height:44px;font-size:14.5px;line-height:1.4;outline:none;color:#2b2b2b;padding:0}
.mini{border:0;background:rgba(0,0,0,.07);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;color:#4d4d4d;font-size:12px;padding:0}
.reply-btn{align-self:flex-start;border:0;background:rgba(0,0,0,.08);color:#3a3a3a;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;min-height:36px;transition:transform .14s var(--ease),background .2s}
.reply-btn:hover{background:rgba(0,0,0,.12)}
.reply-btn:active,.mini:active{transform:scale(.93)}
.pk-body.note-pk{height:min(440px,58dvh);padding:8px 2px 4px}
@media (hover:hover){ .note:hover{transform:rotate(0) translateY(-3px);box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 30px -10px rgba(31,35,40,.3)} }
label.f input,label.f select,label.f textarea{border-radius:12px;transition:border-color .2s,box-shadow .2s}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.banner{border-radius:var(--r-lg);animation:rise .45s var(--ease) both}

/* Chat */
.chat-list{background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.4px);background-size:20px 20px}
.bubble{box-shadow:0 1px 1.5px rgba(0,0,0,.08);background:var(--card);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.msg.mine .bubble{background:var(--grad);border-color:transparent}
.msg.in{animation:msg-in .34s var(--spring) both;transform-origin:0 100%}
.msg.mine.in{transform-origin:100% 100%}
.day-sep{position:sticky;top:2px;z-index:2;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.m-img,.yt,.actcard,.linkcard{transition:transform .15s var(--ease)}
.m-img:active,.yt:active,.actcard:active,.stk-msg:active{transform:scale(.97)}
.picker:not([hidden]){animation:rise .26s var(--ease)}
.pk-tabs button{transition:color .2s,border-color .25s}
.pk-pick{transition:transform .15s var(--ease)}
.pk-pick:active{transform:scale(.92)}
.emo-grid button{transition:transform .12s var(--spring)}
.emo-grid button:active{transform:scale(1.3)}
.send{transition:transform .14s var(--ease),filter .2s}

/* Diálogos y avisos */
dialog{border-radius:24px;box-shadow:var(--shadow-lg)}
dialog[open]{animation:dlg-in .3s var(--ease)}
dialog::backdrop{background:rgba(14,14,20,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog[open]::backdrop{animation:fade .3s ease}
.toast{background:color-mix(in srgb,var(--ink) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:11px 18px;box-shadow:var(--shadow-lg);animation:toast-in .4s var(--spring);z-index:60}

/* Entrada suave al cambiar de sección */
#main.enter>*{animation:rise .4s var(--ease) both}
#main.enter>*:nth-child(2){animation-delay:.04s}
#main.enter>*:nth-child(3){animation-delay:.08s}
#main.enter>*:nth-child(n+4){animation-delay:.12s}
#main.enter .day{animation:rise .45s var(--ease) both}
#main.enter .day:nth-child(2){animation-delay:.03s}
#main.enter .day:nth-child(3){animation-delay:.06s}
#main.enter .day:nth-child(4){animation-delay:.09s}
#main.enter .day:nth-child(5){animation-delay:.12s}
#main.enter .day:nth-child(6){animation-delay:.15s}
#main.enter .day:nth-child(7){animation-delay:.18s}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes check{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes msg-in{from{opacity:0;transform:translateY(10px) scale(.92)}}
@keyframes dlg-in{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,16px) scale(.9)}}

/* Celular: barra de navegación abajo (al alcance del pulgar) y diálogos tipo hoja */
@media (max-width:640px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  /* Sin desenfoque aquí: un backdrop-filter haría que la barra fija de abajo quede atrapada dentro del encabezado */
  .top{flex-wrap:nowrap;margin:-12px -12px 12px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
    -webkit-backdrop-filter:none;backdrop-filter:none;background:color-mix(in srgb,var(--bg) 94%,transparent)}
  .brand h1{font-size:22px}
  .rainbow{width:130px;height:4px}
  .sync{padding:8px 10px}
  .sync span{font-size:12px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;width:auto;border-radius:0;flex-wrap:nowrap;gap:0;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:var(--glass);
    -webkit-backdrop-filter:saturate(1.7) blur(18px);backdrop-filter:saturate(1.7) blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
  .tabs button{flex:1;flex-direction:column;justify-content:center;gap:3px;min-height:56px;padding:4px 0 2px;font-size:11px;font-weight:600;border-radius:16px}
  .tabs button[aria-current="page"]{color:var(--accent)}
  .tabs svg{width:24px;height:24px;margin-top:3px}
  .tab-ind{top:8px;height:32px;background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:none}
  .tabs .badge{position:absolute;top:3px;left:calc(50% + 5px);margin:0;border:2px solid var(--bg)}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:26px 26px 0 0;max-height:92dvh}
  dialog[open]{animation:sheet-in .36s var(--ease)}
  .dlg{padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
  .dlg::before{content:'';align-self:center;width:42px;height:5px;border-radius:3px;background:var(--line);margin-bottom:4px}
  .dlg .actions .btn{flex:1;justify-content:center;min-height:46px}
  .dlg .actions .danger{flex:0 1 auto}
}

/* Marca: logo de michis + nombre */
.brand{flex-direction:row;align-items:center;gap:10px}
.brand .logo{width:44px;height:44px;border-radius:13px;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 65%,transparent);flex-shrink:0;transition:transform .3s var(--spring)}
.brand:hover .logo{transform:rotate(-6deg) scale(1.05)}
.brand-txt{display:flex;flex-direction:column;gap:4px}
.brand-txt .rainbow{width:100%;max-width:120px}
.tagline{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1;margin-top:-1px}
@media (max-width:640px){
  .brand .logo{width:38px;height:38px;border-radius:11px}
  .brand-txt .rainbow{display:none}
  .tagline{font-size:10.5px}
}

/* Íconos de línea */
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ico .dots{stroke-width:2.7}
.ib{color:var(--muted)}
.ib:hover{color:var(--ink)}
.ib[aria-expanded="true"]{color:var(--accent)}
.send .ico{width:21px;height:21px;stroke:#fff;stroke-width:2;margin-left:-2px}
.send{padding:0}
.pk-tabs button{display:flex;align-items:center;justify-content:center;gap:6px}
.pk-tabs .ico{width:19px;height:19px}

/* Fotos de perfil */
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--soft)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-ini{color:#fff;font-weight:700;font-family:'Space Grotesk',sans-serif;background:linear-gradient(135deg,#3aa7d9,#8c6bc8)}
.av-ini[data-w="b"]{background:linear-gradient(135deg,#e05b8f,#ff8a65)}
.av-md{width:42px;height:42px;font-size:18px}
.av-lg{width:72px;height:72px;font-size:28px}
.av-xl{width:110px;height:110px;font-size:42px;box-shadow:var(--shadow)}
.av-row{display:flex;gap:22px;margin:4px 0 14px}
.av-pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;font-weight:600;color:var(--muted)}
.av-pick .av{transition:transform .15s var(--ease)}
.av-pick:active .av{transform:scale(.94)}
.av-cam{position:absolute;top:48px;left:50%;margin-left:12px;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.av-cam .ico{width:15px;height:15px;stroke-width:2.1}
.profs{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:6px 0}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px}
.prof b small{font-weight:500;color:var(--muted)}

/* Encabezado del chat (como WhatsApp) */
.chat-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;border-bottom:1px solid var(--line);background:var(--card);z-index:3}
.ch-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:2px 4px;border-radius:14px;text-align:left;color:inherit}
.ch-who:hover{background:var(--soft)}
.ch-info{display:flex;flex-direction:column;min-width:0}
.ch-info b{font-size:16px;line-height:1.2}
.ch-info small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Fondos del chat */
.chat-list.bg-dark .day-sep{background:rgba(0,0,0,.45);color:#fff}
.chat-list.bg-dark .m-meta{color:rgba(255,255,255,.88);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.chat-list.bg-dark .chat-empty{color:#fff}
.bg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bg-sw{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;padding:0;font-size:12px;font-weight:600;color:var(--muted)}
.bg-prev{display:block;width:100%;aspect-ratio:3/4;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.bg-prev.dots{background-image:radial-gradient(color-mix(in srgb,var(--ink) 18%,transparent) 1px,transparent 1.4px);background-size:10px 10px}
.bg-sw.on .bg-prev{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.bg-sw.on{color:var(--accent)}

/* Responder mensajes */
.quote{display:flex;align-items:center;gap:8px;width:100%;min-width:0;max-width:300px;text-align:left;border:0;border-left:4px solid var(--qc,#8c6bc8);border-radius:10px;padding:6px 8px;background:color-mix(in srgb,var(--qc,#8c6bc8) 12%,var(--card));color:var(--ink);margin-bottom:3px}
.q-a{--qc:#3aa7d9}
.q-b{--qc:#e05b8f}
.q-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.q-txt b{font-size:12.5px;color:var(--qc)}
.q-txt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-th{width:40px;height:40px;border-radius:7px;object-fit:cover;flex-shrink:0}
.q-th.stk{object-fit:contain}
.msg.mine .quote{align-self:flex-end}
.replying{display:flex;align-items:center;gap:6px;padding:8px 8px 0;background:var(--card);border-top:1px solid var(--line);animation:rise .22s var(--ease)}
.replying[hidden]{display:none}
.replying .quote{max-width:none;margin:0}
.m-rep{display:inline-flex;align-items:center;gap:3px}
.m-rep .ico{width:13px;height:13px;stroke-width:2.2}
.msg{transition:transform .2s var(--ease)}
.msg.swiping{transition:none}
.msg.flash>.bubble,.msg.flash>.m-media,.msg.flash>.quote{animation:flash 1.3s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@media (hover:hover){
  .m-rep{opacity:0;transition:opacity .15s}
  .msg:hover .m-rep{opacity:1}
}

/* ===== Funciones para la pareja ===== */
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn .ico,.chip-btn .ico{width:18px;height:18px}
.hint{display:flex;gap:6px;align-items:flex-start;margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.hint .ico{width:16px;height:16px;margin-top:1px;flex-shrink:0}
.muted{color:var(--muted)}
.f-l{font-size:13px;font-weight:600;color:var(--muted)}
/* Acciones rápidas de la semana */
.quick-acts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;margin:0 -2px}
.quick-acts::-webkit-scrollbar{display:none}
.chip-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px;box-shadow:var(--shadow);transition:transform .14s var(--ease)}
.chip-btn:active{transform:scale(.94)}
.chip-btn.primary{background:var(--grad);color:#fff;border-color:transparent}
/* Panel de hoy */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:12px}
.hub-card{background:var(--card);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow);animation:rise .4s var(--ease) both}
.hub-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hub-t b{font-family:'Space Grotesk',sans-serif;font-size:15.5px}
.hub-t small{color:var(--muted);font-size:12.5px}
.hub-links{display:flex;gap:12px}
.hub-links button{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px}
.mood-opts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mood-opts button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid transparent;background:var(--soft);border-radius:14px;padding:8px 2px;transition:transform .15s var(--spring),border-color .2s}
.mood-opts button span{font-size:26px;line-height:1}
.mood-opts button small{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.mood-opts button:active{transform:scale(1.15)}
.mood-opts button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.mood-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.mood-row .av{width:30px;height:30px;font-size:13px}
.mood-e{font-size:24px;line-height:1}
.mood-tx{display:flex;flex-direction:column;min-width:0}
.mood-tx b{font-size:14px}
.mood-tx small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.countdown{display:flex;flex-direction:column;gap:6px}
.cd{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:color-mix(in srgb,var(--k) 12%,var(--card));border-radius:14px;padding:8px 10px;color:var(--ink);transition:transform .15s var(--ease)}
.cd:active{transform:scale(.98)}
.cd-n{min-width:52px;height:48px;border-radius:12px;background:var(--k);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;line-height:1}
.cd-n small{font-size:10px;font-weight:600;opacity:.9;margin-top:2px}
.cd-t{display:flex;flex-direction:column;min-width:0}
.cd-t b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-t small{color:var(--muted);font-size:12.5px}
/* Planes */
.plans-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:12px}
.plan-card{display:flex;flex-direction:column;gap:3px;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--card)),color-mix(in srgb,#ff8a65 10%,var(--card)));border:1.5px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink);min-width:min(260px,72vw);max-width:100%;text-align:left}
.plans-strip .plan-card{box-shadow:var(--shadow);animation:rise .4s var(--ease) both}
.plan-card .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.plan-card b{font-size:16px;line-height:1.25;font-family:'Space Grotesk',sans-serif}
.plan-card small{color:var(--muted);font-size:13px}
.plan-card .plan-note{font-style:italic}
.plan-st{font-size:12.5px;font-weight:600;margin-top:2px}
.plan-card.st-accepted{border-color:#3fae5a;background:color-mix(in srgb,#3fae5a 12%,var(--card))}
.plan-card.st-accepted .lbl{color:#2e8b47}
.plan-card.st-declined,.plan-card.st-cancelled,.plan-card.st-countered{opacity:.75;background:var(--soft);border-color:var(--line)}
.plan-card.st-declined .lbl,.plan-card.st-cancelled .lbl,.plan-card.st-countered .lbl{color:var(--muted)}
.plan-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.plan-wait{font-size:12.5px;color:var(--muted);flex:1}
.msg.mine .plan-card .btn{color:var(--ink)}
/* Choques de horario */
.clash{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,#e3a21a 16%,var(--card));border:1px solid color-mix(in srgb,#e3a21a 50%,transparent);color:var(--ink);border-radius:12px;padding:9px 11px;font-size:13.5px;animation:rise .25s var(--ease)}
.clash .ico{width:18px;height:18px;color:#c98a00;flex-shrink:0;margin-top:1px}
/* Libres juntos */
.free-list{display:flex;flex-direction:column;gap:12px;max-height:52dvh;overflow:auto;padding-right:2px}
.free-h{font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.free-slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid color-mix(in srgb,#3fae5a 45%,var(--line));background:color-mix(in srgb,#3fae5a 10%,var(--card));border-radius:14px;padding:10px 12px;margin-bottom:6px;color:var(--ink);transition:transform .14s var(--ease)}
.free-slot:active{transform:scale(.98)}
.free-slot b{font-size:15px}
.free-slot small{color:var(--muted);font-size:12.5px;flex:1}
.free-slot.flex{border-style:dashed;border-color:color-mix(in srgb,#3aa7d9 45%,var(--line));background:color-mix(in srgb,#3aa7d9 8%,var(--card))}
.free-slot .go{color:var(--accent)}
.free-none{color:var(--muted);font-size:13.5px;padding:4px 2px}
.free-cfg summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);padding:4px 0}
/* Resumen */
.sum-sec h4{margin:0 0 6px;font-size:15px}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sum-list li{display:flex;gap:10px;align-items:center}
.sum-list li span{display:flex;flex-direction:column}
.sum-list small{color:var(--muted);font-size:12.5px}
.sum-e{font-size:20px}
.sum-chore{display:flex;align-items:center;gap:10px;padding:4px 0}
.sum-chore span{margin-left:auto;color:var(--muted);font-size:13px}
/* Balance de quehaceres */
.balance{background:var(--card);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);margin-top:14px;max-width:560px}
.bal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bal-head h3{font-size:17px}
.bal-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.bal-main{flex:1;min-width:0}
.bal-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.bal-top span{color:var(--muted)}
.bal-bar{height:9px;border-radius:999px;background:var(--soft);overflow:hidden}
.bal-bar i{display:block;height:100%;border-radius:inherit;background:var(--grad);transition:width .6s var(--ease)}
.bal-msg{margin:10px 0 0;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:10px}
.bal-msg.ok{background:color-mix(in srgb,#3fae5a 12%,var(--card));color:color-mix(in srgb,#3fae5a 70%,var(--ink))}
.bal-msg.warn{background:color-mix(in srgb,#e3a21a 14%,var(--card))}
/* Chat: estados, reacciones, visto, voz */
.statusbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px;border-top:1px solid var(--line);background:var(--card);animation:rise .2s var(--ease)}
.statusbar[hidden]{display:none}
.statusbar::-webkit-scrollbar{display:none}
.st-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;transition:transform .12s var(--ease)}
.st-chip span{font-size:16px}
.st-chip:active{transform:scale(.94)}
.st-chip.ghost{background:transparent}
.st-chip .ico{width:15px;height:15px}
.status-msg{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:18px;background:color-mix(in srgb,#3aa7d9 14%,var(--card));border:1px solid color-mix(in srgb,#3aa7d9 35%,transparent);font-weight:600;font-size:14.5px}
.msg.mine .status-msg{background:color-mix(in srgb,var(--accent) 16%,var(--card));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.st-emo{font-size:20px}
.ch-mood{font-size:16px}
.ticks{display:inline-flex;vertical-align:-3px;color:var(--muted)}
.ticks .ico{width:16px;height:16px;stroke-width:2}
.ticks.seen{color:#3aa7d9}
.m-acts{display:inline-flex;gap:2px;margin-left:4px}
.m-acts button{border:0;background:none;padding:2px;color:var(--muted);display:inline-grid;place-items:center;border-radius:6px;text-decoration:none}
.m-acts .ico{width:16px;height:16px}
.m-acts button:hover{color:var(--ink);background:var(--soft)}
@media (hover:hover){ .m-acts{opacity:0;transition:opacity .15s} .msg:hover .m-acts,.m-acts:focus-within{opacity:1} }
@media (hover:none){ .m-acts{display:none} .msg{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none} }
.reacts{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;margin:-8px 0 0 10px;padding:2px 7px;border-radius:999px;border:1.5px solid var(--card);background:var(--soft);font-size:14px;box-shadow:var(--shadow);position:relative;z-index:1;animation:pop .3s var(--spring)}
.msg.mine .reacts{align-self:flex-end;margin:-8px 10px 0 0}
.reacts small{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
.react-row{display:flex;justify-content:space-between;gap:4px;background:var(--soft);border-radius:999px;padding:6px 8px}
.react-row button{border:0;background:transparent;font-size:27px;width:42px;height:42px;border-radius:50%;padding:0;transition:transform .15s var(--spring)}
.react-row button:hover,.react-row button:active{transform:scale(1.25)}
.react-row button.on{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.menu-list{display:flex;flex-direction:column}
.menu-list button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:12px 6px;font-size:15.5px;font-weight:500;border-radius:12px;text-align:left}
.menu-list button:hover{background:var(--soft)}
.menu-list .danger{color:#c0352b}
.menu-list .ico{width:20px;height:20px}
.composer.recording .inbox{display:none}
.recbar{flex:1;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 6px;border-radius:24px;background:color-mix(in srgb,#e0503f 9%,var(--bg));border:1.5px solid color-mix(in srgb,#e0503f 35%,var(--line))}
.recbar[hidden]{display:none}
.rec-x{color:#c0352b}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#e0503f;animation:blink 1s infinite}
.rec-time{font-variant-numeric:tabular-nums;font-weight:700}
.rec-hint{color:var(--muted);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@keyframes blink{50%{opacity:.25}}
.voice{--p:0%;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:20px;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 1px 1.5px rgba(0,0,0,.08);min-width:min(240px,64vw)}
.msg.mine .voice{background:var(--grad);border-color:transparent;color:#fff}
.vplay{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent);color:#fff;flex-shrink:0;padding:0}
.msg.mine .vplay{background:rgba(255,255,255,.95);color:var(--accent)}
.vplay .ico{width:18px;height:18px}
.vwave{flex:1;display:flex;align-items:center;gap:2px;height:28px}
.vwave i{flex:1;min-width:2px;border-radius:2px;background:color-mix(in srgb,currentColor 32%,transparent);transition:background .15s}
.vwave i.on{background:currentColor}
.vtime{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85;min-width:32px;text-align:right}
/* Michis */
.cat-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;min-height:38px}
.cat-chip i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15)}
.cat-chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));color:var(--accent)}
.cat-chip.ghost{border-style:dashed;color:var(--muted)}
.cat-chip .ico{width:15px;height:15px}
.care-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.care-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:12px 6px;text-align:center;transition:transform .14s var(--spring),background .2s}
.care-btn:active{transform:scale(.94);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.care-e{font-size:26px;line-height:1.1}
.care-btn b{font-size:14px}
.care-btn small{font-size:11.5px;color:var(--muted);line-height:1.25}
.log-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.log-list li:first-child{border-top:0}
.log-time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:62px}
.log-e{font-size:20px}
.log-t{flex:1;display:flex;flex-direction:column;min-width:0}
.log-t small{color:var(--muted);font-size:12px}
.mini-x{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0;flex-shrink:0;font-size:15px}
.mini-x .ico{width:14px;height:14px}
.mini-x.sure{background:#e0503f;color:#fff}
.care-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.care-item:first-of-type{border-top:0}
.care-main{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;border:0;background:none;padding:0;color:inherit}
.care-main small{color:var(--muted);font-size:12.5px}
.care-when{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
.care-item.soon .care-when{background:color-mix(in srgb,#e3a21a 20%,var(--card))}
.care-item.late .care-when{background:#e0503f;color:#fff}
.cat-empty{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cat-empty p{margin:0}
.swatch-pick input{position:absolute;opacity:0}
.swatch-pick i{display:block;width:32px;height:32px;border-radius:50%;border:2px solid var(--line)}
.swatch-pick input:checked+i{outline:3px solid var(--accent);outline-offset:2px}
.choice .swatch-pick{border:0;padding:2px;min-height:0}
/* Perfiles de michis */
.cat-av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex-shrink:0;background:color-mix(in srgb,var(--cb,#ccc) 22%,var(--soft));width:44px;height:44px}
.cat-av img{width:100%;height:100%;object-fit:cover;display:block}
.cat-av .cat-face{width:92%;height:92%;margin-top:6%}
.cat-av.md{width:72px;height:72px}
.cat-av.lg{width:96px;height:96px}
.cat-av.xl{width:128px;height:128px;box-shadow:var(--shadow-lg)}
.cat-av.plus{border:2px dashed var(--line);background:transparent;color:var(--accent);font-size:30px;font-weight:300}
.cat-cards{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 14px;margin:0 -2px}
.cat-cards::-webkit-scrollbar{display:none}
.cat-card{flex:0 0 auto;width:118px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);background:var(--card);border-radius:18px;padding:12px 8px;box-shadow:var(--shadow);text-align:center;transition:transform .15s var(--ease)}
.cat-card:active{transform:scale(.95)}
.cat-card b{font-size:15px;font-family:'Space Grotesk',sans-serif}
.cat-card small{font-size:11.5px;color:var(--muted);line-height:1.3}
.cat-card.add{box-shadow:none;border-style:dashed;background:transparent}
.chips-l{align-self:center;font-size:13px;font-weight:600;color:var(--muted);flex-shrink:0}
.cat-hero{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-bottom:12px;max-width:720px;animation:rise .4s var(--ease) both}
.cat-photo{position:relative;border:0;background:none;padding:0;border-radius:50%}
.cat-photo .av-cam{top:auto;bottom:4px;left:auto;right:4px;margin:0;width:34px;height:34px}
.cat-id{min-width:0}
.cat-id h2{font-size:28px;margin-bottom:4px}
.cat-id p{margin:2px 0;color:var(--muted);font-size:14px}
.cat-age{color:var(--ink)!important;font-weight:600}
.cat-age small{color:var(--muted);font-weight:400}
.cat-notes{font-style:italic}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px}
.c-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;max-width:720px}
.c-stat{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--shadow)}
.c-stat>span{font-size:20px}
.c-stat b{font-size:14.5px;font-family:'Space Grotesk',sans-serif}
.c-stat small{font-size:11px;color:var(--muted)}
.c-stat .up{color:#e3a21a}.c-stat .down{color:#3aa7d9}
.w-chart{width:100%;height:90px;display:block;margin:2px 0 8px}
.w-area{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.w-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.w-dot{fill:var(--card);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.h-list{list-style:none;margin:0;padding:0}
.h-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 2px;color:inherit}
.h-list li:first-child .h-row{border-top:0}
.h-row:hover{background:var(--soft)}
.h-date{min-width:86px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.h-main{flex:1;min-width:0;display:flex;flex-direction:column}
.h-main small{color:var(--muted);font-size:12.5px}
.h-next{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,#3aa7d9 16%,var(--card));white-space:nowrap}
.coat-prev{display:flex;justify-content:center}
@media (max-width:640px){
  .cat-hero{flex-direction:column;text-align:center;padding:16px}
  .c-stats{grid-template-columns:repeat(2,1fr)}
  .h-date{min-width:74px}
}
/* Ideas de citas */
.notes-seg{margin-bottom:12px;width:max-content;max-width:100%}
.roulette-btn{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;width:100%;max-width:560px;text-align:left;border:0;border-radius:var(--r-lg);padding:14px 18px;margin-bottom:12px;background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .14s var(--ease)}
.roulette-btn:active{transform:scale(.97)}
.roulette-btn span{grid-row:1/3;font-size:34px}
.roulette-btn b{font-size:18px;font-family:'Space Grotesk',sans-serif}
.roulette-btn small{opacity:.9}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.idea{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.idea.done{opacity:.7}
.idea-e{font-size:28px}
.idea-main{flex:1;min-width:0;display:flex;flex-direction:column}
.idea-main b{font-size:15px;line-height:1.3}
.idea-main small{color:var(--muted);font-size:12.5px}
.idea-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ideas-done{margin-top:16px}
.ideas-done summary{cursor:pointer;font-weight:700;color:var(--muted);margin-bottom:10px}
.roulette{display:grid;place-items:center;padding:10px 0}
.rl-win{width:100%;min-height:140px;border-radius:20px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.rl-win span{font-size:40px;line-height:1}
.rl-win b{font-size:19px;font-family:'Space Grotesk',sans-serif;line-height:1.25}
.rl-win.tick{animation:rl .12s ease}
.rl-win.final{animation:pop .5s var(--spring)}
@keyframes rl{from{transform:translateY(-6px);opacity:.6}}
.rl-btns{justify-content:center}
.rl-btns[hidden]{display:none}
/* Celebración */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-40px;left:var(--x);font-style:normal;font-size:24px;animation:fall var(--d) ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r));opacity:.2}}
@media (max-width:640px){
  .hub{grid-template-columns:1fr}
  .mood-opts small{display:none}
  .mood-opts button{padding:10px 2px}
  .ideas{grid-template-columns:1fr}
  .idea{flex-wrap:wrap}
  .idea-btns{width:100%;justify-content:flex-end}
  .balance{max-width:none}
}

/* Para quien prefiere menos movimiento en su teléfono */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" src="/logo.svg" alt="" width="44" height="44">
      <div class="brand-txt">
        <h1>Michis</h1>
        <div class="rainbow" aria-hidden="true">
          <span style="background:#ffab91"></span><span style="background:#ffcc80"></span><span style="background:#fff176"></span><span style="background:#a5d6a7"></span><span style="background:#81d4fa"></span><span style="background:#b39ddb"></span><span style="background:#f48fb1"></span>
        </div>
        <small class="tagline">nuestra agenda</small>
      </div>
    </div>
    <nav class="tabs" aria-label="Secciones">

      <button data-view="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-4.4A8.5 8.5 0 1 1 20.5 11.5z"/></svg><span class="tl">Chat</span><span class="badge" id="chatBadge"></span></button>
      <button data-view="notas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h14A1.5 1.5 0 0 1 20.5 5v9.5l-6 6H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5z"/><path d="M20.5 14.5h-4.5a1.5 1.5 0 0 0-1.5 1.5v4.5"/></svg><span class="tl">Notitas</span></button>
      <button data-view="gatos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.75V4.25l4.3 3.4a9.4 9.4 0 0 1 6.4 0l4.3-3.4v6.5a7.5 7.25 0 0 1-15 0z"/><path class="dots" d="M9.25 12.25h.01M14.75 12.25h.01"/><path d="M11 15.25h2l-1 1.1z"/></svg><span class="tl">Michis</span></button>
      <button data-view="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h9M18.5 7.5H20M4 16.5h2.5M11 16.5h9"/><circle cx="16" cy="7.5" r="2.5"/><circle cx="8.5" cy="16.5" r="2.5"/></svg><span class="tl">Ajustes</span></button>
    </nav>
    <div class="spacer"></div>
    <button class="sync" id="sync" data-view="ajustes" data-mode="checking"><i></i><span>Conectando…</span></button>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<script>
(() => {
'use strict';

/* ---------- Constantes ---------- */
const LS = 'agenda-pareja-v1', LS_ME = 'agenda-pareja-yo', LS_PIN = 'agenda-pareja-pin';
const LS_CHAT = 'agenda-pareja-chat', LS_READ = 'agenda-pareja-leido', LS_NOTIF = 'agenda-pareja-avisos', LS_SENT = 'agenda-pareja-avisados';
const LEAD_MIN = 10; // minutos de anticipación para los avisos
const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_S = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYCOL = ['#ffab91','#ffcc80','#fff176','#a5d6a7','#81d4fa','#b39ddb','#f48fb1'];
const TYPES = { pareja:'En pareja', personal:'Personal', quehacer:'Quehacer', salida:'Salida' };
const FREQ = { all:'Cada semana', '13':'Semanas 1 y 3 del mes', '24':'Semanas 2 y 4 del mes', once:'Solo un día' };
const KINDS = {
  importante:{ l:'Importante', c:'#e8574f' },
  cumple:{ l:'Cumpleaños', c:'#ef9a2e' },
  aniversario:{ l:'Aniversario', c:'#e05b8f' },
  salida:{ l:'Salida / cita', c:'#8c6bc8' },
  pago:{ l:'Pago / trámite', c:'#3aa7d9' },
  otro:{ l:'Otro', c:'#4fa860' }
};
const NOTE_COLORS = ['#fff3a3','#ffd6e5','#cfe9ff','#d4f5d6','#e4dcff','#ffe0c2'];

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => Date.now();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDk = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const wdi = d => (d.getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -wdi(x)); };
const todayKey = () => dk(new Date());
function t12(t){ if(!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${pad(m)}`; }
function ampm(t){ return Number(t.split(':')[0]) < 12 ? 'AM' : 'PM'; }
function range(s, e){
  if (!e) return `${t12(s)} ${ampm(s)}`;
  return ampm(s) === ampm(e) ? `${t12(s)} – ${t12(e)} ${ampm(e)}` : `${t12(s)} ${ampm(s)} – ${t12(e)} ${ampm(e)}`;
}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- Horario base ---------- */
function seedBlocks(){
  const L = [];
  const add = (day, start, end, title, type, who, freq = 'all') =>
    L.push({ id:`seed-${L.length}`, day, start, end, title, type, who, freq, updatedAt:1 });
  const tarde = d => {
    add(d,'15:45','17:15','Ejercicio','personal','cada');
    add(d,'17:15','18:45','Hobby (lectura, juegos, proyectos)','personal','cada');
  };
  add(0,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','a');
  add(0,'15:00','15:30','Barrer y sacar la basura','quehacer','b');
  add(0,'15:30','15:45','Limpiar arenero de los gatos','quehacer','a');
  tarde(0);
  add(0,'18:45','19:45','Café o té y plática del día','pareja','ambos');
  add(0,'19:45','21:00','Cena juntos','pareja','ambos');

  add(1,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','b');
  add(1,'15:00','15:15','Limpiar arenero de los gatos','quehacer','a');
  tarde(1);
  add(1,'18:45','19:45','Serie o juego de mesa','pareja','ambos');
  add(1,'19:45','21:00','Cena juntos','pareja','ambos');

  add(2,'15:00','15:45','Lavar y tender ropa','quehacer','a');
  add(2,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','b');
  add(2,'15:30','15:45','Limpiar arenero de los gatos','quehacer','b');
  tarde(2);
  add(2,'18:45','19:45','Cocinar juntos la cena','pareja','ambos');
  add(2,'19:45','21:00','Cena sin pantallas','pareja','ambos');

  add(3,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','a');
  add(3,'15:00','15:45','Limpieza rápida (baño o cocina)','quehacer','b');
  add(3,'15:30','15:45','Limpiar arenero de los gatos','quehacer','a');
  tarde(3);
  add(3,'18:45','19:45','Caminata o paseo corto juntos','pareja','ambos');
  add(3,'19:45','21:00','Cena juntos','pareja','ambos');

  add(4,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','a');
  add(4,'15:00','15:30','Doblar y guardar ropa','quehacer','b');
  add(4,'15:30','15:45','Limpiar arenero de los gatos','quehacer','b');
  tarde(4);
  add(4,'18:45','21:00','Noche de cita en casa','pareja','ambos');

  add(5,'13:00','14:30','Ejercicio','personal','cada');
  add(5,'14:30','16:00','Hobby (lectura, juegos, proyectos)','personal','cada');
  add(5,'16:00','21:00','Salida: comida o cena fuera, paseo o cine','salida','ambos','13');
  add(5,'16:00','18:30','Tarde libre','personal','cada','24');
  add(5,'18:30','21:00','Noche en casa: cocinar juntos y película','pareja','ambos','24');

  add(6,'09:00','10:30','Limpieza general','quehacer','ambos');
  add(6,'10:30','12:00','Desayuno largo / brunch','pareja','ambos');
  add(6,'12:00','13:00','Súper y despensa','quehacer','ambos');
  add(6,'13:00','14:30','Hobby (lectura, juegos, proyectos)','personal','cada');
  add(6,'14:30','17:00','Tiempo libre','personal','cada');
  add(6,'17:00','17:30','Planear la semana y el menú','pareja','ambos');
  add(6,'17:30','18:30','Preparar cenas de la semana','quehacer','ambos');
  add(6,'18:30','21:00','Descanso antes de la semana','personal','cada');
  return L;
}

/* ---------- Estado ---------- */
// Colecciones que se sincronizan entre los dos teléfonos
const COLLS = ['blocks', 'events', 'notes', 'checks', 'plans', 'moods', 'cats', 'catlog', 'catcare', 'cathealth', 'ideas'];
const KEEP_MS = { catlog:90 * 864e5, moods:120 * 864e5 }; // registros que se limpian solos con el tiempo
const empty = () => Object.assign({ v:1, settings:{ nameA:'Él', nameB:'Ella', updatedAt:0 } }, Object.fromEntries(COLLS.map(c => [c, []])));
function load(){
  try { const r = JSON.parse(store.get(LS)); if (r && r.v) return Object.assign(empty(), r); } catch(e){}
  return empty();
}
let S = load();
if (!S.blocks.length) S.blocks = seedBlocks();

function mergeColl(a = [], b = [], keep){
  const m = new Map();
  for (const x of a) if (x && x.id) m.set(x.id, x);
  for (const y of b){ if (!y || !y.id) continue; const x = m.get(y.id); if (!x || (y.updatedAt||0) > (x.updatedAt||0)) m.set(y.id, y); }
  let out = [...m.values()];
  if (keep){ const min = Date.now() - keep; out = out.filter(x => (x.updatedAt || 0) >= min); }
  return out;
}
function merge(s1, s2){
  s2 = s2 || {};
  const a = s1.settings || {}, b = s2.settings || {};
  const out = { v:1, settings:(b.updatedAt||0) > (a.updatedAt||0) ? b : a };
  for (const c of COLLS) out[c] = mergeColl(s1[c] || [], s2[c] || [], KEEP_MS[c]);
  return out;
}
const saveLocal = () => store.set(LS, JSON.stringify(S));
const live = coll => S[coll].filter(x => !x.deleted);
function upsert(coll, obj){
  obj.updatedAt = now();
  const i = S[coll].findIndex(x => x.id === obj.id);
  if (i >= 0) S[coll][i] = obj; else S[coll].push(obj);
  commit();
}
function removeItem(coll, id){
  const x = S[coll].find(x => x.id === id);
  if (x){ x.deleted = true; x.updatedAt = now(); commit(); }
}
function commit(){ saveLocal(); render(); schedulePush(); }

/* ---------- Vista ---------- */
const ui = {
  view: 'semana',
  week: mondayOf(new Date()),
  month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  who: 'todos',
  day: wdi(new Date())
};
const me = () => store.get(LS_ME) || '';
const nameOf = w => w === 'a' ? S.settings.nameA : w === 'b' ? S.settings.nameB : w === 'ambos' ? 'Ambos' : 'Cada quien';
const whoOk = b => ui.who === 'todos' || b.who === ui.who || b.who === 'ambos' || b.who === 'cada';

function blocksFor(date, all = false){
  const key = dk(date), wd = wdi(date), n = Math.ceil(date.getDate() / 7);
  return live('blocks').filter(b => {
    if (b.freq === 'once') return b.date === key;
    if (b.day !== wd) return false;
    if (b.freq === '13') return n === 1 || n === 3;
    if (b.freq === '24') return n === 2 || n === 4;
    return true;
  }).filter(b => all || whoOk(b)).sort((x, y) => (x.start||'').localeCompare(y.start||'') || x.title.localeCompare(y.title));
}
const eventsFor = key => live('events').filter(e => e.date === key).sort((a,b) => (a.title||'').localeCompare(b.title||''));
const isDone = (id, key) => S.checks.some(c => c.id === `${id}|${key}` && c.done && !c.deleted);
function toggleDone(id, key){
  if (!id || !key) return;
  const done = !isDone(id, key);
  ui.pop = `${id}|${key}`;
  upsert('checks', { id:`${id}|${key}`, done, by:me() }); // "by": quién la hizo, para el balance de quehaceres
  ui.pop = '';
  if (done && navigator.vibrate) navigator.vibrate(30);
  toast(done ? '¡Hecho! ✓' : 'Marcada como pendiente');
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === ui.view ? 'page' : 'false'));
  moveTabInd();
  renderBanner();
  const main = $('#main');
  // La animación de entrada solo corre al cambiar de sección, no en cada sincronización.
  main.classList.remove('enter');
  if (ui.enter){ void main.offsetWidth; main.classList.add('enter'); ui.enter = false; }
  if (ui.view === 'chat'){
    // El chat se arma una sola vez y luego se actualiza por partes (para no cortar videos que se estén viendo).
    if (!$('#chatShell')){
      chat.ready = false; main.innerHTML = viewChat(); applyChatBg(); loadImgs($('#chatShell .chat-head')); fitChat(); chatUpdate(true); chat.ready = true;
      if (chat.replyTo) setReply(chat.replyTo);
      $('#chatIn') && matchMedia('(pointer:fine)').matches && $('#chatIn').focus();
    }
    else { chatUpdate(); refreshChatHead(); }
    return;
  }
  // loadImgs carga las fotos de perfil (ánimo del día, balance de quehaceres, michis…)
  if (ui.view === 'semana'){ main.innerHTML = viewWeek(); centerDayChips(); loadImgs(main); }
  else if (ui.view === 'mes') main.innerHTML = viewMonth();
  else if (ui.view === 'notas'){ main.innerHTML = ui.notesTab === 'ideas' ? viewIdeas() : viewNotes(); loadImgs(main); }
  else if (ui.view === 'gatos'){ main.innerHTML = viewCats(); loadImgs(main); }
  else { main.innerHTML = viewSettings(); loadImgs(main); }
}
// Deja el día elegido en medio de los 5 visibles (en lunes/martes y sábado/domingo se queda en la orilla).
// Parte de donde estaba la tira y se desliza suave hasta su lugar.
function centerDayChips(){
  const el = document.querySelector('.daychips');
  if (!el || getComputedStyle(el).display === 'none') return;
  const chips = el.children; if (!chips.length) return;
  const start = Math.max(0, Math.min(chips.length - 5, ui.day - 2));
  const target = chips[start].offsetLeft - chips[0].offsetLeft;
  el.scrollLeft = ui.chipScroll || 0;
  ui.chipScroll = target;
  if (Math.abs(el.scrollLeft - target) > 1) el.scrollTo({ left:target, behavior:'smooth' });
}
document.addEventListener('scroll', e => {
  if (e.target.classList && e.target.classList.contains('daychips')) ui.chipScroll = e.target.scrollLeft;
}, true);

let pendingRender = false;
function safeRender(){
  const a = document.activeElement;
  if ((a && a.closest && a.closest('#main') && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) || $('#dlg').open){ pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => {
  if (pendingRender && !$('#dlg').open){
    const a = document.activeElement;
    if (!(a && a.closest && a.closest('#main') && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))){ pendingRender = false; render(); }
  }
}, 50));

function whoSeg(){
  const opts = [['todos','Todos'],['a',S.settings.nameA],['b',S.settings.nameB]];
  return `<div class="seg" role="group" aria-label="Ver horario de">${opts.map(([v,l]) =>
    `<button data-act="who" data-v="${v}" aria-pressed="${ui.who===v}">${esc(l)}</button>`).join('')}</div>`;
}
function markHtml(e){
  const k = KINDS[e.kind] || KINDS.otro;
  return `<button class="mark" style="--k:${k.c}" data-act="edit-event" data-id="${esc(e.id)}"><span class="dot"></span><span>${esc(e.title)}</span></button>`;
}

function viewWeek(){
  const start = ui.week, end = addDays(start, 6), tk = todayKey();
  const title = start.getMonth() === end.getMonth()
    ? `${start.getDate()} – ${end.getDate()} de ${MONTHS[end.getMonth()]}`
    : `${start.getDate()} ${MONTHS[start.getMonth()].slice(0,3)} – ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}`;
  let chips = '', cols = '';
  for (let i = 0; i < 7; i++){
    const d = addDays(start, i), key = dk(d);
    chips += `<button style="--dc:${DAYCOL[i]}" data-act="pick-day" data-i="${i}" aria-pressed="${ui.day===i}">${DAYS_S[i]}<b>${d.getDate()}</b></button>`;
    const evs = eventsFor(key).map(markHtml).join('');
