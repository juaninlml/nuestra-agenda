<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf9">
<title>Nuestra agenda</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdf9; --card:#ffffff; --ink:#1f2328; --muted:#5b636d; --line:#e9e3d8; --soft:#f5f1ea;
  --accent:#d94f86; --accent-ink:#ffffff;
  --pa-bg:#fde4ee; --pa-bd:#e05b8f; --pa-tx:#8a1c4a;
  --pe-bg:#e1f2fd; --pe-bd:#3aa7d9; --pe-tx:#0b5a80;
  --qu-bg:#fff4bf; --qu-bd:#d4b400; --qu-tx:#5f4e00;
  --sa-bg:#ede6fb; --sa-bd:#8c6bc8; --sa-tx:#4527a0;
  --r:14px; --shadow:0 1px 2px rgba(31,35,40,.06),0 4px 14px rgba(31,35,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --card:#212328; --ink:#eceef1; --muted:#a6aeb8; --line:#33363d; --soft:#2a2d33;
    --pa-bg:#4a2033; --pa-tx:#ffd3e4; --pe-bg:#15364a; --pe-tx:#cfeaff;
    --qu-bg:#3f370f; --qu-tx:#fff0a6; --sa-bg:#2e2450; --sa-tx:#e2d8ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1400px;margin:0 auto;padding:16px}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{font-size:28px;line-height:1}
.rainbow{display:flex;gap:3px;width:170px;height:6px}
.rainbow span{flex:1;border-radius:3px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;min-height:40px}
.tabs button[aria-current="page"]{background:var(--card);box-shadow:var(--shadow)}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
.sync i{width:9px;height:9px;border-radius:50%;background:#b0b6bd;display:block}
.sync[data-mode="cloud"] i{background:#3fae5a}
.sync[data-mode="local"] i{background:#e3a21a}
.sync[data-mode="pin"] i,.sync[data-mode="error"] i{background:#e0503f}

/* Barra de herramientas */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.bar h2{font-size:20px;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#c0352b;border-color:#f0c4bf}
.seg{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:500;font-size:14px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}

/* Semana */
.daychips{display:none;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.daychips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:52px;font-size:12px;font-weight:600}
.daychips button b{font-size:17px;font-family:'Space Grotesk',sans-serif}
.daychips button[aria-pressed="true"]{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 30%,var(--card))}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.day>header{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;background:color-mix(in srgb,var(--dc) 38%,var(--card));border-bottom:2px solid var(--dc)}
.day>header .dn{font-weight:600;font-size:13px}
.day>header b{font-family:'Space Grotesk',sans-serif;font-size:20px;line-height:1}
.day>header .add{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;font-size:20px;line-height:1}
.day.today>header{box-shadow:inset 0 -3px 0 var(--ink)}
.day .list{display:flex;flex-direction:column;gap:6px;padding:8px}
.empty{color:var(--muted);font-size:13px;padding:8px 4px;text-align:center}
.blk{display:flex;align-items:flex-start;gap:6px;border-radius:10px;border-left:0;padding:6px 6px 6px 8px;background:var(--t-bg);color:var(--t-tx);border:1px solid color-mix(in srgb,var(--t-bd) 45%,transparent)}
.blk.done{opacity:.55}
.blk.done .ttl{text-decoration:line-through}
.blk .main{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;color:inherit}
.blk .time{font-size:11.5px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.blk .ttl{font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.blk .who{font-size:11.5px;opacity:.85;margin-top:2px}
.blk input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--t-bd);flex-shrink:0}
.t-pareja{--t-bg:var(--pa-bg);--t-bd:var(--pa-bd);--t-tx:var(--pa-tx)}
.t-personal{--t-bg:var(--pe-bg);--t-bd:var(--pe-bd);--t-tx:var(--pe-tx)}
.t-quehacer{--t-bg:var(--qu-bg);--t-bd:var(--qu-bd);--t-tx:var(--qu-tx)}
.t-salida{--t-bg:var(--sa-bg);--t-bd:var(--sa-bd);--t-tx:var(--sa-tx)}
.mark{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1.5px dashed var(--k);background:color-mix(in srgb,var(--k) 14%,var(--card));border-radius:10px;padding:5px 8px;font-size:12.5px;font-weight:600}
.mark .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex-shrink:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:block;background:var(--t-bg);border:1.5px solid var(--t-bd)}

/* Mes */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead{text-align:center;font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;padding:6px 0;border-radius:8px;background:color-mix(in srgb,var(--dc) 55%,var(--card));color:var(--ink)}
.cell{min-height:104px;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--dc) 70%,var(--line));background:color-mix(in srgb,var(--dc) 10%,var(--card));text-align:left;min-width:0}
.cell.out{opacity:.4}
.cell.today{outline:2.5px solid var(--ink);outline-offset:1px}
.cell .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.pill{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--k) 20%,var(--card));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--k);flex-shrink:0}
.pill span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);font-weight:600}
.upcoming{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.upcoming h3{font-size:17px;margin-bottom:8px}
.up-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.up-row:first-of-type{border-top:0}
.up-date{min-width:64px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px}
.up-row .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex-shrink:0}
.up-row small{color:var(--muted);display:block}

/* Notitas */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.note{border-radius:6px 6px 18px 6px;padding:14px 14px 10px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 8px 18px rgba(31,35,40,.10);display:flex;flex-direction:column;gap:8px;min-height:200px;color:#2b2b2b;transform:rotate(var(--rot))}
.note textarea{flex:1;border:0;background:transparent;resize:none;min-height:120px;font-size:15.5px;line-height:1.45;outline:none;color:#2b2b2b}
.note footer{display:flex;align-items:center;gap:6px;font-size:12px;color:#4d4d4d}
.note footer .meta{flex:1 0 auto;white-space:nowrap}
.swatch{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);padding:0}
.note .del{border:0;background:rgba(0,0,0,.07);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:#4d4d4d}
.note-tag{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.07);border-radius:999px;padding:2px 8px;align-self:flex-start}

/* Ajustes */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);max-width:720px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:10px}
.panel p{margin:6px 0 10px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:400;font-size:15px;color:var(--ink);min-height:42px}
label.f textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Diálogo */
dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,24,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:19px}
.dlg .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.dlg .actions .danger{margin-right:auto}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:38px}
.choice input{accent-color:var(--accent)}
.daylist{display:flex;flex-direction:column;gap:6px}
.hidden{display:none!important}
/* Chat */
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;vertical-align:1px}
.tabs .badge:empty{display:none}
.chat{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;max-width:820px;margin:0 auto;height:70vh;min-height:340px}
.chat-list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.chat-empty{margin:auto;text-align:center;color:var(--muted);max-width:300px;font-size:14px}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(80%,440px)}
.msg.mine{align-self:flex-end;align-items:flex-end}
.bubble{background:var(--soft);border-radius:18px 18px 18px 6px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-wrap;max-width:100%}
.msg.mine .bubble{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px}
.bubble a{color:inherit;text-decoration:underline}
.bubble.gone{font-style:italic;color:var(--muted);background:transparent;border:1px dashed var(--line)}
.msg.mine .bubble.gone{color:var(--muted);background:transparent}
.msg.sending{opacity:.6}
.msg.failed .bubble{outline:2px solid #e0503f;outline-offset:1px}
.m-media{display:flex;flex-direction:column;gap:6px;margin-top:2px;max-width:100%}
.msg.mine .m-media{align-items:flex-end}
.m-meta{font-size:11px;color:var(--muted);margin:2px 8px 6px;display:flex;gap:10px;align-items:center}
.m-meta button{border:0;background:none;padding:0;color:inherit;font-size:11px;text-decoration:underline}
.day-sep{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 12px;margin:10px 0 6px}
.m-img{display:block;max-width:min(100%,320px);max-height:360px;width:auto;height:auto;border-radius:14px;background:var(--soft);cursor:zoom-in;border:0;padding:0}
.m-img img,.m-img video{display:block;max-width:100%;max-height:360px;width:auto;height:auto;border-radius:14px}
.yt{display:block;width:min(360px,68vw);aspect-ratio:16/9;border:0;border-radius:14px;background:#000 center/cover no-repeat;position:relative;padding:0}
.yt.tall{width:min(240px,58vw);aspect-ratio:9/16}
.yt span{position:absolute;inset:0;margin:auto;width:60px;height:42px;border-radius:12px;background:rgba(230,0,0,.92);color:#fff;display:grid;place-items:center;font-size:18px}
iframe.yt{background:#000}
.tt{width:min(325px,72vw);height:575px;border:0;border-radius:14px;background:#000}
.ig{width:min(340px,72vw);height:540px;border:0;border-radius:14px;background:#fff}
.sp{width:min(340px,72vw);height:152px;border:0;border-radius:14px}
.sp.big{height:352px}
.linkcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;text-decoration:none;max-width:320px}
.linkcard b{display:block;font-size:14px}
.linkcard small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.linkcard .ico{font-size:22px}
.actcard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--t-bd);background:var(--t-bg);color:var(--t-tx);border-radius:14px;padding:10px 12px;min-width:min(240px,68vw);max-width:100%}
.actcard .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.actcard b{font-size:15.5px;line-height:1.25}
.actcard small{font-size:12.5px;opacity:.9}
.actcard .go{font-size:12.5px;font-weight:600;margin-top:4px;text-decoration:underline}
.chat-note{font-size:13px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);background:var(--soft)}
.chat-note:empty{display:none}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--card)}
.composer .icon-btn{flex-shrink:0;font-size:18px}
.composer textarea{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:20px;padding:9px 14px;background:var(--bg);resize:none;max-height:140px;min-height:40px;height:40px;line-height:1.35;font-size:15px;outline-color:var(--accent)}
.composer .btn{flex-shrink:0}
.pick{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border-radius:10px;padding:8px 10px;background:var(--t-bg);color:var(--t-tx);border:1px solid color-mix(in srgb,var(--t-bd) 50%,transparent)}
.pick small{display:block;font-size:12px;opacity:.85}
.imgview{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:12px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow);z-index:10}

@media (max-width:900px){
  .daychips{display:flex}
  .week{grid-template-columns:minmax(0,1fr)}
  .week .day{display:none}
  .week .day.active{display:block}
  .cell{min-height:64px;padding:4px;gap:2px}
  .pill span{display:none}
  .pill{padding:2px 4px;justify-content:center}
  .mhead{font-size:11px}
}
@media (max-width:520px){
  .wrap{padding:12px}
  .brand h1{font-size:24px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:8px 4px;font-size:14px}
  .tabs .badge{margin-left:2px}
  .chat{border-radius:12px}
  .chat-list{padding:10px 8px}
  .msg{max-width:88%}
  .composer .btn{padding:8px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Nuestra agenda</h1>
      <div class="rainbow" aria-hidden="true">
        <span style="background:#ffab91"></span><span style="background:#ffcc80"></span><span style="background:#fff176"></span><span style="background:#a5d6a7"></span><span style="background:#81d4fa"></span><span style="background:#b39ddb"></span><span style="background:#f48fb1"></span>
      </div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button data-view="semana">Semana</button>
      <button data-view="mes">Mes</button>
      <button data-view="chat">Chat<span class="badge" id="chatBadge"></span></button>
      <button data-view="notas">Notitas</button>
      <button data-view="ajustes">Ajustes</button>
    </nav>
    <div class="spacer"></div>
    <button class="sync" id="sync" data-view="ajustes" data-mode="checking"><i></i><span>Conectando…</span></button>
  </header>
  <main id="main"></main>
</div>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog"></form></dialog>
<input type="file" id="importFile" accept="application/json" class="hidden">
<input type="file" id="chatFile" accept="image/*" class="hidden">

<script>
(() => {
'use strict';

/* ---------- Constantes ---------- */
const LS = 'agenda-pareja-v1', LS_ME = 'agenda-pareja-yo', LS_PIN = 'agenda-pareja-pin';
const LS_CHAT = 'agenda-pareja-chat', LS_READ = 'agenda-pareja-leido', LS_NOTIF = 'agenda-pareja-avisos', LS_SENT = 'agenda-pareja-avisados';
const LEAD_MIN = 10; // minutos de anticipación para los avisos
const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_S = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYCOL = ['#ffab91','#ffcc80','#fff176','#a5d6a7','#81d4fa','#b39ddb','#f48fb1'];
const TYPES = { pareja:'En pareja', personal:'Personal', quehacer:'Quehacer', salida:'Salida' };
const FREQ = { all:'Cada semana', '13':'Semanas 1 y 3 del mes', '24':'Semanas 2 y 4 del mes', once:'Solo un día' };
const KINDS = {
  importante:{ l:'Importante', c:'#e8574f' },
  cumple:{ l:'Cumpleaños', c:'#ef9a2e' },
  aniversario:{ l:'Aniversario', c:'#e05b8f' },
  salida:{ l:'Salida / cita', c:'#8c6bc8' },
  pago:{ l:'Pago / trámite', c:'#3aa7d9' },
  otro:{ l:'Otro', c:'#4fa860' }
};
const NOTE_COLORS = ['#fff3a3','#ffd6e5','#cfe9ff','#d4f5d6','#e4dcff','#ffe0c2'];

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => Date.now();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDk = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const wdi = d => (d.getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -wdi(x)); };
const todayKey = () => dk(new Date());
function t12(t){ if(!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${pad(m)}`; }
function ampm(t){ return Number(t.split(':')[0]) < 12 ? 'AM' : 'PM'; }
function range(s, e){
  if (!e) return `${t12(s)} ${ampm(s)}`;
  return ampm(s) === ampm(e) ? `${t12(s)} – ${t12(e)} ${ampm(e)}` : `${t12(s)} ${ampm(s)} – ${t12(e)} ${ampm(e)}`;
}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- Estado ---------- */
const empty = () => ({ v:1, settings:{ nameA:'Él', nameB:'Ella', updatedAt:0 }, blocks:[], events:[], notes:[], checks:[] });
function load(){
  try { const r = JSON.parse(store.get(LS)); if (r && r.v) return Object.assign(empty(), r); } catch(e){}
  return empty();
}
let S = load();
if (!S.blocks.length) S.blocks = seedBlocks();

function mergeColl(a = [], b = []){
  const m = new Map();
  for (const x of a) if (x && x.id) m.set(x.id, x);
  for (const y of b){ if (!y || !y.id) continue; const x = m.get(y.id); if (!x || (y.updatedAt||0) > (x.updatedAt||0)) m.set(y.id, y); }
  return [...m.values()];
}
function merge(s1, s2){
  s2 = s2 || {};
  const a = s1.settings || {}, b = s2.settings || {};
  return { v:1, settings:(b.updatedAt||0) > (a.updatedAt||0) ? b : a,
    blocks:mergeColl(s1.blocks, s2.blocks), events:mergeColl(s1.events, s2.events),
    notes:mergeColl(s1.notes, s2.notes), checks:mergeColl(s1.checks, s2.checks) };
}
const saveLocal = () => store.set(LS, JSON.stringify(S));
const live = coll => S[coll].filter(x => !x.deleted);
function upsert(coll, obj){
  obj.updatedAt = now();
  const i = S[coll].findIndex(x => x.id === obj.id);
  if (i >= 0) S[coll][i] = obj; else S[coll].push(obj);
  commit();
}
function removeItem(coll, id){
  const x = S[coll].find(x => x.id === id);
  if (x){ x.deleted = true; x.updatedAt = now(); commit(); }
}
function commit(){ saveLocal(); render(); schedulePush(); }

/* ---------- Vista ---------- */
const ui = {
  view: 'semana',
  week: mondayOf(new Date()),
  month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  who: 'todos',
  day: wdi(new Date())
};
const me = () => store.get(LS_ME) || '';
const nameOf = w => w === 'a' ? S.settings.nameA : w === 'b' ? S.settings.nameB : w === 'ambos' ? 'Ambos' : 'Cada quien';
const whoOk = b => ui.who === 'todos' || b.who === ui.who || b.who === 'ambos' || b.who === 'cada';

function blocksFor(date, all = false){
  const key = dk(date), wd = wdi(date), n = Math.ceil(date.getDate() / 7);
  return live('blocks').filter(b => {
    if (b.freq === 'once') return b.date === key;
    if (b.day !== wd) return false;
    if (b.freq === '13') return n === 1 || n === 3;
    if (b.freq === '24') return n === 2 || n === 4;
    return true;
  }).filter(b => all || whoOk(b)).sort((x, y) => (x.start||'').localeCompare(y.start||'') || x.title.localeCompare(y.title));
}
const eventsFor = key => live('events').filter(e => e.date === key).sort((a,b) => (a.title||'').localeCompare(b.title||''));
const isDone = (id, key) => S.checks.some(c => c.id === `${id}|${key}` && c.done && !c.deleted);

function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === ui.view ? 'page' : 'false'));
  const main = $('#main');
  if (ui.view === 'chat'){
    // El chat se arma una sola vez y luego se actualiza por partes (para no cortar videos que se estén viendo).
    if (!$('#chatShell')){ main.innerHTML = viewChat(); fitChat(); chatUpdate(true); $('#chatIn') && matchMedia('(pointer:fine)').matches && $('#chatIn').focus(); }
    else chatUpdate();
    return;
  }
  if (ui.view === 'semana') main.innerHTML = viewWeek();
  else if (ui.view === 'mes') main.innerHTML = viewMonth();
  else if (ui.view === 'notas') main.innerHTML = viewNotes();
  else main.innerHTML = viewSettings();
}
let pendingRender = false;
function safeRender(){
  const a = document.activeElement;
  if ((a && a.closest && a.closest('#main') && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) || $('#dlg').open){ pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => {
  if (pendingRender && !$('#dlg').open){
    const a = document.activeElement;
    if (!(a && a.closest && a.closest('#main') && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))){ pendingRender = false; render(); }
  }
}, 50));

function whoSeg(){
  const opts = [['todos','Todos'],['a',S.settings.nameA],['b',S.settings.nameB]];
  return `<div class="seg" role="group" aria-label="Ver horario de">${opts.map(([v,l]) =>
    `<button data-act="who" data-v="${v}" aria-pressed="${ui.who===v}">${esc(l)}</button>`).join('')}</div>`;
}
function markHtml(e){
  const k = KINDS[e.kind] || KINDS.otro;
  return `<button class="mark" style="--k:${k.c}" data-act="edit-event" data-id="${esc(e.id)}"><span class="dot"></span><span>${esc(e.title)}</span></button>`;
}

function viewWeek(){
  const start = ui.week, end = addDays(start, 6), tk = todayKey();
  const title = start.getMonth() === end.getMonth()
    ? `${start.getDate()} – ${end.getDate()} de ${MONTHS[end.getMonth()]}`
    : `${start.getDate()} ${MONTHS[start.getMonth()].slice(0,3)} – ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}`;
  let chips = '', cols = '';
  for (let i = 0; i < 7; i++){
    const d = addDays(start, i), key = dk(d);
    chips += `<button style="--dc:${DAYCOL[i]}" data-act="pick-day" data-i="${i}" aria-pressed="${ui.day===i}">${DAYS_S[i]}<b>${d.getDate()}</b></button>`;
    const evs = eventsFor(key).map(markHtml).join('');
    const bl = blocksFor(d).map(b => {
      const done = isDone(b.id, key);
      return `<div class="blk t-${esc(b.type)}${done?' done':''}">
        <input type="checkbox" data-act="toggle" data-id="${esc(b.id)}" data-date="${key}" ${done?'checked':''} aria-label="Marcar como hecho: ${esc(b.title)}">
        <button class="main" data-act="edit-block" data-id="${esc(b.id)}" data-date="${key}">
          <div class="time">${esc(range(b.start, b.end))}${b.freq==='13'||b.freq==='24'?' · cada 2 semanas':''}</div>
          <div class="ttl">${esc(b.title)}</div>
          <div class="who">${esc(nameOf(b.who))}</div>
        </button></div>`;
    }).join('');
    cols += `<section class="day${key===tk?' today':''}${ui.day===i?' active':''}" style="--dc:${DAYCOL[i]}">
      <header><span class="dn">${DAYS[i]}</span><b>${d.getDate()}</b>
        <button class="add" data-act="add-block" data-date="${key}" aria-label="Agregar actividad el ${DAYS[i]}">+</button></header>
      <div class="list">${evs}${bl || (evs ? '' : '<div class="empty">Día libre</div>')}</div>
    </section>`;
  }
  return `<div class="bar">
      <button class="icon-btn" data-act="wk" data-n="-1" aria-label="Semana anterior">‹</button>
      <h2>${esc(title)}</h2>
      <button class="icon-btn" data-act="wk" data-n="1" aria-label="Semana siguiente">›</button>
      <button class="btn" data-act="wk-today">Hoy</button>
      <div class="spacer"></div>
      ${whoSeg()}
      <button class="btn" data-act="add-event" data-date="${dk(addDays(start, Math.min(ui.day,6)))}">+ Fecha importante</button>
    </div>
    <div class="daychips">${chips}</div>
    <div class="week">${cols}</div>
    <div class="legend">${Object.entries(TYPES).map(([k,l]) => `<span class="t-${k}"><i></i>${l}</span>`).join('')}
      <span>Toca una actividad para editarla · marca la casilla cuando esté hecha</span></div>`;
}

function viewMonth(){
  const m = ui.month, first = new Date(m.getFullYear(), m.getMonth(), 1), start = mondayOf(first), tk = todayKey();
  let html = DAYS_S.map((d,i) => `<div class="mhead" style="--dc:${DAYCOL[i]}">${d}</div>`).join('');
  for (let k = 0; k < 42; k++){
    const d = addDays(start, k), key = dk(d), i = k % 7;
    const items = eventsFor(key).map(e => ({ t:e.title, c:(KINDS[e.kind]||KINDS.otro).c }));
    blocksFor(d).filter(b => b.type === 'salida').forEach(b => items.push({ t:b.title.split(':')[0], c:KINDS.salida.c }));
    const shown = items.slice(0, 3).map(x => `<div class="pill" style="--k:${x.c}"><i class="dot"></i><span>${esc(x.t)}</span></div>`).join('');
    const more = items.length > 3 ? `<div class="more">+${items.length-3} más</div>` : '';
    html += `<button class="cell${d.getMonth()!==m.getMonth()?' out':''}${key===tk?' today':''}" style="--dc:${DAYCOL[i]}" data-act="day" data-date="${key}" aria-label="${d.getDate()} de ${MONTHS[d.getMonth()]}${items.length?', '+items.length+' marcadores':''}">
      <span class="num">${d.getDate()}</span>${shown}${more}</button>`;
  }
  const from = todayKey(), to = dk(addDays(new Date(), 90));
  const up = live('events').filter(e => e.date >= from && e.date <= to).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 12);
  const upHtml = up.length ? up.map(e => {
    const d = parseDk(e.date), k = KINDS[e.kind] || KINDS.otro;
    return `<button class="up-row" style="--k:${k.c}" data-act="edit-event" data-id="${esc(e.id)}">
      <span class="up-date">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</span><span class="dot"></span>
      <span><b>${esc(e.title)}</b><small>${esc(k.l)}${e.note?' · '+esc(e.note):''}</small></span></button>`;
  }).join('') : '<div class="empty">Todavía no hay fechas marcadas. Toca un día del calendario para agregar una.</div>';
  return `<div class="bar">
      <button class="icon-btn" data-act="mo" data-n="-1" aria-label="Mes anterior">‹</button>
      <h2 style="text-transform:capitalize">${MONTHS[m.getMonth()]} ${m.getFullYear()}</h2>
      <button class="icon-btn" data-act="mo" data-n="1" aria-label="Mes siguiente">›</button>
      <button class="btn" data-act="mo-today">Hoy</button>
      <div class="spacer"></div>
      <button class="btn primary" data-act="add-event" data-date="${todayKey()}">+ Marcador</button>
    </div>
    <div class="month">${html}</div>
    <div class="legend">${Object.values(KINDS).map(k => `<span><i style="background:${k.c};border-color:${k.c};border-radius:50%"></i>${k.l}</span>`).join('')}</div>
    <div class="upcoming"><h3>Próximas fechas</h3>${upHtml}</div>`;
}

function viewNotes(){
  const notes = live('notes').sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const cards = notes.map((n, i) => {
    const sw = NOTE_COLORS.map(c => `<button type="button" class="swatch" style="background:${c}" data-act="note-color" data-id="${esc(n.id)}" data-c="${c}" aria-label="Cambiar color"></button>`).join('');
    const when = new Date(n.createdAt || n.updatedAt);
    return `<article class="note" style="background:${esc(n.color||NOTE_COLORS[0])};--rot:${[-1.2,0.8,-0.4,1.1,-0.9,0.5][i%6]}deg">
      ${n.author ? `<span class="note-tag">${esc(nameOf(n.author))}</span>` : ''}
      <textarea data-note="${esc(n.id)}" aria-label="Texto de la notita" placeholder="Escribe aquí…">${esc(n.text)}</textarea>
      <footer><span class="meta">${when.getDate()} ${MONTHS[when.getMonth()].slice(0,3)}</span>${sw}
        <button type="button" class="del" data-act="note-del" data-id="${esc(n.id)}" aria-label="Borrar notita">✕</button></footer>
    </article>`;
  }).join('');
  return `<div class="bar"><h2>Notitas</h2><div class="spacer"></div>
      <button class="btn primary" data-act="note-add">+ Nueva notita</button></div>
    ${cards ? `<div class="notes">${cards}</div>` : '<div class="panel"><p>Aquí van recados, ideas para salidas, lista del súper o lo que quieran dejarse el uno al otro.</p><button class="btn primary" data-act="note-add">+ Primera notita</button></div>'}`;
}

/* ---------- Diálogos ---------- */
const dlg = $('#dlg'), form = $('#dlgForm');
let onSave = null, onDelete = null, onShare = null;
function openDialog(title, body, save, del, share){
  onSave = save; onDelete = del || null; onShare = share || null;
  if (share) body += `<button type="button" class="btn" data-dlg="share" style="align-self:flex-start">💬 Enviar al chat</button>`;
  form.innerHTML = `<h3>${esc(title)}</h3>${body}
    <div class="actions">${del ? '<button type="button" class="btn danger" data-dlg="del">Borrar</button>' : ''}
      <button type="button" class="btn" data-dlg="cancel">Cancelar</button>
      ${save ? '<button type="submit" class="btn primary" value="ok">Guardar</button>' : ''}</div>`;
  dlg.showModal();
  const f = form.querySelector('input:not([type=radio]),textarea'); if (f && save) f.focus();
}
function closeDialog(){ dlg.close(); if (pendingRender){ pendingRender = false; render(); } }
form.addEventListener('submit', e => {
  e.preventDefault();
  if (onSave && onSave(new FormData(form)) !== false) closeDialog();
});
form.addEventListener('click', e => {
  const b = e.target.closest('[data-dlg]'); if (!b) return;
  if (b.dataset.dlg === 'cancel') closeDialog();
  if (b.dataset.dlg === 'del' && onDelete && confirmDel(b)){ onDelete(); closeDialog(); }
  if (b.dataset.dlg === 'add-ev'){ const k = b.dataset.date; closeDialog(); eventDialog(null, k); }
  if (b.dataset.dlg === 'ev'){ const id = b.dataset.id; closeDialog(); eventDialog(live('events').find(x => x.id === id)); }
  if (b.dataset.dlg === 'share' && onShare){ const f = onShare; closeDialog(); f(); }
  if (b.dataset.dlg === 'send-act'){
    const item = live(b.dataset.coll).find(x => x.id === b.dataset.id);
    const note = (form.querySelector('[name=note]') || {}).value || '';
    closeDialog();
    if (item) shareActivity(b.dataset.coll, item, b.dataset.date, note.trim());
  }
});
form.addEventListener('change', e => { if (e.target.id === 'pickDate') $('#pickList').innerHTML = pickList(e.target.value); });
dlg.addEventListener('close', () => { if (pendingRender){ pendingRender = false; render(); } });
function confirmDel(b){
  if (b.dataset.sure) return true;
  b.dataset.sure = '1'; b.textContent = '¿Seguro? Toca otra vez';
  return false;
}
const opt = (obj, sel) => Object.entries(obj).map(([v,l]) => `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l.l || l)}</option>`).join('');

function blockDialog(b, dateKey){
  const isNew = !b;
  const d = dateKey ? parseDk(dateKey) : new Date();
  b = b || { id:uid(), title:'', day:wdi(d), start:'18:00', end:'19:00', type:'pareja', who:'ambos', freq:'all', date:dateKey || todayKey() };
  const whoOpts = { ambos:'Ambos', a:S.settings.nameA, b:S.settings.nameB, cada:'Cada quien' };
  openDialog(isNew ? 'Nueva actividad' : 'Editar actividad', `

/* ---------- Sincronización ---------- */
const sync = { mode:'checking', timer:null, busy:false };
function setMode(m){
  sync.mode = m;
  const el = $('#sync'); el.dataset.mode = m;
  el.querySelector('span').textContent = { cloud:'Sincronizado', local:'Solo en este teléfono', pin:'Falta PIN', error:'Sin conexión', checking:'Conectando…' }[m];
  if (ui.view === 'ajustes') safeRender();
}
async function apiTo(path, method, body){
  const h = { 'Content-Type':'application/json' }, pin = store.get(LS_PIN);
  if (pin) h['x-pin'] = pin;
  return fetch(path, { method, headers:h, cache:'no-store', body:body ? JSON.stringify(body) : undefined });
}
const api = (method, body) => apiTo('/api/state', method, body);
function applyRemote(rs){
  if (!rs) return;
  const before = JSON.stringify(S);
  S = merge(S, rs);
  if (JSON.stringify(S) !== before){ saveLocal(); safeRender(); }
}
async function handle(r){
  if (r.status === 401){ setMode('pin'); return; }
  if (r.status === 404 || r.status === 501){ setMode('local'); return; }
  if (!r.ok){ setMode('error'); return; }
  const d = await r.json(); setMode('cloud'); applyRemote(d.state);
}
async function push(){
  if (location.protocol === 'file:'){ setMode('local'); return; }
  if (sync.busy){ schedulePush(); return; }
  sync.busy = true;
  try { await handle(await api('POST', { state:S })); } catch(e){ setMode(navigator.onLine ? 'local' : 'error'); }
  sync.busy = false;
}
async function pull(){
  if (location.protocol === 'file:' || sync.mode === 'local' || sync.busy) return;
  try { await handle(await api('GET')); } catch(e){ setMode('error'); }
}
function schedulePush(){ clearTimeout(sync.timer); sync.timer = setTimeout(push, 800); }
setInterval(pull, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
window.addEventListener('online', push);

/* Links, videos y GIFs */
const URL_RE = /https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?¡¿)\]]/gi;
function linkify(text){
  let out = '', last = 0;
  for (const m of text.matchAll(URL_RE)){
    out += esc(text.slice(last, m.index)) + `<a href="${esc(m[0])}" target="_blank" rel="noopener noreferrer">${esc(m[0])}</a>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function linkCard(u, name, ico){
  return `<a class="linkcard" href="${esc(u.href)}" target="_blank" rel="noopener noreferrer"><span class="ico">${ico}</span><span><b>Abrir en ${esc(name)}</b><small>${esc(u.hostname + u.pathname)}</small></span></a>`;
}
const imgTag = (src, extra = '') => `<button type="button" class="m-img" data-act="img-view"><img src="${esc(src)}" alt="Imagen" loading="lazy" referrerpolicy="no-referrer" ${extra}></button>`;
function embedFor(url){
  let u; try { u = new URL(url); } catch(e){ return ''; }
  const h = u.hostname.replace(/^(www|m|mobile)\./, ''), p = u.pathname;
  let m;
  // YouTube (videos, shorts, en vivo)
  let yt = null;
  if (h === 'youtu.be') yt = p.slice(1, 12);
  else if (h.endsWith('youtube.com')) yt = u.searchParams.get('v') || ((m = p.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/)) && m[1]);
  if (yt && /^[\w-]{11}$/.test(yt)){
    const tall = /^\/shorts\//.test(p);
    return `<button type="button" class="yt${tall?' tall':''}" data-act="yt" data-id="${yt}" style="background-image:url('https://i.ytimg.com/vi/${yt}/hqdefault.jpg')" aria-label="Reproducir video de YouTube"><span>▶</span></button>`;
  }
  // TikTok
  if (h.endsWith('tiktok.com')){
    if ((m = p.match(/\/video\/(\d+)/))) return `<iframe class="tt" src="https://www.tiktok.com/embed/v2/${m[1]}" loading="lazy" allow="encrypted-media; fullscreen" allowfullscreen title="Video de TikTok"></iframe>`;
    return linkCard(u, 'TikTok', '🎵');
  }
  // Instagram (posts y reels)
  if (h === 'instagram.com' && (m = p.match(/^\/(?:p|reels?|tv)\/([\w-]+)/)))
    return `<iframe class="ig" src="https://www.instagram.com/p/${m[1]}/embed" loading="lazy" title="Publicación de Instagram"></iframe>`;
  // Spotify
  if (h === 'open.spotify.com' && (m = p.match(/^\/(?:intl-[\w-]+\/)?(track|album|playlist|episode|show)\/(\w+)/)))
    return `<iframe class="sp${m[1]==='track'||m[1]==='episode'?'':' big'}" src="https://open.spotify.com/embed/${m[1]}/${m[2]}" loading="lazy" allow="encrypted-media" title="Spotify"></iframe>`;
  // GIPHY
  if (h.endsWith('giphy.com')){
    let id = (m = p.match(/\/media\/(?:v1\.[^/]+\/)?([A-Za-z0-9]{6,})\//)) ? m[1] : null;
    if (!id && /^\/(gifs|stickers)\//.test(p)) id = p.split('/')[2].split('-').pop();
    if (id && /^[A-Za-z0-9]{6,}$/.test(id)) return imgTag(`https://media.giphy.com/media/${id}/giphy.gif`);
  }
  // Imágenes y videos directos (incluye media.tenor.com)
  if (/\.(gif|png|jpe?g|webp|avif)$/i.test(p)) return imgTag(u.href);
  if (/\.(mp4|webm)$/i.test(p)) return `<div class="m-img"><video src="${esc(u.href)}" autoplay loop muted playsinline controls></video></div>`;
  if (h === 'facebook.com' || h === 'fb.watch') return linkCard(u, 'Facebook', '📘');
  if (h === 'x.com' || h === 'twitter.com') return linkCard(u, 'X', '✖️');
  return '';
}

function dayLabel(key){
  const t = todayKey(), y = dk(addDays(new Date(), -1)), tm = dk(addDays(new Date(), 1));
  if (key === t) return 'Hoy';
  if (key === y) return 'Ayer';
  if (key === tm) return 'Mañana';
  const d = parseDk(key);
  return `${DAYS[wdi(d)]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
function actCardHtml(a){
  let style = '', cls = '';
  if (a.coll === 'events'){ const c = (KINDS[a.kind]||KINDS.otro).c; style = `--t-bd:${c};--t-bg:color-mix(in srgb,${c} 16%,var(--card));--t-tx:var(--ink)`; }
  else cls = ` t-${esc(a.kind)}`;
  const bits = [a.date ? dayLabel(a.date) : '', a.time, a.who].filter(Boolean).map(esc).join(' · ');
  return `<button type="button" class="actcard${cls}" style="${style}" data-act="goto" data-coll="${esc(a.coll)}" data-id="${esc(a.id)}" data-date="${esc(a.date)}">
    <span class="lbl">📅 ${esc(a.label || 'Actividad')}</span><b>${esc(a.title)}</b><small>${bits}</small><span class="go">Ver en la agenda ›</span></button>`;
}
function hm(ts){ const d = new Date(ts); const h = d.getHours(); return `${h%12||12}:${pad(d.getMinutes())} ${h<12?'AM':'PM'}`; }

function msgHtml(m){
  const mine = !!m.author && m.author === me();
  const cls = `msg${mine?' mine':''}${m.local==='sending'?' sending':''}${m.local==='failed'?' failed':''}`;
  if (m.deleted) return `<div class="${cls}"><div class="bubble gone">Mensaje borrado</div></div>`;
  const media = [];
  if (m.act) media.push(actCardHtml(m.act));
  if (m.localImg) media.push(imgTag(m.localImg));
  else if (m.img) media.push(`<button type="button" class="m-img" data-act="img-view"><img data-img="${esc(m.img)}" alt="Imagen" ${m.w&&m.h?`width="${m.w}" height="${m.h}"`:''}></button>`);
  const first = m.text && (m.text.match(URL_RE) || [])[0];
  const emb = first ? embedFor(first) : '';
  if (emb) media.push(emb);
  // Si el mensaje es solo un link con vista previa, no repetimos el link en texto.
  const onlyLink = emb && m.text.trim() === first;
  const text = m.text && !onlyLink ? `<div class="bubble">${linkify(m.text)}</div>` : '';
  let meta = hm(m.at || Date.now());
  if (!mine && m.author) meta = esc(nameOf(m.author)) + ' · ' + meta;
  if (m.local === 'sending') meta += ' · Enviando…';
  if (m.local === 'failed') meta += ` · No se envió <button type="button" data-act="msg-retry" data-id="${esc(m.id)}">Reintentar</button>`;
  else if (mine && !m.local) meta += ` <button type="button" data-act="msg-del" data-id="${esc(m.id)}">Borrar</button>`;
  return `<div class="${cls}">${text}${media.length ? `<div class="m-media">${media.join('')}</div>` : ''}<div class="m-meta">${meta}</div></div>`;
}

// Actualiza la lista sin rehacer los mensajes que no cambiaron.
function chatUpdate(forceBottom){
  const list = $('#chatList'); if (!list) return;
  const note = $('#chatNote'); if (note) note.textContent = chatNoteText();
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  const items = [];
  let lastDay = '';
  for (const m of sortedMsgs()){
    const day = dk(new Date(m.at || Date.now()));
    if (day !== lastDay){ items.push({ key:'d-'+day, ver:dayLabel(day), html:`<div class="day-sep">${esc(dayLabel(day))}</div>` }); lastDay = day; }
    items.push({ key:'m-'+m.id, ver:`${m.upd||0}|${m.local||''}|${m.deleted?1:0}|${me()}`, html:null, m });
  }
  if (!items.length){ list.innerHTML = `<div class="chat-empty">Aquí pueden mandarse memes, GIFs, videos de YouTube o TikTok y compartir actividades de la agenda con el botón 📅.</div>`; return; }
  const empty = list.querySelector('.chat-empty'); if (empty) empty.remove();
  const nodes = new Map([...list.children].map(n => [n.dataset.key, n]));
  let cur = list.firstElementChild;
  for (const it of items){
    const ex = nodes.get(it.key);
    if (ex && ex.dataset.ver === it.ver){
      if (ex !== cur) list.insertBefore(ex, cur); else cur = cur.nextElementSibling;
      continue;
    }
    const tmp = document.createElement('div'); tmp.innerHTML = it.html || msgHtml(it.m);
    const n = tmp.firstElementChild; n.dataset.key = it.key; n.dataset.ver = it.ver;
    if (ex){ if (ex === cur) cur = cur.nextElementSibling; ex.replaceWith(n); if (n.nextElementSibling !== cur) list.insertBefore(n, cur); }
    else list.insertBefore(n, cur);
  }
  while (cur){ const nx = cur.nextElementSibling; cur.remove(); cur = nx; }
  loadImgs(list);
  if (forceBottom || nearBottom) list.scrollTop = list.scrollHeight;
  list.querySelectorAll('img').forEach(i => { if (!i.complete) i.addEventListener('load', () => { if (forceBottom || nearBottom) list.scrollTop = list.scrollHeight; }, { once:true }); });
}
async function loadImgs(root){
  for (const img of root.querySelectorAll('img[data-img]:not([src])')){
    const id = img.dataset.img;
    if (imgCache.has(id)){ img.src = imgCache.get(id); continue; }
    if (!store.get(LS_PIN)){ img.src = `/api/chat?img=${encodeURIComponent(id)}`; continue; }
    try {
      const r = await apiTo(`/api/chat?img=${encodeURIComponent(id)}`, 'GET');
      if (!r.ok) continue;
      const url = URL.createObjectURL(await r.blob());
      imgCache.set(id, url); img.src = url;
    } catch(e){}
  }
}

function setChatStatus(s){
  if (chat.status === s) return;
  chat.status = s;
  const note = $('#chatNote'); if (note) note.textContent = chatNoteText();
}
async function chatPull(){
  if (location.protocol === 'file:'){ setChatStatus('local'); return; }
  if (chat.pulling) return;
  chat.pulling = true;
  try {
    const r = await apiTo('/api/chat' + (chat.cursor ? `?since=${chat.cursor}` : ''), 'GET');
    if (r.status === 401) setChatStatus('pin');
    else if (r.status === 404 || r.status === 501) setChatStatus('local');
    else if (!r.ok) setChatStatus('error');
    else { const d = await r.json(); setChatStatus('ok'); chatMerge(d.messages || []); }
  } catch(e){ setChatStatus('error'); }
  chat.pulling = false;
}
function chatMerge(list){
  let changed = false;
  for (const m of list){
    const old = chat.msgs.get(m.id);
    if (!old || old.local || (m.upd||0) > (old.upd||0)){ chat.msgs.set(m.id, m); changed = true; }
    if ((m.upd||0) > chat.cursor) chat.cursor = m.upd;
  }
  if (changed){ saveChat(); chatUpdate(); markRead(); updateBadge(); }
}
function unread(){
  const last = Number(store.get(LS_READ) || 0), mine = me();
  return [...chat.msgs.values()].filter(m => !m.deleted && !m.local && m.author !== mine && (m.at||0) > last).length;
}
function updateBadge(){
  const n = unread(), b = $('#chatBadge');
  b.textContent = ui.view === 'chat' || !n ? '' : n > 9 ? '9+' : String(n);
  document.title = n && ui.view !== 'chat' ? `(${n}) Nuestra agenda` : 'Nuestra agenda';
}
function markRead(){
  if (ui.view !== 'chat' || document.hidden) return;
  const max = Math.max(0, ...[...chat.msgs.values()].map(m => m.at || 0));
  if (max > Number(store.get(LS_READ) || 0)) store.set(LS_READ, String(max));
  updateBadge();
}

async function chatPost(msg, image){
  try {
    const r = await apiTo('/api/chat', 'POST', { msg:{ id:msg.id, author:msg.author, text:msg.text, act:msg.act }, image, endpoint:notif.endpoint });
    if (r.status === 413) throw new Error('grande');
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json(), m = d.message;
    if (image && m.img) imgCache.set(m.img, image.data);
    chat.outbox.delete(msg.id);
    chat.msgs.set(m.id, m); saveChat(); chatUpdate(true);
    return true;
  } catch(e){
    msg.local = 'failed'; chat.msgs.set(msg.id, { ...msg }); chatUpdate();
    toast(e.message === 'grande' ? 'La imagen es muy pesada' : 'No se pudo enviar el mensaje');
    return false;
  }
}
function chatSend({ text = '', act = null, image = null }){
  if (!me()){ whoAmIDialog(); return false; }
  if (chat.status === 'local' || chat.status === 'pin'){ toast(chat.status === 'pin' ? 'Falta el PIN (Ajustes)' : 'El chat necesita la base de datos en la nube'); return false; }
  const msg = { id:uid(), author:me(), text, act, at:Date.now(), local:'sending' };
  if (image) msg.localImg = image.data;
  chat.outbox.set(msg.id, { msg, image });
  chat.msgs.set(msg.id, msg); chatUpdate(true);
  chatPost(msg, image);
  return true;
}
function chatRetry(id){
  const o = chat.outbox.get(id); if (!o) return;
  o.msg.local = 'sending'; chat.msgs.set(id, { ...o.msg }); chatUpdate();
  chatPost(o.msg, o.image);
}
async function chatDelete(id){
  try {
    const r = await apiTo('/api/chat', 'POST', { del:id });
    if (!r.ok) throw 0;
    const d = await r.json(); chat.msgs.set(id, d.message); saveChat(); chatUpdate();
  } catch(e){ toast('No se pudo borrar'); }
}

// Imágenes: se reducen antes de enviarlas; los GIF se mandan tal cual para que sigan animados.
const readData = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); });
const loadImg = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
async function prepImage(file){
  if (!/^image\//.test(file.type)) throw new Error('tipo');
  const data = await readData(file);
  const img = await loadImg(data);
  if (file.type === 'image/gif'){
    if (file.size > 2.8 * 1024 * 1024) throw new Error('gif');
    return { data, w:img.naturalWidth, h:img.naturalHeight };
  }
  const max = 1280, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  return { data:c.toDataURL('image/jpeg', 0.82), w, h };
}
async function sendImageFile(file){
  if (!me()){ whoAmIDialog(); return; }
  try { chatSend({ text:($('#chatIn') && $('#chatIn').value.trim()) || '', image:await prepImage(file) }); if ($('#chatIn')){ $('#chatIn').value = ''; growInput(); } }
  catch(e){ toast(e.message === 'gif' ? 'Ese GIF pesa más de 2.8 MB' : e.message === 'tipo' ? 'Solo se pueden enviar imágenes' : 'No se pudo leer la imagen'); }
}
$('#chatFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) sendImageFile(f); e.target.value = ''; });
function growInput(){ const t = $('#chatIn'); if (!t) return; t.style.height = '40px'; t.style.height = Math.min(140, t.scrollHeight + 3) + 'px'; }
function submitChat(){
  const t = $('#chatIn'); if (!t) return;
  const text = t.value.trim(); if (!text) return;
  if (!me()){ whoAmIDialog(); return; }
  t.value = ''; growInput();
  chatSend({ text });
}
document.addEventListener('submit', e => { if (e.target.id === 'composer'){ e.preventDefault(); submitChat(); } });
document.addEventListener('keydown', e => {
  if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches){ e.preventDefault(); submitChat(); }
});
document.addEventListener('input', e => { if (e.target.id === 'chatIn') growInput(); });
document.addEventListener('paste', e => {
  if (e.target.id !== 'chatIn') return;
  const f = [...(e.clipboardData && e.clipboardData.files || [])].find(x => /^image\//.test(x.type));
  if (f){ e.preventDefault(); sendImageFile(f); }
});

/* Compartir actividades */
function actSnap(coll, item, date){
  if (coll === 'events'){
    const k = KINDS[item.kind] || KINDS.otro;
    return { coll, id:item.id, date:item.date, title:item.title, time:'', who:'', kind:item.kind, label:k.l };
  }
  return { coll:'blocks', id:item.id, date, title:item.title, time:range(item.start, item.end), who:nameOf(item.who), kind:item.type, label:TYPES[item.type] || 'Actividad' };
}
function shareActivity(coll, item, date, text = ''){
  if (chatSend({ text, act:actSnap(coll, item, date) }) && ui.view !== 'chat') toast('Enviado al chat');
}
function pickList(key){
  if (!key) return '';
  const d = parseDk(key);
  const evs = eventsFor(key).map(e => { const k = KINDS[e.kind] || KINDS.otro;
    return `<button type="button" class="pick" style="--t-bd:${k.c};--t-bg:color-mix(in srgb,${k.c} 16%,var(--card));--t-tx:var(--ink)" data-dlg="send-act" data-coll="events" data-id="${esc(e.id)}" data-date="${key}"><span>📌</span><span><b>${esc(e.title)}</b><small>${esc(k.l)}</small></span></button>`; });
  const bl = blocksFor(d, true).map(b => `<button type="button" class="pick t-${esc(b.type)}" data-dlg="send-act" data-coll="blocks" data-id="${esc(b.id)}" data-date="${key}"><span><b>${esc(b.title)}</b><small>${esc(range(b.start, b.end))} · ${esc(nameOf(b.who))}</small></span></button>`);
  const all = evs.concat(bl);
  return all.length ? all.join('') : '<div class="empty">No hay actividades ese día.</div>';
}
function pickDialog(){
  const key = todayKey();
  openDialog('Compartir una actividad', `
    <label class="f">Día<input type="date" id="pickDate" value="${key}"></label>
    <label class="f">Mensaje (opcional)<input name="note" maxlength="300" placeholder="Ej. ¿Vamos a esta?"></label>
    <div class="daylist" id="pickList" style="max-height:46vh;overflow:auto">${pickList(key)}</div>`, null);
}

setInterval(() => {
  if (document.hidden) return;
  chat.tick++;
  if (ui.view === 'chat' || chat.tick % 5 === 0) chatPull();
}, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ chatPull(); markRead(); } });

/* ---------- Avisos (notificaciones) ---------- */
const notif = { reg:null, endpoint:'', push:false };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function prefs(){ try { return Object.assign({ on:false, acts:true, chat:true }, JSON.parse(store.get(LS_NOTIF))); } catch(e){ return { on:false, acts:true, chat:true }; } }
function setPrefs(p){ store.set(LS_NOTIF, JSON.stringify({ ...prefs(), ...p })); }
const canNotify = () => 'Notification' in window && Notification.permission === 'granted';

function notifPanel(){
  const p = prefs(), supported = 'Notification' in window && 'serviceWorker' in navigator;
  let body;
  if (!supported && isIOS && !standalone()){
    body = `<p>En iPhone los avisos solo funcionan si la app está en la pantalla de inicio: toca <b>Compartir → Agregar a pantalla de inicio</b>, ábrela desde ahí y vuelve a esta sección.</p>`;
  } else if (!supported){
    body = `<p>Este navegador no permite avisos. Prueba con Chrome, Edge, Firefox o Safari actualizado.</p>`;
  } else if (Notification.permission === 'denied'){
    body = `<p>Los avisos están bloqueados para este sitio. Actívalos en los permisos del navegador (el candado junto a la dirección) y vuelve aquí.</p>`;
  } else if (!p.on || !canNotify()){
    body = `<p>Recibe un aviso ${LEAD_MIN} minutos antes de cada actividad y cuando te llegue un mensaje en el chat.</p>
      <div class="row"><button class="btn primary" data-act="notif-on">🔔 Activar avisos en este teléfono</button></div>`;
  } else {
    const st = notif.push ? 'Activados: llegan aunque la app esté cerrada.' : 'Activados mientras la app esté abierta. Para recibirlos con la app cerrada hace falta la base de datos en la nube y el cron (ver LEEME.md).';
    body = `<p>${st}</p>
      <label class="check"><input type="checkbox" data-pref="acts" ${p.acts?'checked':''}> Avisarme ${LEAD_MIN} minutos antes de cada actividad</label>
      <label class="check"><input type="checkbox" data-pref="chat" ${p.chat?'checked':''}> Avisarme de mensajes nuevos en el chat</label>
      ${me() ? '' : '<p>Elige arriba quién usa este teléfono para recibir solo tus actividades y las de los dos.</p>'}
      <div class="row"><button class="btn" data-act="notif-test">Probar aviso</button><button class="btn" data-act="notif-off">Desactivar</button></div>`;
  }
  return `<section class="panel"><h3>Avisos</h3>${body}</section>`;
}

async function swReg(){
  if (notif.reg) return notif.reg;
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return null;
  try { notif.reg = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready; } catch(e){ notif.reg = null; }
  return notif.reg;
}
function b64u(s){
  const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function refreshPush(){
  const p = prefs();
  if (!p.on || !canNotify()) return;
  const reg = await swReg();
  if (!reg || !('PushManager' in window)){ notif.push = false; return; }
  try {
    const r = await apiTo('/api/push', 'GET');
    if (!r.ok) throw 0;
    const { publicKey } = await r.json();
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey){
      const cur = btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      if (cur !== publicKey){ await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(publicKey) });
    notif.endpoint = sub.endpoint;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    const s = await apiTo('/api/push', 'POST', { sub:sub.toJSON(), who:me(), tz, acts:p.acts, chat:p.chat });
    notif.push = s.ok;
  } catch(e){ notif.push = false; }
  if (ui.view === 'ajustes') safeRender();
}
async function enableNotifs(){
  if (!('Notification' in window)){ toast('Este navegador no permite avisos'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ toast('No se dio permiso para los avisos'); render(); return; }
  setPrefs({ on:true });
  await swReg();
  render();
  toast('Avisos activados');
  await refreshPush();
  localReminders();
}
async function disableNotifs(){
  setPrefs({ on:false });
  try {
    const reg = await swReg(), sub = reg && await reg.pushManager.getSubscription();
    if (sub){ await apiTo('/api/push', 'POST', { remove:sub.endpoint }); await sub.unsubscribe(); }
  } catch(e){}
  notif.push = false; notif.endpoint = '';
  render(); toast('Avisos desactivados');
}
async function showLocal(title, body, tag, url){
  try {
    const reg = await swReg();
    const opts = { body, tag, icon:'/icon-192.png', badge:'/icon-192.png', data:{ url } };
    if (reg) await reg.showNotification(title, opts);
    else { const n = new Notification(title, opts); n.onclick = () => { window.focus(); openUrl(url); n.close(); }; }
  } catch(e){}
}
async function testNotif(){
  if (notif.push && notif.endpoint){
    try { const r = await apiTo('/api/push', 'POST', { test:notif.endpoint }); if (r.ok && (await r.json()).ok){ toast('Aviso de prueba enviado'); return; } } catch(e){}
  }
  showLocal('Nuestra agenda', '¡Listo! Así se verán los avisos.', 'test', '/');
}

// Mientras la app está abierta también revisa cada 30 s (por si el cron del servidor no está configurado).
// Usa la misma etiqueta que el servidor, así el teléfono no muestra el aviso dos veces.
function localReminders(){
  const p = prefs();
  if (!p.on || !p.acts || !canNotify()) return;
  let sent = {};
  try { sent = JSON.parse(store.get(LS_SENT)) || {}; } catch(e){}
  const t = now();
  for (const k in sent) if (t - sent[k] > 2 * 864e5) delete sent[k];
  const d0 = new Date(), nowMin = d0.getHours() * 60 + d0.getMinutes(), mine = me();
  [[d0, 0], [addDays(d0, 1), 1440]].forEach(([d, off]) => {
    const key = dk(d);
    for (const b of blocksFor(d, true)){
      if (!b.start || isDone(b.id, key)) continue;
      if (mine && (b.who === 'a' || b.who === 'b') && b.who !== mine) continue;
      const [h, m] = b.start.split(':').map(Number);
      const until = h * 60 + m + off - nowMin;
      const tag = `act:${b.id}|${key}`;
      if (until <= 0 || until > LEAD_MIN || sent[tag]) continue;
      sent[tag] = t;
      const who = b.who === 'ambos' || b.who === 'a' || b.who === 'b' ? ' · ' + nameOf(b.who) : '';
      showLocal(`En ${until} min: ${b.title}`, range(b.start, b.end) + who, tag, `/?view=semana&date=${key}`);
      if (!document.hidden) toast(`En ${until} min: ${b.title}`);
    }
  });
  store.set(LS_SENT, JSON.stringify(sent));
}
setInterval(localReminders, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open') openUrl(e.data.url); });

/* ---------- Inicio ---------- */
saveLocal();
render();
push();
chatPull().then(updateBadge);
if (new URLSearchParams(location.search).has('view')){ openUrl(location.href); history.replaceState(null, '', location.pathname); }
if (prefs().on && canNotify()){ swReg().then(refreshPush); localReminders(); }
if (!me()) setTimeout(whoAmIDialog, 300);
})();
</script>
