function viewMonth(){
  const m = ui.month, first = new Date(m.getFullYear(), m.getMonth(), 1), start = mondayOf(first), tk = todayKey();
  let html = DAYS_S.map((d,i) => `<div class="mhead" style="--dc:${DAYCOL[i]}">${d}</div>`).join('');
  for (let k = 0; k < 42; k++){
    const d = addDays(start, k), key = dk(d), i = k % 7;
    const items = eventsFor(key).map(e => ({ t:e.title, c:(KINDS[e.kind]||KINDS.otro).c }));
    blocksFor(d).filter(b => b.type === 'salida').forEach(b => items.push({ t:b.title.split(':')[0], c:KINDS.salida.c }));
    const shown = items.slice(0, 3).map(x => `<div class="pill" style="--k:${x.c}"><i class="dot"></i><span>${esc(x.t)}</span></div>`).join('');
    const more = items.length > 3 ? `<div class="more">+${items.length-3} más</div>` : '';
    html += `<button class="cell${d.getMonth()!==m.getMonth()?' out':''}${key===tk?' today':''}" style="--dc:${DAYCOL[i]}" data-act="day" data-date="${key}" aria-label="${d.getDate()} de ${MONTHS[d.getMonth()]}${items.length?', '+items.length+' marcadores':''}">
      <span class="num">${d.getDate()}</span>${shown}${more}</button>`;
  }
  const from = todayKey(), to = dk(addDays(new Date(), 90));
  const up = live('events').filter(e => e.date >= from && e.date <= to).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 12);
  const upHtml = up.length ? up.map(e => {
    const d = parseDk(e.date), k = KINDS[e.kind] || KINDS.otro;
    return `<button class="up-row" style="--k:${k.c}" data-act="edit-event" data-id="${esc(e.id)}">
      <span class="up-date">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</span><span class="dot"></span>
      <span><b>${esc(e.title)}</b><small>${esc(k.l)}${e.note?' · '+esc(e.note):''}</small></span></button>`;
  }).join('') : '<div class="empty">Todavía no hay fechas marcadas. Toca un día del calendario para agregar una.</div>';
  return `<div class="bar">
      <button class="icon-btn" data-act="mo" data-n="-1" aria-label="Mes anterior">‹</button>
      <h2 style="text-transform:capitalize">${MONTHS[m.getMonth()]} ${m.getFullYear()}</h2>
      <button class="icon-btn" data-act="mo" data-n="1" aria-label="Mes siguiente">›</button>
      <button class="btn" data-act="mo-today">Hoy</button>
      <div class="spacer"></div>
      <button class="btn primary" data-act="add-event" data-date="${todayKey()}">+ Marcador</button>
    </div>
    <div class="month">${html}</div>
    <div class="legend">${Object.values(KINDS).map(k => `<span><i style="background:${k.c};border-color:${k.c};border-radius:50%"></i>${k.l}</span>`).join('')}</div>
    <div class="upcoming"><h3>Próximas fechas</h3>${upHtml}</div>`;
}

// GIF o sticker pegado en una notita
function noteMediaHtml(n){
  if (!n.media) return '';
  return `<div class="note-media ${n.media.kind === 'sticker' ? 'stk' : 'gif'}"><img ${mediaSrc(n.media)} alt="${n.media.kind === 'sticker' ? 'Sticker' : 'GIF'}">
    <button type="button" class="nm-del" data-act="note-media-del" data-id="${esc(n.id)}" aria-label="Quitar ${n.media.kind === 'sticker' ? 'sticker' : 'GIF'}">✕</button></div>`;
}
const shortDate = t => { const d = new Date(t); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
function viewNotes(){
  const all = live('notes'), ids = new Set(all.map(n => n.id));
  // Las respuestas viven dentro de su notita; si la original ya no existe, se muestran solas.
  const notes = all.filter(n => !n.parent || !ids.has(n.parent)).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const repliesOf = id => all.filter(r => r.parent === id).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  const cards = notes.map((n, i) => {
    const sw = NOTE_COLORS.map(c => `<button type="button" class="swatch" style="background:${c}" data-act="note-color" data-id="${esc(n.id)}" data-c="${c}" aria-label="Cambiar color"></button>`).join('');
    const reps = repliesOf(n.id).map(r => `<div class="reply" style="background:${esc(r.color || '#ffffff')}">
        <div class="reply-h"><span class="note-tag">↩ ${esc(r.author ? nameOf(r.author) : 'Respuesta')}</span><span class="meta">${shortDate(r.createdAt || r.updatedAt)}</span>
          <button type="button" class="mini" data-act="note-media" data-id="${esc(r.id)}" aria-label="Agregar GIF o sticker a la respuesta" title="GIF o sticker">🎞️</button>
          <button type="button" class="mini" data-act="note-del" data-id="${esc(r.id)}" aria-label="Borrar respuesta">✕</button></div>
        ${noteMediaHtml(r)}
        <textarea data-note="${esc(r.id)}" rows="2" aria-label="Texto de la respuesta" placeholder="${r.media ? 'Agrega un mensaje…' : 'Escribe tu respuesta…'}">${esc(r.text)}</textarea>
      </div>`).join('');
    return `<article class="note${n.media ? ' has-media' : ''}" style="background:${esc(n.color||NOTE_COLORS[0])};--rot:${[-1.2,0.8,-0.4,1.1,-0.9,0.5][i%6]}deg">
      ${n.author ? `<span class="note-tag">${esc(nameOf(n.author))}</span>` : ''}
      ${noteMediaHtml(n)}
      <textarea data-note="${esc(n.id)}" aria-label="Texto de la notita" placeholder="${n.media ? 'Agrega un mensaje…' : 'Escribe aquí…'}">${esc(n.text)}</textarea>
      <footer><span class="meta">${shortDate(n.createdAt || n.updatedAt)}</span><span class="sws">${sw}</span>
        <button type="button" class="del" data-act="note-media" data-id="${esc(n.id)}" aria-label="Agregar GIF o sticker" title="GIF o sticker">🎞️</button>
        <button type="button" class="del" data-act="note-del" data-id="${esc(n.id)}" aria-label="Borrar notita">✕</button></footer>
      ${reps ? `<div class="replies">${reps}</div>` : ''}
      <button type="button" class="reply-btn" data-act="note-reply" data-id="${esc(n.id)}">↩ Responder</button>
    </article>`;
  }).join('');
  return `${notesSeg()}<div class="bar"><h2>Notitas</h2><div class="spacer"></div>
      <button class="btn primary" data-act="note-add">+ Nueva notita</button></div>
    ${cards ? `<div class="notes">${cards}</div>` : '<div class="panel"><p>Aquí van recados, ideas para salidas, lista del súper o lo que quieran dejarse el uno al otro.</p><button class="btn primary" data-act="note-add">+ Primera notita</button></div>'}`;
}

/* ---------- Diálogos ---------- */
const dlg = $('#dlg'), form = $('#dlgForm');
let onSave = null, onDelete = null, onShare = null, dlgExtra = {};
function openDialog(title, body, save, del, share){
  onSave = save; onDelete = del || null; onShare = share || null; dlgExtra = {};
  form.oninput = form.onchange = null; // cada ventana pone sus propios avisos en vivo (choques de horario, etc.)
  if (share) body += `<button type="button" class="btn" data-dlg="share" style="align-self:flex-start">💬 Enviar al chat</button>`;
  form.innerHTML = `<h3>${esc(title)}</h3>${body}
    <div class="actions">${del ? '<button type="button" class="btn danger" data-dlg="del">Borrar</button>' : ''}
      <button type="button" class="btn" data-dlg="cancel">Cancelar</button>
      ${save ? '<button type="submit" class="btn primary" value="ok">Guardar</button>' : ''}</div>`;
  dlg.showModal();
  // En el teléfono no se enfoca solo: el teclado taparía la hoja apenas se abre.
  const f = form.querySelector('input:not([type=radio]),textarea'); if (f && save && matchMedia('(pointer:fine)').matches) f.focus();
}
function closeDialog(){ dlg.close(); if (pendingRender){ pendingRender = false; render(); } }
form.addEventListener('submit', e => {
  e.preventDefault();
  if (onSave && onSave(new FormData(form)) !== false) closeDialog();
});
form.addEventListener('click', e => {
  const b = e.target.closest('[data-dlg]'); if (!b) return;
  if (b.dataset.dlg === 'cancel') closeDialog();
  if (b.dataset.dlg === 'del' && onDelete && confirmDel(b)){ onDelete(); closeDialog(); }
  if (b.dataset.dlg === 'add-ev'){ const k = b.dataset.date; closeDialog(); eventDialog(null, k); }
  if (b.dataset.dlg === 'ev'){ const id = b.dataset.id; closeDialog(); eventDialog(live('events').find(x => x.id === id)); }
  if (b.dataset.dlg.startsWith('x:') && dlgExtra[b.dataset.dlg.slice(2)]) dlgExtra[b.dataset.dlg.slice(2)](b);
  if (b.dataset.dlg === 'share' && onShare){ const f = onShare; closeDialog(); f(); }
  if (b.dataset.dlg === 'send-act'){
    const item = live(b.dataset.coll).find(x => x.id === b.dataset.id);
    const note = (form.querySelector('[name=note]') || {}).value || '';
    closeDialog();
    if (item) shareActivity(b.dataset.coll, item, b.dataset.date, note.trim());
  }
});
form.addEventListener('change', e => { if (e.target.id === 'pickDate') $('#pickList').innerHTML = pickList(e.target.value); });
dlg.addEventListener('close', () => { if (pendingRender){ pendingRender = false; render(); } });
function confirmDel(b){
  if (b.dataset.sure) return true;
  b.dataset.sure = '1'; b.textContent = '¿Seguro? Toca otra vez';
  return false;
}
const opt = (obj, sel) => Object.entries(obj).map(([v,l]) => `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l.l || l)}</option>`).join('');

function blockDialog(b, dateKey){
  const isNew = !b;
  const d = dateKey ? parseDk(dateKey) : new Date();
  b = b || { id:uid(), title:'', day:wdi(d), start:'18:00', end:'19:00', type:'pareja', who:'ambos', freq:'all', date:dateKey || todayKey() };
  const whoOpts = { ambos:'Ambos', a:S.settings.nameA, b:S.settings.nameB, cada:'Cada quien' };
  const doneNow = !isNew && dateKey && isDone(b.id, dateKey);
  openDialog(isNew ? 'Nueva actividad' : 'Editar actividad', `
    ${!isNew && dateKey ? `<button type="button" class="btn ${doneNow ? '' : 'primary'}" data-dlg="x:done" style="justify-content:center;min-height:48px;font-size:16px">${doneNow ? '↩ Marcar como pendiente' : '✓ Ya la hicimos'}</button>` : ''}
    <label class="f">Actividad<input name="title" required maxlength="80" value="${esc(b.title)}" placeholder="Ej. Cena con amigos"></label>
    <div class="fields">
      <label class="f">Inicio<input name="start" type="time" required value="${esc(b.start)}"></label>
      <label class="f">Fin<input name="end" type="time" value="${esc(b.end||'')}"></label>
    </div>
    <div class="fields">
      <label class="f">Tipo<select name="type">${opt(TYPES, b.type)}</select></label>
      <label class="f">Quién<select name="who">${opt(whoOpts, b.who)}</select></label>
    </div>
    <div class="fields">
      <label class="f">Repetir<select name="freq" id="freqSel">${opt(FREQ, b.freq)}</select></label>
      <label class="f" id="daySel">Día<select name="day">${DAYS.map((n,i) => `<option value="${i}" ${i===b.day?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="f" id="dateSel">Fecha<input name="date" type="date" value="${esc(b.date || dateKey || todayKey())}"></label>
    </div>
    <div id="clashBox" aria-live="polite"></div>`,
    fd => {
      const freq = fd.get('freq');
      const nb = { ...b, title:fd.get('title').trim(), start:fd.get('start'), end:fd.get('end'),
        type:fd.get('type'), who:fd.get('who'), freq };
      if (freq === 'once'){ nb.date = fd.get('date'); nb.day = wdi(parseDk(nb.date)); }
      else { nb.day = Number(fd.get('day')); delete nb.date; }
      if (!nb.title) return false;
      upsert('blocks', nb); toast('Guardado');
    },
    isNew ? null : () => { removeItem('blocks', b.id); toast('Actividad borrada'); },
    isNew ? null : () => shareActivity('blocks', b, dateKey || b.date || todayKey()));
  dlgExtra = { done:() => { closeDialog(); toggleDone(b.id, dateKey); } };
  const toggleFreq = () => { const once = $('#freqSel').value === 'once'; $('#daySel').classList.toggle('hidden', once); $('#dateSel').classList.toggle('hidden', !once); };
  $('#freqSel').addEventListener('change', toggleFreq); toggleFreq();
  // Aviso en vivo si se cruza con otra actividad (en la semana que estás viendo, si se repite)
  wireClash(fd => fd.get('freq') === 'once' ? fd.get('date') : dk(addDays(ui.week, Number(fd.get('day')))), b.id);
}

function eventDialog(e, dateKey){
  const isNew = !e;
  e = e || { id:uid(), date:dateKey || todayKey(), title:'', kind:'importante', note:'' };
  openDialog(isNew ? 'Nueva fecha importante' : 'Editar fecha', `
    <label class="f">Qué es<input name="title" required maxlength="80" value="${esc(e.title)}" placeholder="Ej. Aniversario, pago de renta…"></label>
    <div class="fields">
      <label class="f">Fecha<input name="date" type="date" required value="${esc(e.date)}"></label>
      <label class="f">Tipo<select name="kind">${opt(KINDS, e.kind)}</select></label>
    </div>
    <label class="f">Nota (opcional)<textarea name="note" maxlength="300">${esc(e.note||'')}</textarea></label>`,
    fd => {
      const ne = { ...e, title:fd.get('title').trim(), date:fd.get('date'), kind:fd.get('kind'), note:fd.get('note').trim() };

      upsert('events', ne); toast('Fecha guardada');
    },

/* ---------- Eventos de la página ---------- */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v){ go(v.dataset.view); return; }
  const el = e.target.closest('[data-act]');
  // Dentro de una ventana solo responden los botones del panel de GIFs/stickers (para las notitas).
  if (!el || (el.closest('dialog') && !/^(pk-|emo)/.test(el.dataset.act))) return;
  const a = el.dataset.act, id = el.dataset.id, date = el.dataset.date;
  switch (a){
    case 'wk': ui.week = addDays(ui.week, 7 * Number(el.dataset.n)); render(); break;
    case 'wk-today': ui.week = mondayOf(new Date()); ui.day = wdi(new Date()); render(); break;
    case 'pick-day': ui.day = Number(el.dataset.i); render(); break;
    case 'who': ui.who = el.dataset.v; render(); break;
    case 'toggle': toggleDone(id, date); break;
    // Planes, libres, resumen, balance y ánimo
    case 'plan-new': planDialog({ date:dk(addDays(ui.week, Math.min(ui.day, 6))) < todayKey() ? todayKey() : dk(addDays(ui.week, Math.min(ui.day, 6))) }); break;
    case 'plan': respondPlan(id, el.dataset.ans); break;
    case 'free': freeDialog(); break;
    case 'summary': summaryDialog(); break;
    case 'rotate': rotateDialog(); break;
    case 'mood': setMood(el.dataset.m); break;
    case 'mood-edit': ui.moodEdit = true; render(); break;
    case 'mood-note': moodNoteDialog(); break;
    // Michis
    case 'cat-pick': ui.cat = el.dataset.id || ''; render(); break;
    case 'cat-add': catDialog(); break;
    case 'cat-edit': catDialog(live('cats').find(c => c.id === id)); break;
    case 'cat-log': {
      if (!me()){ whoAmIDialog(); break; }
      const c = CARE_LOG.find(z => z[0] === el.dataset.t);
      upsert('catlog', { id:uid(), type:el.dataset.t, cat:ui.cat || '', by:me(), at:now() });
      if (navigator.vibrate) navigator.vibrate(15);
      toast(`✓ Anotado: ${c[1]} ${c[2]}${ui.cat ? ' de ' + catName(ui.cat) : ''}`); break;
    }

/* ---------- Sincronización ---------- */
const sync = { mode:'checking', timer:null, busy:false };
function setMode(m){
  sync.mode = m;
  const el = $('#sync'); el.dataset.mode = m;
  el.querySelector('span').textContent = { cloud:'Sincronizado', local:'Solo en este teléfono', pin:'Falta PIN', error:'Sin conexión', checking:'Conectando…' }[m];
  if (ui.view === 'ajustes') safeRender();
}
async function apiTo(path, method, body){
  const h = { 'Content-Type':'application/json' }, pin = store.get(LS_PIN);
  if (pin) h['x-pin'] = pin;
  return fetch(path, { method, headers:h, cache:'no-store', body:body ? JSON.stringify(body) : undefined });
}
const api = (method, body) => apiTo('/api/state', method, body);
function applyRemote(rs){
  if (!rs) return;
  const before = JSON.stringify(S);
  S = merge(S, rs);
  if (JSON.stringify(S) !== before){ saveLocal(); safeRender(); }
}
async function handle(r){
  if (r.status === 401){ setMode('pin'); return; }
  if (r.status === 404 || r.status === 501){ setMode('local'); return; }
  if (!r.ok){ setMode('error'); return; }
  const d = await r.json(); setMode('cloud'); applyRemote(d.state);
}
async function push(){
  if (location.protocol === 'file:'){ setMode('local'); return; }
  if (sync.busy){ schedulePush(); return; }
  sync.busy = true;
  try { await handle(await api('POST', { state:S })); } catch(e){ setMode(navigator.onLine ? 'local' : 'error'); }
  sync.busy = false;
}
async function pull(){
  if (location.protocol === 'file:' || sync.mode === 'local' || sync.busy) return;
  try { await handle(await api('GET')); } catch(e){ setMode('error'); }
}
function schedulePush(){ clearTimeout(sync.timer); sync.timer = setTimeout(push, 800); }
setInterval(pull, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
window.addEventListener('online', push);

   Funciones para la pareja: planes, libres juntos, choques, cuenta regresiva,
   resumen, balance de quehaceres, ánimo del día, cuidado de los michis e ideas de citas.
   ===================================================================== */
const toMin = t => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
const fromMin = x => `${pad(Math.floor(x / 60) % 24)}:${pad(x % 60)}`;
const people = w => w === 'a' ? ['a'] : w === 'b' ? ['b'] : ['a', 'b'];
const fmtDur = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : `${m} min`;
const daysUntil = key => Math.round((parseDk(key) - parseDk(todayKey())) / 864e5);
const shortDay = key => { const d = parseDk(key); return `${DAYS_S[wdi(d)]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
function ago(ts){
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'ahora'; if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`; const d = Math.floor(s / 86400); return `hace ${d} día${d > 1 ? 's' : ''}`;
}

/* --- Choques de horario --- */
function clashes(key, start, end, who, excludeId){
  if (!key || !start) return [];
  const s = toMin(start), e = end ? toMin(end) : s + 60, ps = people(who);
  return blocksFor(parseDk(key), true).filter(b => b.id !== excludeId && b.start && people(b.who).some(p => ps.includes(p)) &&
    toMin(b.start) < e && (b.end ? toMin(b.end) : toMin(b.start) + 30) > s);
}
function clashHtml(list){
  if (!list.length) return '';
  const items = list.slice(0, 3).map(b => `<b>${esc(b.title)}</b> (${esc(range(b.start, b.end))}${b.who === 'a' || b.who === 'b' ? ' · ' + esc(nameOf(b.who)) : ''})`).join(', ');
  return `<div class="clash">${ic('alert')}<span>Se cruza con ${items}${list.length > 3 ? ` y ${list.length - 3} más` : ''}</span></div>`;
}
function wireClash(getKey, excludeId){
  const box = $('#clashBox'); if (!box) return;
  const upd = () => { const fd = new FormData(form); box.innerHTML = clashHtml(clashes(getKey(fd), fd.get('start'), fd.get('end'), fd.get('who') || 'ambos', excludeId)); };
  form.oninput = form.onchange = upd; upd();
}

/* --- Libres juntos --- */
function freeSlots(key){
  const d = parseDk(key), weekend = wdi(d) >= 5;
  const from = toMin((weekend ? S.settings.freeWe : S.settings.freeWd) || (weekend ? '09:00' : '15:00'));
  const to = toMin(S.settings.freeTo || '22:30');
  const nowM = new Date().getHours() * 60 + new Date().getMinutes();
  const all = blocksFor(d, true).filter(b => b.start).map(b => ({ s:toMin(b.start), e:b.end ? toMin(b.end) : toMin(b.start) + 30, flex:b.type === 'personal' }));
  // El tiempo personal cuenta como "se puede mover": se muestra aparte
  const fixed = all.filter(x => !x.flex).sort((x, y) => x.s - y.s);
  let t = key === todayKey() ? Math.max(from, Math.ceil(nowM / 15) * 15) : from;
  const out = [];
  for (const x of fixed){ if (x.s - t >= 45 && t < to) out.push([t, Math.min(x.s, to)]); t = Math.max(t, x.e); }
  if (to - t >= 45) out.push([t, to]);
  return out.filter(([s, e]) => e - s >= 45).map(([s, e]) => [s, e, all.some(x => x.flex && x.s < e && x.e > s)]);
}
function freeDialog(){
  const days = Array.from({ length:7 }, (_, i) => dk(addDays(ui.week, i))).filter(k => k >= todayKey());
  const rows = days.map(k => {
    const sl = freeSlots(k);
    return `<div class="free-day"><div class="free-h">${esc(dayLabel(k))}</div>${sl.length ? sl.map(([s, e, flex]) =>
      `<button type="button" class="free-slot${flex ? ' flex' : ''}" data-dlg="x:slot" data-date="${k}" data-s="${fromMin(s)}" data-e="${fromMin(e)}">
        <b>${esc(range(fromMin(s), fromMin(e)))}</b><small>${fmtDur(e - s)}${flex ? ' · en tiempo personal' : ' libres los dos'}</small><span class="go">${ic('heartmail')}</span></button>`).join('')
      : '<div class="free-none">Sin espacios libres</div>'}</div>`;
  }).join('') || '<p class="hint">Esta semana ya pasó. Cambia a la semana actual o a la siguiente.</p>';
  openDialog('Libres juntos', `
    <p class="hint">${ic('info')}Espacios donde ninguno de los dos tiene nada. Toca uno para proponer un plan.</p>
    <div class="free-list">${rows}</div>
    <details class="free-cfg"><summary>Horario que se toma en cuenta</summary>
      <div class="fields">
        <label class="f">Entre semana desde<input type="time" data-free="freeWd" value="${esc(S.settings.freeWd || '15:00')}"></label>
        <label class="f">Fin de semana desde<input type="time" data-free="freeWe" value="${esc(S.settings.freeWe || '09:00')}"></label>

/* --- Balance de quehaceres --- */
function choreStats(){
  const st = { a:{ asg:0, done:0 }, b:{ asg:0, done:0 } };
  for (let i = 0; i < 7; i++){
    const d = addDays(ui.week, i), key = dk(d);
    for (const b of blocksFor(d, true).filter(b => b.type === 'quehacer')){
      const ps = people(b.who); ps.forEach(p => st[p].asg++);
      const c = S.checks.find(c => c.id === `${b.id}|${key}` && c.done && !c.deleted);
      if (c) (c.by && ps.includes(c.by) ? [c.by] : ps).forEach(p => st[p].done++);
    }
  }
  return st;
}
function balanceHtml(){
  const st = choreStats();
  if (!st.a.asg && !st.b.asg) return '';
  const diff = st.a.asg - st.b.asg, more = diff > 0 ? 'a' : 'b';
  const row = w => { const pct = st[w].asg ? Math.round(st[w].done / st[w].asg * 100) : 0;
    return `<div class="bal-row">${avatarHtml(w)}<div class="bal-main"><div class="bal-top"><b>${esc(nameOf(w))}</b><span>${st[w].done} de ${st[w].asg} hechos</span></div>
      <div class="bal-bar"><i style="width:${pct}%"></i></div></div></div>`; };
  const msg = Math.abs(diff) >= 2
    ? `<p class="bal-msg warn">⚖️ ${esc(nameOf(more))} tiene ${Math.abs(diff)} quehaceres más esta semana.</p>`
    : `<p class="bal-msg ok">💪 ¡Va parejo! Bien hecho, equipo.</p>`;
  return `<section class="balance"><div class="bal-head"><h3>Balance de quehaceres</h3>
      <button type="button" class="btn sm" data-act="rotate">${ic('swap')}Intercambiar</button></div>
    ${row('a')}${row('b')}${msg}</section>`;
}
function rotateDialog(){
  const n = live('blocks').filter(b => b.type === 'quehacer' && (b.who === 'a' || b.who === 'b')).length;
  openDialog('Intercambiar quehaceres', `<p style="margin:0">Los ${n} quehaceres de <b>${esc(nameOf('a'))}</b> pasan a <b>${esc(nameOf('b'))}</b> y al revés. Los que son "Ambos" se quedan igual.</p>

}

function ageText(birth){

  let m = (n.getFullYear() - b.getFullYear()) * 12 + n.getMonth() - b.getMonth(); if (n.getDate() < b.getDate()) m--;
  if (m < 0) return '';
  if (m < 1) { const d = Math.max(0, Math.round((n - b) / 864e5)); return `${d} día${d === 1 ? '' : 's'}`; }
  if (m < 12) return `${m} mes${m === 1 ? '' : 'es'}`;
  const y = Math.floor(m / 12), r = m % 12;
  return `${y} año${y === 1 ? '' : 's'}${r ? ` y ${r} mes${r === 1 ? '' : 'es'}` : ''}`;
}

/* --- Perfil de cada michi --- */
function weightChart(list){
  const pts = list.slice(0, 10).reverse(); if (pts.length < 2) return '';
  const vals = pts.map(p => Number(p.kg)), min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 300, H = 90, P = 10;
  const xy = vals.map((v, i) => [P + i * (W - 2 * P) / (vals.length - 1), H - P - (v - min) / span * (H - 2 * P)]);
  const line = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  return `<svg class="w-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gráfica de peso: de ${fmtKg(vals[0])} a ${fmtKg(vals.at(-1))}">

async function uploadCatPhoto(catId, file){

  try {
    const img = await loadImg(await readData(file)), SIZE = 400, side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = SIZE;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, SIZE, SIZE);
    const data = c.toDataURL('image/jpeg', 0.86);
    toast('Subiendo foto…');
    const r = await apiTo('/api/media', 'POST', { avatar:{ data } });

    const { id } = await r.json(); imgCache.set(id, data);
    upsert('cats', { ...cat, photo:id }); toast(`¡Qué guap${cat.sex === 'm' ? 'o' : 'a'}! 📸`);

function roulette(){
  const pool = live('ideas').filter(i => !i.done && (!ui.ideaCat || i.cat === ui.ideaCat));
  if (pool.length < 2){ toast(pool.length ? 'Agreguen al menos 2 ideas para girar la ruleta' : 'Primero agreguen algunas ideas 💡'); return; }
  openDialog('¿Qué hacemos hoy?', `<div class="roulette"><div class="rl-win" id="rlWin"><span>🎲</span></div></div>
    <div class="row rl-btns" id="rlBtns" hidden><button type="button" class="btn primary" data-dlg="x:go">💌 Proponer para hoy</button><button type="button" class="btn" data-dlg="x:again">🎲 Otra vez</button></div>`, null);
  let pick = null;
  dlgExtra = { go:() => { closeDialog(); planDialog({ title:pick.title, date:todayKey(), type:pick.cat === 'casa' ? 'pareja' : 'salida', ideaId:pick.id }); }, again:() => { closeDialog(); roulette(); } };
  const win = $('#rlWin'), steps = 18 + Math.floor(Math.random() * 6);
  let i = 0, last = -1;
  const spin = () => {
    if (!win.isConnected) return;
    let n; do { n = Math.floor(Math.random() * pool.length); } while (n === last && pool.length > 1);
    last = n; const it = pool[n], c = IDEA_CAT[it.cat] || IDEA_CAT.casa;
    win.innerHTML = `<span>${c[0]}</span><b>${esc(it.title)}</b>`; win.classList.remove('tick'); void win.offsetWidth; win.classList.add('tick');
    if (++i < steps) setTimeout(spin, 40 + i * i * 0.75); // se va frenando, ~3 segundos
    else { pick = it; win.classList.add('final'); $('#rlBtns').hidden = false; if (navigator.vibrate) navigator.vibrate([20, 40, 20]); }
  };
  spin();
}

// Debajo del nombre, como WhatsApp: cuándo escribió por última vez la otra persona.
function chatStatusText(){
  const other = otherOf(me() || 'a');
  // Si mandó un estado rápido en las últimas 3 horas, se muestra ese ("🚗 Saliendo del trabajo · hace 5 min")
  const st = sortedMsgs().filter(m => m.author === other && m.status && !m.deleted && Date.now() - (m.at || 0) < 3 * 3600e3).pop();
  if (st) return `${st.status.emoji} ${st.status.label} · ${ago(st.at)}`;
  const last = Math.max(0, ...[...chat.msgs.values()].filter(m => m.author === other && !m.local).map(m => m.at || 0));
  if (!last) return 'Toca aquí para ver sus fotos';
  const d = new Date(last), key = dk(d);
  return `Último mensaje: ${key === todayKey() ? 'hoy' : dayLabel(key).toLowerCase()} ${hm(last)}`;
}

/* Links, videos y GIFs */
const URL_RE = /https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?¡¿)\]]/gi;
function linkify(text){
  let out = '', last = 0;
  for (const m of text.matchAll(URL_RE)){
    out += esc(text.slice(last, m.index)) + `<a href="${esc(m[0])}" target="_blank" rel="noopener noreferrer">${esc(m[0])}</a>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function linkCard(u, name, ico){
  return `<a class="linkcard" href="${esc(u.href)}" target="_blank" rel="noopener noreferrer"><span class="ico">${ico}</span><span><b>Abrir en ${esc(name)}</b><small>${esc(u.hostname + u.pathname)}</small></span></a>`;
}
const imgTag = (src, extra = '') => `<button type="button" class="m-img" data-act="img-view"><img src="${esc(src)}" alt="Imagen" loading="lazy" referrerpolicy="no-referrer" ${extra}></button>`;
function embedFor(url){
  let u; try { u = new URL(url); } catch(e){ return ''; }
  const h = u.hostname.replace(/^(www|m|mobile)\./, ''), p = u.pathname;
  let m;
  // YouTube (videos, shorts, en vivo)
  let yt = null;
  if (h === 'youtu.be') yt = p.slice(1, 12);
  else if (h.endsWith('youtube.com')) yt = u.searchParams.get('v') || ((m = p.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/)) && m[1]);
  if (yt && /^[\w-]{11}$/.test(yt)){
    const tall = /^\/shorts\//.test(p);
    return `<button type="button" class="yt${tall?' tall':''}" data-act="yt" data-id="${yt}" style="background-image:url('https://i.ytimg.com/vi/${yt}/hqdefault.jpg')" aria-label="Reproducir video de YouTube"><span>▶</span></button>`;
  }
  // TikTok
  if (h.endsWith('tiktok.com')){
    if ((m = p.match(/\/video\/(\d+)/))) return `<iframe class="tt" src="https://www.tiktok.com/embed/v2/${m[1]}" loading="lazy" allow="encrypted-media; fullscreen" allowfullscreen title="Video de TikTok"></iframe>`;
    return linkCard(u, 'TikTok', '🎵');
  }
  // Instagram (posts y reels)
  if (h === 'instagram.com' && (m = p.match(/^\/(?:p|reels?|tv)\/([\w-]+)/)))
    return `<iframe class="ig" src="https://www.instagram.com/p/${m[1]}/embed" loading="lazy" title="Publicación de Instagram"></iframe>`;
  // Spotify
  if (h === 'open.spotify.com' && (m = p.match(/^\/(?:intl-[\w-]+\/)?(track|album|playlist|episode|show)\/(\w+)/)))
    return `<iframe class="sp${m[1]==='track'||m[1]==='episode'?'':' big'}" src="https://open.spotify.com/embed/${m[1]}/${m[2]}" loading="lazy" allow="encrypted-media" title="Spotify"></iframe>`;
  // GIPHY
  if (h.endsWith('giphy.com')){
    let id = (m = p.match(/\/media\/(?:v1\.[^/]+\/)?([A-Za-z0-9]{6,})\//)) ? m[1] : null;
    if (!id && /^\/(gifs|stickers)\//.test(p)) id = p.split('/')[2].split('-').pop();
    if (id && /^[A-Za-z0-9]{6,}$/.test(id)) return imgTag(`https://media.giphy.com/media/${id}/giphy.gif`);
  }
  // Imágenes y videos directos (incluye media.tenor.com)
  if (/\.(gif|png|jpe?g|webp|avif)$/i.test(p)) return imgTag(u.href);
  if (/\.(mp4|webm)$/i.test(p)) return `<div class="m-img"><video src="${esc(u.href)}" autoplay loop muted playsinline controls></video></div>`;
  if (h === 'facebook.com' || h === 'fb.watch') return linkCard(u, 'Facebook', '📘');
  if (h === 'x.com' || h === 'twitter.com') return linkCard(u, 'X', '✖️');
  return '';
}

function dayLabel(key){
  const t = todayKey(), y = dk(addDays(new Date(), -1)), tm = dk(addDays(new Date(), 1));
  if (key === t) return 'Hoy';
  if (key === y) return 'Ayer';
  if (key === tm) return 'Mañana';
  const d = parseDk(key);
  return `${DAYS[wdi(d)]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
function actCardHtml(a){
  let style = '', cls = '';
  if (a.coll === 'events'){ const c = (KINDS[a.kind]||KINDS.otro).c; style = `--t-bd:${c};--t-bg:color-mix(in srgb,${c} 16%,var(--card));--t-tx:var(--ink)`; }
  else cls = ` t-${esc(a.kind)}`;
  const bits = [a.date ? dayLabel(a.date) : '', a.time, a.who].filter(Boolean).map(esc).join(' · ');
  return `<button type="button" class="actcard${cls}" style="${style}" data-act="goto" data-coll="${esc(a.coll)}" data-id="${esc(a.id)}" data-date="${esc(a.date)}">
    <span class="lbl">📅 ${esc(a.label || 'Actividad')}</span><b>${esc(a.title)}</b><small>${bits}</small><span class="go">Ver en la agenda ›</span></button>`;
}
function hm(ts){ const d = new Date(ts); const h = d.getHours(); return `${h%12||12}:${pad(d.getMinutes())} ${h<12?'AM':'PM'}`; }

function msgHtml(m){
  const mine = !!m.author && m.author === me();
  const cls = `msg${mine?' mine':''}${m.local==='sending'?' sending':''}${m.local==='failed'?' failed':''}`;
  if (m.deleted) return `<div class="${cls}"><div class="bubble gone">Mensaje borrado</div></div>`;
  const media = [];
  if (m.status) media.push(`<div class="status-msg"><span class="st-emo">${esc(m.status.emoji)}</span><span>${esc(m.status.label)}</span></div>`);
  if (m.plan) media.push(planCardHtml({ ...m.plan, inChat:true }));
  if (m.audio || m.localAudio) media.push(voiceHtml(m));
  if (m.media){
    const md = m.media, src = mediaSrc(md);
    if (md.kind === 'sticker') media.push(`<button type="button" class="stk-msg" data-act="media-view" data-id="${esc(m.id)}"><img ${src} alt="Sticker"></button>`);
    else media.push(`<button type="button" class="m-img gif-msg" data-act="media-view" data-id="${esc(m.id)}"><img ${src} alt="GIF" ${md.w&&md.h?`width="${md.w}" height="${md.h}"`:''}></button>`);
  }
  if (m.act) media.push(actCardHtml(m.act));
  if (m.localImg) media.push(imgTag(m.localImg));
  else if (m.img) media.push(`<button type="button" class="m-img" data-act="img-view"><img data-img="${esc(m.img)}" alt="Imagen" ${m.w&&m.h?`width="${m.w}" height="${m.h}"`:''}></button>`);
  const first = m.text && (m.text.match(URL_RE) || [])[0];
  const emb = first ? embedFor(first) : '';
  if (emb) media.push(emb);
  // Si el mensaje es solo un link con vista previa, no repetimos el link en texto.
  const onlyLink = emb && m.text.trim() === first;
  const text = m.text && !onlyLink ? `<div class="bubble">${linkify(m.text)}</div>` : '';
  let meta = hm(m.at || Date.now());
  if (m.local === 'sending') meta += ` <span class="ticks">${ic('clock')}</span>`;
  else if (m.local === 'failed') meta += ` · No se envió <button type="button" data-act="msg-retry" data-id="${esc(m.id)}">Reintentar</button>`;
  else if (mine) meta += isSeen(m) ? ` <span class="ticks seen" title="Visto">${ic('checks')}</span>` : ` <span class="ticks" title="Enviado">${ic('check')}</span>`;
  // Acciones rápidas al pasar el mouse (en el teléfono: mantener presionado o deslizar)
  if (!m.local) meta += `<span class="m-acts"><button type="button" data-act="msg-reply" data-id="${esc(m.id)}" aria-label="Responder" title="Responder">${ic('reply')}</button><button type="button" data-act="msg-menu" data-id="${esc(m.id)}" aria-label="Más opciones" title="Reaccionar y más">${ic('more')}</button></span>`;
  const rx = Object.values(m.reactions || {});
  const reacts = rx.length ? `<button type="button" class="reacts" data-act="msg-menu" data-id="${esc(m.id)}" aria-label="Reacciones: ${esc(rx.join(' '))}">${esc([...new Set(rx)].join(''))}${rx.length > 1 ? `<small>${rx.length}</small>` : ''}</button>` : '';
  return `<div class="${cls}" data-mid="${esc(m.id)}">${m.reply ? quoteHtml(m.reply) : ''}${text}${media.length ? `<div class="m-media">${media.join('')}</div>` : ''}${reacts}<div class="m-meta">${meta}</div></div>`;
}
const isSeen = m => !!me() && (chat.reads[otherOf(me())] || 0) >= (m.at || 0);

const STATUSES = [['salgo','🚗','Saliendo del trabajo'], ['20min','⏱️','Llego en 20 min'], ['llegue','🏠','Ya llegué'], ['comi','🍽️','Ya comí'],

/* ---------- Reacciones y menú del mensaje (mantener presionado) ---------- */
const REACTS = ['❤️','😂','😮','😢','👍','🙏','🔥','😍'];
function msgMenu(id){
  const m = chat.msgs.get(id); if (!m || m.deleted || m.local) return;
  const mine = !!m.author && m.author === me(), myR = (m.reactions || {})[me()];
  const who = Object.entries(m.reactions || {}).map(([w, e]) => `${e} ${w === me() ? 'Tú' : esc(nameOf(w))}`).join(' · ');

async function reactTo(id, emoji){

/* ---------- Notas de voz ---------- */
const rec = { mr:null, chunks:[], t0:0, timer:null, stream:null };
const fmtSec = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function pickMime(){
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  // mp4/aac se reproduce en iPhone y Android; webm/opus como respaldo
  return ['audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}
function updateSendBtn(){
  const b = $('#sendBtn'), t = $('#chatIn'); if (!b) return;
  const send = !!rec.mr || !!(t && t.value.trim());
  if (b.dataset.mode === (send ? 'send' : 'mic')) return;
  b.dataset.mode = send ? 'send' : 'mic';
  b.innerHTML = ic(send ? 'send' : 'mic');
  b.setAttribute('aria-label', rec.mr ? 'Enviar nota de voz' : send ? 'Enviar' : 'Grabar nota de voz');
}
async function startRec(){
  if (!me()){ whoAmIDialog(); return; }
  if (chat.status === 'local' || chat.status === 'pin'){ toast(chat.status === 'pin' ? 'Falta el PIN (Ajustes)' : 'El chat necesita la base de datos en la nube'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ toast('Este navegador no permite grabar audio'); return; }
  try { rec.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); }
  catch(e){ toast('Necesito permiso para usar el micrófono 🎤'); return; }
  const mime = pickMime(); rec.chunks = [];
  try { rec.mr = new MediaRecorder(rec.stream, mime ? { mimeType:mime, audioBitsPerSecond:48000 } : undefined); }
  catch(e){ rec.mr = new MediaRecorder(rec.stream); }
  rec.mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  rec.mr.start(250); rec.t0 = Date.now();
  $('#composer').classList.add('recording'); $('#recBar').hidden = false; $('#recTime').textContent = '0:00';
  updateSendBtn(); if (navigator.vibrate) navigator.vibrate(20);
  rec.timer = setInterval(() => { const s = (Date.now() - rec.t0) / 1000; const el = $('#recTime'); if (el) el.textContent = fmtSec(s); if (s >= 300) stopRec(true); }, 250);
}
function stopRec(send){
  const mr = rec.mr; if (!mr) return;
  clearInterval(rec.timer); rec.mr = null;
  const dur = (Date.now() - rec.t0) / 1000;
  mr.onstop = async () => {
    if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
    const c = $('#composer'); if (c){ c.classList.remove('recording'); $('#recBar').hidden = true; }
    updateSendBtn();
    if (!send) { toast('Nota de voz descartada'); return; }
    if (dur < 1){ toast('Muy corta: graba al menos un segundo'); return; }
    const blob = new Blob(rec.chunks, { type:mr.mimeType || 'audio/webm' });
    if (blob.size > 2.9e6){ toast('La nota de voz es muy larga'); return; }
    chatSend({ audio:{ data:await readData(blob), dur:Math.round(dur) } });
  };
  try { mr.stop(); } catch(e){}
}
// Ondas "decorativas" fijas por mensaje (como WhatsApp antes de reproducir)
function voiceHtml(m){
  let h = 0; for (const ch of m.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const bars = Array.from({ length:26 }, () => { h = (h * 1103515245 + 12345) >>> 0; return 25 + (h % 70); });
  const dur = (m.audio && m.audio.dur) || m.localDur || 0;
  return `<div class="voice" data-vid="${esc(m.id)}"><button type="button" class="vplay" data-act="vplay" data-id="${esc(m.id)}" aria-label="Reproducir nota de voz">${ic('play')}</button>
    <span class="vwave" aria-hidden="true">${bars.map(b => `<i style="height:${b}%"></i>`).join('')}</span><span class="vtime">${fmtSec(dur)}</span></div>`;

const voice = { el:null, id:'', urls:new Map() };
async function playVoice(id){
  const m = chat.msgs.get(id); if (!m) return;
  if (voice.el && voice.id === id){ if (voice.el.paused) voice.el.play(); else voice.el.pause(); return; }
  if (voice.el){ voice.el.pause(); voiceUi(voice.id, false, 0); }
  let url = m.localAudio || voice.urls.get(id);
  if (!url){
    try { const r = await apiTo(`/api/chat?img=${encodeURIComponent(m.audio.id)}`, 'GET'); if (!r.ok) throw 0; url = URL.createObjectURL(await r.blob()); voice.urls.set(id, url); }
    catch(e){ toast('No se pudo cargar la nota de voz'); return; }

  const a = new Audio(url); voice.el = a; voice.id = id;

// Deslizar un mensaje a la derecha para responder (como WhatsApp)
(() => {
  let s = null;
  document.addEventListener('touchstart', e => {
    const m = e.target.closest && e.target.closest('#chatList .msg[data-mid]');
    if (!m || m.querySelector('.gone') || e.target.closest('iframe')) return;
    s = { m, x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, lock:null, buzz:false };
    // Mantener presionado ~0.45 s (sin moverse) abre reacciones y opciones
    const id = m.dataset.mid, here = s;
    if (!e.target.closest('button:not(.m-img):not(.stk-msg),a')) here.hold = setTimeout(() => {
      if (s !== here || here.lock) return;
      here.held = true; if (navigator.vibrate) navigator.vibrate(18); msgMenu(id);
    }, 450);
  }, { passive:true });
  document.addEventListener('touchmove', e => {
    if (!s) return;
    const dx = e.touches[0].clientX - s.x, dy = e.touches[0].clientY - s.y;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) clearTimeout(s.hold);
    if (s.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) s.lock = Math.abs(dx) > Math.abs(dy) && dx > 0 ? 'x' : 'y';
    if (s.lock !== 'x') return;
    s.dx = Math.max(0, Math.min(80, dx));
    s.m.style.transform = `translateX(${s.dx}px)`; s.m.classList.add('swiping');
    if (s.dx > 56 && !s.buzz){ s.buzz = true; if (navigator.vibrate) navigator.vibrate(12); }
  }, { passive:true });
  document.addEventListener('touchend', e => {
    if (!s) return;
    clearTimeout(s.hold);
    if (s.held && e.cancelable) e.preventDefault(); // que el "clic" al soltar no abra la imagen
    const { m, dx } = s; s = null;
    m.classList.remove('swiping'); m.style.transform = '';
    if (dx > 56){ const msg = chat.msgs.get(m.dataset.mid); if (msg) setReply(msg); }
  });
})();

// Actualiza la lista sin rehacer los mensajes que no cambiaron.
function chatUpdate(forceBottom){
  const list = $('#chatList'); if (!list) return;
  refreshChatHead();
  const note = $('#chatNote'); if (note) note.textContent = chatNoteText();
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  const items = [];
  let lastDay = '';
  for (const m of sortedMsgs()){
    const day = dk(new Date(m.at || Date.now()));
    if (day !== lastDay){ items.push({ key:'d-'+day, ver:dayLabel(day), html:`<div class="day-sep">${esc(dayLabel(day))}</div>` }); lastDay = day; }
    // La "versión" decide si el mensaje se redibuja: cambia con reacciones, "visto" y el estado de un plan.
    items.push({ key:'m-'+m.id, ver:`${m.upd||0}|${m.local||''}|${m.deleted?1:0}|${me()}|${JSON.stringify(m.reactions||'')}|${m.author===me()&&isSeen(m)?1:0}|${m.plan?planStatus(m.plan.id):''}`, html:null, m });
  }
  if (!items.length){ list.innerHTML = `<div class="chat-empty">Aquí pueden mandarse memes, GIFs, videos de YouTube o TikTok y compartir actividades de la agenda con el botón 📅.</div>`; return; }
  const empty = list.querySelector('.chat-empty'); if (empty) empty.remove();
  const nodes = new Map([...list.children].map(n => [n.dataset.key, n]));
  let cur = list.firstElementChild;
  for (const it of items){
    const ex = nodes.get(it.key);
    if (ex && ex.dataset.ver === it.ver){
      if (ex !== cur) list.insertBefore(ex, cur); else cur = cur.nextElementSibling;
      continue;
    }
    const tmp = document.createElement('div'); tmp.innerHTML = it.html || msgHtml(it.m);
    const n = tmp.firstElementChild; n.dataset.key = it.key; n.dataset.ver = it.ver;
    if (ex){ if (ex === cur) cur = cur.nextElementSibling; ex.replaceWith(n); if (n.nextElementSibling !== cur) list.insertBefore(n, cur); }
    else { if (chat.ready && it.m) n.classList.add('in'); list.insertBefore(n, cur); }
  }
  while (cur){ const nx = cur.nextElementSibling; cur.remove(); cur = nx; }
  loadImgs(list);
  if (forceBottom || nearBottom) list.scrollTop = list.scrollHeight;
  list.querySelectorAll('img').forEach(i => { if (!i.complete) i.addEventListener('load', () => { if (forceBottom || nearBottom) list.scrollTop = list.scrollHeight; }, { once:true }); });
}
// Imágenes guardadas en el servidor: si hay PIN se piden con él y se muestran desde memoria.
async function loadImgs(root){
  for (const img of root.querySelectorAll('img[data-img]:not([src]), img[data-api]:not([src])')){
    const key = img.dataset.img || img.dataset.api;
    const path = img.dataset.api || `/api/chat?img=${encodeURIComponent(key)}`;
    if (imgCache.has(key)){ img.src = imgCache.get(key); continue; }
    if (!store.get(LS_PIN)){ img.src = path; continue; }
    try {
      const r = await apiTo(path, 'GET');
      if (!r.ok) continue;
      const url = URL.createObjectURL(await r.blob());
      imgCache.set(key, url); img.src = url;
    } catch(e){}
  }
}
// Atributo src para un GIF/sticker (de GIPHY o propio).
function mediaSrc(md, preview){
  if (md.src === 'own') return `data-api="/api/media?img=${encodeURIComponent(md.id)}"`;
  return `src="${esc(preview && md.preview || md.url)}" loading="lazy" referrerpolicy="no-referrer"`;
}

function setChatStatus(s){

async function chatPull(){
  if (location.protocol === 'file:'){ setChatStatus('local'); return; }
  if (chat.pulling) return;
  chat.pulling = true;
  try {
    const r = await apiTo('/api/chat' + (chat.cursor ? `?since=${chat.cursor}` : ''), 'GET');
    if (r.status === 401) setChatStatus('pin');
    else if (r.status === 404 || r.status === 501) setChatStatus('local');
    else if (!r.ok) setChatStatus('error');
    else {
      const d = await r.json(); setChatStatus('ok'); chatMerge(d.messages || []);
      // "Visto": hasta dónde leyó cada quien
      if (d.reads && JSON.stringify(d.reads) !== JSON.stringify(chat.reads)){ chat.reads = d.reads; chatUpdate(); }
    }
  } catch(e){ setChatStatus('error'); }
  chat.pulling = false;
}
function chatMerge(list){
  let changed = false;
  for (const m of list){
    const old = chat.msgs.get(m.id);
    if (!old || old.local || (m.upd||0) > (old.upd||0)){ chat.msgs.set(m.id, m); changed = true; }
    if ((m.upd||0) > chat.cursor) chat.cursor = m.upd;
  }
  if (changed){ saveChat(); chatUpdate(); markRead(); updateBadge(); }
}
function unread(){
  const last = Number(store.get(LS_READ) || 0), mine = me();
  return [...chat.msgs.values()].filter(m => !m.deleted && !m.local && m.author !== mine && (m.at||0) > last).length;
}
function updateBadge(){
  const n = unread(), b = $('#chatBadge');
  b.textContent = ui.view === 'chat' || !n ? '' : n > 9 ? '9+' : String(n);
  document.title = n && ui.view !== 'chat' ? `(${n}) Michis` : 'Michis';
}
function markRead(){
  if (ui.view !== 'chat' || document.hidden) return;
  const max = Math.max(0, ...[...chat.msgs.values()].map(m => m.at || 0));
  if (max > Number(store.get(LS_READ) || 0)) store.set(LS_READ, String(max));
  updateBadge();
  // Avisa al servidor para que la otra persona vea las palomitas azules
  const theirs = Math.max(0, ...[...chat.msgs.values()].filter(m => !m.local && m.author && m.author !== me()).map(m => m.at || 0));
  if (me() && theirs > (chat.sentRead || 0) && chat.status === 'ok'){
    chat.sentRead = theirs;
    apiTo('/api/chat', 'POST', { read:{ by:me(), at:theirs } }).catch(() => { chat.sentRead = 0; });
  }
  // Quita los avisos del chat y el numerito del ícono, como cuando abres WhatsApp.
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type:'chat-read' });
    if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {});
  } catch(e){}
}

async function chatPost(msg, image, audio){
  try {
    const r = await apiTo('/api/chat', 'POST', { msg:{ id:msg.id, author:msg.author, text:msg.text, act:msg.act, media:msg.media, reply:msg.reply, status:msg.status, plan:msg.plan }, image, audio, endpoint:notif.endpoint });
    if (r.status === 413) throw new Error('grande');
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json(), m = d.message;
    if (image && m.img) imgCache.set(m.img, image.data);
    if (audio && m.audio) voice.urls.set(m.id, audio.data); // se puede reproducir de inmediato sin descargar
    chat.outbox.delete(msg.id);
    chat.msgs.set(m.id, m); saveChat(); chatUpdate(true);
    return true;
  } catch(e){
    msg.local = 'failed'; chat.msgs.set(msg.id, { ...msg }); chatUpdate();
    toast(e.message === 'grande' ? (audio ? 'La nota de voz es muy pesada' : 'La imagen es muy pesada') : 'No se pudo enviar el mensaje');
    return false;
  }
}
function chatSend({ text = '', act = null, image = null, media = null, status = null, plan = null, audio = null, replyTo = null }){
  if (!me()){ whoAmIDialog(); return false; }
  if (chat.status === 'local' || chat.status === 'pin'){ toast(chat.status === 'pin' ? 'Falta el PIN (Ajustes)' : 'El chat necesita la base de datos en la nube'); return false; }
  const msg = { id:uid(), author:me(), text, act, at:Date.now(), local:'sending' };
  if (media) msg.media = media;
  if (status) msg.status = status;
  if (plan) msg.plan = plan;
  if (audio){ msg.localAudio = audio.data; msg.localDur = audio.dur; }
  if (replyTo) msg.reply = replySnap(replyTo);
  else if (chat.replyTo){ msg.reply = replySnap(chat.replyTo); setReply(null); }
  if (image) msg.localImg = image.data;
  chat.outbox.set(msg.id, { msg, image, audio });
  chat.msgs.set(msg.id, msg); chatUpdate(true);
  chatPost(msg, image, audio);
  return true;
}
function chatRetry(id){
  const o = chat.outbox.get(id); if (!o) return;
  o.msg.local = 'sending'; chat.msgs.set(id, { ...o.msg }); chatUpdate();
  chatPost(o.msg, o.image, o.audio);
}
async function chatDelete(id){

}

// Imágenes: se reducen antes de enviarlas; los GIF se mandan tal cual para que sigan animados.
const readData = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); });
const loadImg = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
async function prepImage(file){
  if (!/^image\//.test(file.type)) throw new Error('tipo');
  const data = await readData(file);
  const img = await loadImg(data);
  if (file.type === 'image/gif'){
    if (file.size > 2.8 * 1024 * 1024) throw new Error('gif');
    return { data, w:img.naturalWidth, h:img.naturalHeight };
  }
  const max = 1280, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  return { data:c.toDataURL('image/jpeg', 0.82), w, h };
}
async function sendImageFile(file){
  if (!me()){ whoAmIDialog(); return; }
  try { chatSend({ text:($('#chatIn') && $('#chatIn').value.trim()) || '', image:await prepImage(file) }); if ($('#chatIn')){ $('#chatIn').value = ''; growInput(); } }
  catch(e){ toast(e.message === 'gif' ? 'Ese GIF pesa más de 2.8 MB' : e.message === 'tipo' ? 'Solo se pueden enviar imágenes' : 'No se pudo leer la imagen'); }
}

const stk = { img:null, raw:null, gif:false };
function stickerDialog(src){
  stk.img = null; stk.raw = null; stk.gif = false;
  openDialog('Crear sticker', `
    <canvas id="stkCanvas" class="stk-preview" width="512" height="512"></canvas>
    <button type="button" class="btn" data-dlg="x:pick" style="align-self:center">🖼️ Elegir foto</button>
    <div class="choice" style="justify-content:center">
      <label><input type="radio" name="shape" value="orig" checked> Original</label>
      <label><input type="radio" name="shape" value="square"> Cuadrado</label>
      <label><input type="radio" name="shape" value="circle"> Círculo</label>
    </div>
    <label class="f">Texto (opcional)<input name="txt" id="stkTxt" maxlength="40" placeholder="Ej. ¡Te amo!"></label>`,
    () => { if (!stk.img){ toast('Primero elige una foto'); return false; } createSticker(); });
  dlgExtra = { pick:() => $('#stkFile').click() };
  if (src) loadImg(src).then(i => { stk.img = i; drawSticker(); }).catch(() => toast('No se pudo abrir la imagen'));
  else $('#stkFile').click(); // dentro del mismo toque, para que el teléfono deje abrir la galería
}
function drawSticker(){
  const c = $('#stkCanvas'); if (!c || !stk.img) return;
  const ctx = c.getContext('2d'), S = 512, img = stk.img;
  const shape = (form.querySelector('[name=shape]:checked') || {}).value || 'orig';
  const txt = ($('#stkTxt') || {}).value || '';
  ctx.clearRect(0, 0, S, S); ctx.save();
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (shape === 'orig'){
    const s = Math.min(S / iw, S / ih), w = iw * s, h = ih * s;
    ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
  } else {
    if (shape === 'circle'){ ctx.beginPath(); ctx.arc(S / 2, S / 2, S / 2 - 6, 0, Math.PI * 2); ctx.clip(); }
    else { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(6, 6, S - 12, S - 12, 48) : ctx.rect(6, 6, S - 12, S - 12); ctx.clip(); }
    const s = Math.max(S / iw, S / ih), w = iw * s, h = ih * s;
    ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
  }
  ctx.restore();
  if (txt.trim()){
    let size = 78; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round';
    do { ctx.font = `900 ${size}px Impact, 'Arial Black', sans-serif`; size -= 4; } while (ctx.measureText(txt).width > S - 30 && size > 28);
    ctx.lineWidth = Math.max(6, size / 6); ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
    ctx.strokeText(txt, S / 2, S - 22); ctx.fillText(txt, S / 2, S - 22);
  }
}
form.addEventListener('input', e => { if (e.target.id === 'stkTxt') drawSticker(); });
form.addEventListener('change', e => { if (e.target.name === 'shape') drawSticker(); });
$('#stkFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = await readData(f);
    stk.img = await loadImg(data);
    // GIF, WebP (como los de WhatsApp) y PNG se guardan tal cual si no se recortan: conservan animación y transparencia.
    stk.gif = /^image\/(gif|webp|png)$/.test(f.type); stk.raw = stk.gif && f.size < STK_MAX ? data : null;
    drawSticker();
  } catch(err){ toast('No se pudo abrir la imagen'); }
});
/* Importar varios stickers de una vez (por ejemplo los .webp de WhatsApp) */
const STK_MAX = 1.05e6; // el servidor acepta hasta ~1.1 MB por sticker
async function stickerData(file){
  const type = /^image\//.test(file.type) ? file.type : /\.webp$/i.test(file.name || '') ? 'image/webp' : '';
  if (!type) throw new Error('tipo');
  // Algunos Android entregan el .webp sin tipo: se lo ponemos para que el servidor lo acepte.
  const data = (await readData(file)).replace(/^data:[^;,]*/, 'data:' + type);
  const img = await loadImg(data);
  // Tal cual si es ligero: mantiene animación y fondo transparente.
  if (/^image\/(webp|png|gif)$/.test(type) && file.size < STK_MAX) return { data, w:img.naturalWidth, h:img.naturalHeight };
  // Si no, se reduce a 512 px (queda sin animación).
  const S = 512, s = Math.min(S / img.naturalWidth, S / img.naturalHeight, 1);
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  let out = c.toDataURL('image/webp', 0.86); if (!/^data:image\/webp/.test(out)) out = c.toDataURL('image/png');
  return { data:out, w, h };
}
async function importStickers(files){
  files = [...files].filter(f => /^image\//.test(f.type) || /\.webp$/i.test(f.name || ''));
  if (!files.length){ toast('Elige imágenes o stickers (.webp)'); return; }
  let ok = 0;
  for (let i = 0; i < files.length; i++){
    toast(files.length > 1 ? `Importando ${i + 1} de ${files.length}…` : 'Importando sticker…');
    try {
      const s = await stickerData(files[i]);
      const r = await apiTo('/api/media', 'POST', { sticker:s, by:me() });
      if (!r.ok) throw 0;
      const d = await r.json(); imgCache.set(d.item.id, s.data); ok++;
    } catch(e){}
  }
  const fail = files.length - ok;
  toast(ok ? `${ok} sticker${ok > 1 ? 's' : ''} agregado${ok > 1 ? 's' : ''} 💟${fail ? ` · ${fail} no se pudo` : ''}` : 'No se pudo importar');
  pk.tab = 'stk'; await loadSaved();
  if (ui.view === 'chat' && $('#picker') && $('#picker').hidden) togglePicker(true);
}
$('#stkImport').addEventListener('change', e => { const f = e.target.files; if (f && f.length) importStickers(f); e.target.value = ''; });
// Pegar (Ctrl+V) un sticker copiado, por ejemplo desde WhatsApp Web, con la pestaña Stickers abierta.
document.addEventListener('paste', e => {
  if (e.target.id === 'chatIn' || !$('#pkBody') || pk.tab !== 'stk') return;
  const p = $('#picker'); if (p && p.hidden && !dlg.open) return;
  const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(x => /^image\//.test(x.type));
  if (files.length){ e.preventDefault(); importStickers(files); }
});

async function createSticker(){
  const c = $('#stkCanvas');
  const shape = (form.querySelector('[name=shape]:checked') || {}).value, txt = (($('#stkTxt') || {}).value || '').trim();
  let data, w = 512, h = 512;
  // Un GIF sin recorte ni texto se guarda tal cual para que siga animado.
  if (stk.raw && shape === 'orig' && !txt){ data = stk.raw; w = stk.img.naturalWidth; h = stk.img.naturalHeight; }
  else { data = c.toDataURL('image/webp', 0.86); if (!/^data:image\/webp/.test(data)) data = c.toDataURL('image/png'); }
  toast('Guardando sticker…');
  try {
    const r = await apiTo('/api/media', 'POST', { sticker:{ data, w, h }, by:me() });
    if (!r.ok) throw new Error(r.status === 413 ? 'grande' : 'x');
    const d = await r.json();
    imgCache.set(d.item.id, data);
    toast('Sticker creado 💟');
    pk.tab = 'stk'; await loadSaved();
    if (ui.view === 'chat'){ togglePicker(true); }
    else if (ui.view === 'notas' && pk.target) notePicker(pk.target); // regresa a elegir para la notita
  } catch(err){ toast(err.message === 'grande' ? 'La imagen es muy pesada para sticker' : 'No se pudo crear el sticker'); }
}

// Al tocar un GIF o sticker del chat: verlo en grande y guardarlo.
function mediaView(m){
  const md = m.media; if (!md) return;
  const already = (pk.saved || []).some(x => (md.src === 'own' ? x.id === md.id : x.url === md.url));
  const isStk = md.kind === 'sticker';
  openDialog('', `<img class="imgview" ${mediaSrc(md)} alt="" style="${isStk ? 'width:220px' : ''}">
    <div class="row" style="justify-content:center">
      ${already ? `<span class="pk-note">⭐ Ya está en sus ${isStk ? 'stickers' : 'GIFs'}</span>`
        : md.src === 'giphy' ? `<button type="button" class="btn primary" data-dlg="x:save">☆ Guardar ${isStk ? 'sticker' : 'GIF'}</button>` : ''}
      <button type="button" class="btn" data-dlg="x:again">Enviar otra vez</button>
    </div>`, null);
  dlgExtra = {
    save:() => { closeDialog(); saveMedia(md.kind, md); },
    again:() => { closeDialog(); sendMedia(md.kind, md); },
  };
  loadImgs(form);
}

/* Compartir actividades */
function actSnap(coll, item, date){
  if (coll === 'events'){
    const k = KINDS[item.kind] || KINDS.otro;
    return { coll, id:item.id, date:item.date, title:item.title, time:'', who:'', kind:item.kind, label:k.l };
  }
  return { coll:'blocks', id:item.id, date, title:item.title, time:range(item.start, item.end), who:nameOf(item.who), kind:item.type, label:TYPES[item.type] || 'Actividad' };
}
function shareActivity(coll, item, date, text = ''){
  if (chatSend({ text, act:actSnap(coll, item, date) }) && ui.view !== 'chat') toast('Enviado al chat');
}
function pickList(key){
  if (!key) return '';
  const d = parseDk(key);
  const evs = eventsFor(key).map(e => { const k = KINDS[e.kind] || KINDS.otro;
    return `<button type="button" class="pick" style="--t-bd:${k.c};--t-bg:color-mix(in srgb,${k.c} 16%,var(--card));--t-tx:var(--ink)" data-dlg="send-act" data-coll="events" data-id="${esc(e.id)}" data-date="${key}"><span>📌</span><span><b>${esc(e.title)}</b><small>${esc(k.l)}</small></span></button>`; });
  const bl = blocksFor(d, true).map(b => `<button type="button" class="pick t-${esc(b.type)}" data-dlg="send-act" data-coll="blocks" data-id="${esc(b.id)}" data-date="${key}"><span><b>${esc(b.title)}</b><small>${esc(range(b.start, b.end))} · ${esc(nameOf(b.who))}</small></span></button>`);
  const all = evs.concat(bl);
  return all.length ? all.join('') : '<div class="empty">No hay actividades ese día.</div>';
}
function pickDialog(){
  const key = todayKey();
  openDialog('Compartir una actividad', `
    <label class="f">Día<input type="date" id="pickDate" value="${key}"></label>
    <label class="f">Mensaje (opcional)<input name="note" maxlength="300" placeholder="Ej. ¿Vamos a esta?"></label>
    <div class="daylist" id="pickList" style="max-height:46vh;overflow:auto">${pickList(key)}</div>`, null);
}

setInterval(() => {
  if (document.hidden) return;
  chat.tick++;
  if (ui.view === 'chat' || chat.tick % 5 === 0) chatPull();
}, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ chatPull(); markRead(); } });

/* ---------- Avisos (notificaciones) ---------- */
const notif = { reg:null, endpoint:'', push:false };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function prefs(){ try { return Object.assign({ on:false, acts:true, chat:true }, JSON.parse(store.get(LS_NOTIF))); } catch(e){ return { on:false, acts:true, chat:true }; } }
function setPrefs(p){ store.set(LS_NOTIF, JSON.stringify({ ...prefs(), ...p })); }
const canNotify = () => 'Notification' in window && Notification.permission === 'granted';

/* Instalar la app en el teléfono */
const LS_BANNER = 'agenda-pareja-banner-';
const inst = { prompt:null };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); inst.prompt = e; renderBanner(); if (ui.view === 'ajustes') safeRender(); });
window.addEventListener('appinstalled', () => { inst.prompt = null; toast('¡App instalada! Ábrela desde tu pantalla de inicio'); renderBanner(); if (ui.view === 'ajustes') safeRender(); });
const isAndroid = /Android/i.test(navigator.userAgent);
async function installApp(){
  if (inst.prompt){
    inst.prompt.prompt();
    try { await inst.prompt.userChoice; } catch(e){}
    inst.prompt = null; renderBanner(); if (ui.view === 'ajustes') safeRender();
    return;
  }
  openDialog('Instalar la app', `<p style="margin:0;color:var(--muted)">${installSteps()}</p>`, null);
}
function installSteps(){
  if (isIOS) return `En iPhone hay que usar <b>Safari</b>:<ol class="steps"><li>Toca el botón <b>Compartir</b> (el cuadrito con la flecha ⬆️).</li><li>Elige <b>Agregar a pantalla de inicio</b> y luego <b>Agregar</b>.</li><li>Abre la app desde el nuevo ícono y activa los avisos.</li></ol>`;
  if (isAndroid) return `En Chrome toca el menú <b>⋮</b> (arriba a la derecha) y elige <b>Instalar app</b> o <b>Agregar a pantalla principal</b>. Luego ábrela desde el ícono y activa los avisos.`;
  return `En Chrome o Edge usa el ícono de instalar en la barra de direcciones (o menú ⋮ → <b>Instalar Michis</b>).`;
}
const dismissed = k => now() - Number(store.get(LS_BANNER + k) || 0) < 3 * 864e5; // se vuelve a mostrar a los 3 días
function renderBanner(){
  const el = $('#banner'); if (!el) return;
  const p = prefs();
  let html = '';
  if (!standalone() && (inst.prompt || isIOS || isAndroid) && !dismissed('install')){
    html = `<div class="banner"><span class="ico">📲</span>
      <span class="txt"><b>Instala la app en tu teléfono</b>Así te llegan los mensajes y los recordatorios como en WhatsApp.</span>
      <button class="btn primary" data-act="install">Instalar</button>
      <button class="x" data-act="banner-x" data-b="install" aria-label="Ocultar">✕</button></div>`;
  } else if ('Notification' in window && Notification.permission !== 'denied' && !(p.on && canNotify()) && !dismissed('notif')){
    html = `<div class="banner"><span class="ico">🔔</span>
      <span class="txt"><b>Activa los avisos</b>Te avisamos de mensajes nuevos y ${LEAD_MIN} minutos antes de cada actividad.</span>
      <button class="btn primary" data-act="notif-on">Activar</button>
      <button class="x" data-act="banner-x" data-b="notif" aria-label="Ocultar">✕</button></div>`;
  }
  if (el.innerHTML !== html) el.innerHTML = html;
}
function installPanel(){
  if (standalone()) return `<p>✅ Estás usando la app instalada.</p>`;
  return `<p>Instálala en la pantalla de inicio para usarla como una app normal y recibir los avisos como en WhatsApp.</p>
    ${inst.prompt ? '<div class="row"><button class="btn primary" data-act="install">📲 Instalar app</button></div>' : `<p>${installSteps()}</p>`}`;
}

function notifPanel(){
  const p = prefs(), supported = 'Notification' in window && 'serviceWorker' in navigator;
  let body;
  if (!supported && isIOS && !standalone()){
    body = `<p>En iPhone los avisos solo funcionan si la app está en la pantalla de inicio: toca <b>Compartir → Agregar a pantalla de inicio</b>, ábrela desde ahí y vuelve a esta sección.</p>`;
  } else if (!supported){
    body = `<p>Este navegador no permite avisos. Prueba con Chrome, Edge, Firefox o Safari actualizado.</p>`;
  } else if (Notification.permission === 'denied'){
    body = `<p>Los avisos están bloqueados para este sitio. Actívalos en los permisos del navegador (el candado junto a la dirección) y vuelve aquí.</p>`;
  } else if (!p.on || !canNotify()){
    body = `<p>Recibe un aviso ${LEAD_MIN} minutos antes de cada actividad y cuando te llegue un mensaje en el chat.</p>
      <div class="row"><button class="btn primary" data-act="notif-on">🔔 Activar avisos en este teléfono</button></div>`;
  } else {
    const st = notif.push ? 'Activados: llegan aunque la app esté cerrada.' : 'Activados mientras la app esté abierta. Para recibirlos con la app cerrada hace falta la base de datos en la nube y el cron (ver LEEME.md).';
    body = `<p>${st}</p>
      <label class="check"><input type="checkbox" data-pref="acts" ${p.acts?'checked':''}> Avisarme ${LEAD_MIN} minutos antes de cada actividad</label>
      <label class="check"><input type="checkbox" data-pref="chat" ${p.chat?'checked':''}> Avisarme de mensajes nuevos en el chat</label>
      ${me() ? '' : '<p>Elige arriba quién usa este teléfono para recibir solo tus actividades y las de los dos.</p>'}
      <div class="row"><button class="btn" data-act="notif-test">Probar aviso</button><button class="btn" data-act="notif-off">Desactivar</button></div>`;
  }
  return `<section class="panel"><h3>App en el teléfono</h3>${installPanel()}</section>
    <section class="panel"><h3>Avisos</h3>${body}</section>`;
}

async function swReg(){
  if (notif.reg) return notif.reg;
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return null;
  try { notif.reg = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready; } catch(e){ notif.reg = null; }
  return notif.reg;
}
function b64u(s){
  const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function refreshPush(){
  const p = prefs();
  if (!p.on || !canNotify()) return;
  const reg = await swReg();
  if (!reg || !('PushManager' in window)){ notif.push = false; return; }
  try {
    const r = await apiTo('/api/push', 'GET');
    if (!r.ok) throw 0;
    const { publicKey } = await r.json();
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey){
      const cur = btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      if (cur !== publicKey){ await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(publicKey) });
    notif.endpoint = sub.endpoint;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    const s = await apiTo('/api/push', 'POST', { sub:sub.toJSON(), who:me(), tz, acts:p.acts, chat:p.chat });
    notif.push = s.ok;
  } catch(e){ notif.push = false; }
  if (ui.view === 'ajustes') safeRender();
}
async function enableNotifs(){
  if (!('Notification' in window)){ toast('Este navegador no permite avisos'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ toast('No se dio permiso para los avisos'); render(); return; }
  setPrefs({ on:true });
  await swReg();
  render();
  toast('Avisos activados');
  await refreshPush();
  localReminders();
}
async function disableNotifs(){
  setPrefs({ on:false });
  try {
    const reg = await swReg(), sub = reg && await reg.pushManager.getSubscription();
    if (sub){ await apiTo('/api/push', 'POST', { remove:sub.endpoint }); await sub.unsubscribe(); }
  } catch(e){}
  notif.push = false; notif.endpoint = '';
  render(); toast('Avisos desactivados');
}
async function showLocal(title, body, tag, url){
  try {
    const reg = await swReg();
    const opts = { body, tag, icon:'/icon-192.png', badge:'/badge-96.png', vibrate:[180, 80, 180], renotify:true, requireInteraction:tag.startsWith('act:'), data:{ url, kind:tag.startsWith('act:') ? 'act' : '' } };
    if (reg) await reg.showNotification(title, opts);
    else { const n = new Notification(title, opts); n.onclick = () => { window.focus(); openUrl(url); n.close(); }; }
  } catch(e){}
}
async function testNotif(){
  if (notif.push && notif.endpoint){
    try { const r = await apiTo('/api/push', 'POST', { test:notif.endpoint }); if (r.ok && (await r.json()).ok){ toast('Aviso de prueba enviado'); return; } } catch(e){}
  }
  showLocal('Michis', '¡Listo! Así se verán los avisos. 🐾', 'test', '/');
}

// Mientras la app está abierta también revisa cada 30 s (por si el cron del servidor no está configurado).
// Usa la misma etiqueta que el servidor, así el teléfono no muestra el aviso dos veces.
function localReminders(){
  const p = prefs();
  if (!p.on || !p.acts || !canNotify()) return;
  let sent = {};
  try { sent = JSON.parse(store.get(LS_SENT)) || {}; } catch(e){}
  const t = now();
  for (const k in sent) if (t - sent[k] > 2 * 864e5) delete sent[k];
  const d0 = new Date(), nowMin = d0.getHours() * 60 + d0.getMinutes(), mine = me();
  [[d0, 0], [addDays(d0, 1), 1440]].forEach(([d, off]) => {
    const key = dk(d);
    for (const b of blocksFor(d, true)){
      if (!b.start || isDone(b.id, key)) continue;
      if (mine && (b.who === 'a' || b.who === 'b') && b.who !== mine) continue;
      const [h, m] = b.start.split(':').map(Number);
      const until = h * 60 + m + off - nowMin;
      const tag = `act:${b.id}|${key}`;
      if (until <= 0 || until > LEAD_MIN || sent[tag]) continue;
      sent[tag] = t;
      const who = b.who === 'ambos' || b.who === 'a' || b.who === 'b' ? ' · ' + nameOf(b.who) : '';
      showLocal(`En ${until} min: ${b.title}`, range(b.start, b.end) + who, tag, `/?view=semana&date=${key}`);
      if (!document.hidden) toast(`En ${until} min: ${b.title}`);
    }
  });
  store.set(LS_SENT, JSON.stringify(sent));
}
setInterval(localReminders, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open') openUrl(e.data.url); });

/* ---------- Inicio ---------- */
saveLocal();
render();
push();
chatPull().then(updateBadge);
if (new URLSearchParams(location.search).has('view')){ openUrl(location.href); history.replaceState(null, '', location.pathname); }
swReg().then(() => { if (prefs().on && canNotify()){ refreshPush(); localReminders(); } });
if (!me()) setTimeout(whoAmIDialog, 300);
})();
