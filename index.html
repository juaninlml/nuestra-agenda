<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf9">
<title>Nuestra agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdf9; --card:#ffffff; --ink:#1f2328; --muted:#5b636d; --line:#e9e3d8; --soft:#f5f1ea;
  --accent:#d94f86; --accent-ink:#ffffff;
  --pa-bg:#fde4ee; --pa-bd:#e05b8f; --pa-tx:#8a1c4a;
  --pe-bg:#e1f2fd; --pe-bd:#3aa7d9; --pe-tx:#0b5a80;
  --qu-bg:#fff4bf; --qu-bd:#d4b400; --qu-tx:#5f4e00;
  --sa-bg:#ede6fb; --sa-bd:#8c6bc8; --sa-tx:#4527a0;
  --r:14px; --shadow:0 1px 2px rgba(31,35,40,.06),0 4px 14px rgba(31,35,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --card:#212328; --ink:#eceef1; --muted:#a6aeb8; --line:#33363d; --soft:#2a2d33;
    --pa-bg:#4a2033; --pa-tx:#ffd3e4; --pe-bg:#15364a; --pe-tx:#cfeaff;
    --qu-bg:#3f370f; --qu-tx:#fff0a6; --sa-bg:#2e2450; --sa-tx:#e2d8ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1400px;margin:0 auto;padding:16px}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{font-size:28px;line-height:1}
.rainbow{display:flex;gap:3px;width:170px;height:6px}
.rainbow span{flex:1;border-radius:3px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;min-height:40px}
.tabs button[aria-current="page"]{background:var(--card);box-shadow:var(--shadow)}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
.sync i{width:9px;height:9px;border-radius:50%;background:#b0b6bd;display:block}
.sync[data-mode="cloud"] i{background:#3fae5a}
.sync[data-mode="local"] i{background:#e3a21a}
.sync[data-mode="pin"] i,.sync[data-mode="error"] i{background:#e0503f}

/* Barra de herramientas */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.bar h2{font-size:20px;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#c0352b;border-color:#f0c4bf}
.seg{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:500;font-size:14px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}

/* Semana */
.daychips{display:none;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.daychips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:52px;font-size:12px;font-weight:600}
.daychips button b{font-size:17px;font-family:'Space Grotesk',sans-serif}
.daychips button[aria-pressed="true"]{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 30%,var(--card))}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.day>header{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;background:color-mix(in srgb,var(--dc) 38%,var(--card));border-bottom:2px solid var(--dc)}
.day>header .dn{font-weight:600;font-size:13px}
.day>header b{font-family:'Space Grotesk',sans-serif;font-size:20px;line-height:1}
.day>header .add{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;font-size:20px;line-height:1}
.day.today>header{box-shadow:inset 0 -3px 0 var(--ink)}
.day .list{display:flex;flex-direction:column;gap:6px;padding:8px}
.empty{color:var(--muted);font-size:13px;padding:8px 4px;text-align:center}
.blk{display:flex;align-items:flex-start;gap:6px;border-radius:10px;border-left:0;padding:6px 6px 6px 8px;background:var(--t-bg);color:var(--t-tx);border:1px solid color-mix(in srgb,var(--t-bd) 45%,transparent)}
.blk.done{opacity:.55}
.blk.done .ttl{text-decoration:line-through}
.blk .main{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;color:inherit}
.blk .time{font-size:11.5px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.blk .ttl{font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.blk .who{font-size:11.5px;opacity:.85;margin-top:2px}
.blk input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--t-bd);flex-shrink:0}
.t-pareja{--t-bg:var(--pa-bg);--t-bd:var(--pa-bd);--t-tx:var(--pa-tx)}
.t-personal{--t-bg:var(--pe-bg);--t-bd:var(--pe-bd);--t-tx:var(--pe-tx)}
.t-quehacer{--t-bg:var(--qu-bg);--t-bd:var(--qu-bd);--t-tx:var(--qu-tx)}
.t-salida{--t-bg:var(--sa-bg);--t-bd:var(--sa-bd);--t-tx:var(--sa-tx)}
.mark{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1.5px dashed var(--k);background:color-mix(in srgb,var(--k) 14%,var(--card));border-radius:10px;padding:5px 8px;font-size:12.5px;font-weight:600}
.mark .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex-shrink:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:block;background:var(--t-bg);border:1.5px solid var(--t-bd)}

/* Mes */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead{text-align:center;font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;padding:6px 0;border-radius:8px;background:color-mix(in srgb,var(--dc) 55%,var(--card));color:var(--ink)}
.cell{min-height:104px;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--dc) 70%,var(--line));background:color-mix(in srgb,var(--dc) 10%,var(--card));text-align:left;min-width:0}
.cell.out{opacity:.4}
.cell.today{outline:2.5px solid var(--ink);outline-offset:1px}
.cell .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.pill{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--k) 20%,var(--card));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--k);flex-shrink:0}
.pill span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);font-weight:600}
.upcoming{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.upcoming h3{font-size:17px;margin-bottom:8px}
.up-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.up-row:first-of-type{border-top:0}
.up-date{min-width:64px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px}
.up-row .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex-shrink:0}
.up-row small{color:var(--muted);display:block}

/* Notitas */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.note{border-radius:6px 6px 18px 6px;padding:14px 14px 10px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 8px 18px rgba(31,35,40,.10);display:flex;flex-direction:column;gap:8px;min-height:200px;color:#2b2b2b;transform:rotate(var(--rot))}
.note textarea{flex:1;border:0;background:transparent;resize:none;min-height:120px;font-size:15.5px;line-height:1.45;outline:none;color:#2b2b2b}
.note footer{display:flex;align-items:center;gap:6px;font-size:12px;color:#4d4d4d}
.note footer .meta{flex:1 0 auto;white-space:nowrap}
.swatch{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);padding:0}
.note .del{border:0;background:rgba(0,0,0,.07);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:#4d4d4d}
.note-tag{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.07);border-radius:999px;padding:2px 8px;align-self:flex-start}

/* Ajustes */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);max-width:720px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:10px}
.panel p{margin:6px 0 10px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:400;font-size:15px;color:var(--ink);min-height:42px}
label.f textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Diálogo */
dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,24,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:19px}
.dlg .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.dlg .actions .danger{margin-right:auto}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:38px}
.choice input{accent-color:var(--accent)}
.daylist{display:flex;flex-direction:column;gap:6px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow);z-index:10}

@media (max-width:900px){
  .daychips{display:flex}
  .week{grid-template-columns:minmax(0,1fr)}
  .week .day{display:none}
  .week .day.active{display:block}
  .cell{min-height:64px;padding:4px;gap:2px}
  .pill span{display:none}
  .pill{padding:2px 4px;justify-content:center}
  .mhead{font-size:11px}
}
@media (max-width:520px){
  .wrap{padding:12px}
  .brand h1{font-size:24px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:8px 6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Nuestra agenda</h1>
      <div class="rainbow" aria-hidden="true">
        <span style="background:#ffab91"></span><span style="background:#ffcc80"></span><span style="background:#fff176"></span><span style="background:#a5d6a7"></span><span style="background:#81d4fa"></span><span style="background:#b39ddb"></span><span style="background:#f48fb1"></span>
      </div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button data-view="semana">Semana</button>
      <button data-view="mes">Mes</button>
      <button data-view="notas">Notitas</button>
      <button data-view="ajustes">Ajustes</button>
    </nav>
    <div class="spacer"></div>
    <button class="sync" id="sync" data-view="ajustes" data-mode="checking"><i></i><span>Conectando…</span></button>
  </header>
  <main id="main"></main>
</div>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog"></form></dialog>
<input type="file" id="importFile" accept="application/json" class="hidden">

<script>
(() => {
'use strict';

/* ---------- Constantes ---------- */
const LS = 'agenda-pareja-v1', LS_ME = 'agenda-pareja-yo', LS_PIN = 'agenda-pareja-pin';
const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_S = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYCOL = ['#ffab91','#ffcc80','#fff176','#a5d6a7','#81d4fa','#b39ddb','#f48fb1'];
const TYPES = { pareja:'En pareja', personal:'Personal', quehacer:'Quehacer', salida:'Salida' };
const FREQ = { all:'Cada semana', '13':'Semanas 1 y 3 del mes', '24':'Semanas 2 y 4 del mes', once:'Solo un día' };
const KINDS = {
  importante:{ l:'Importante', c:'#e8574f' },
  cumple:{ l:'Cumpleaños', c:'#ef9a2e' },
  aniversario:{ l:'Aniversario', c:'#e05b8f' },
  salida:{ l:'Salida / cita', c:'#8c6bc8' },
  pago:{ l:'Pago / trámite', c:'#3aa7d9' },
  otro:{ l:'Otro', c:'#4fa860' }
};
const NOTE_COLORS = ['#fff3a3','#ffd6e5','#cfe9ff','#d4f5d6','#e4dcff','#ffe0c2'];

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => Date.now();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDk = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const wdi = d => (d.getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -wdi(x)); };
const todayKey = () => dk(new Date());
function t12(t){ if(!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${pad(m)}`; }
function ampm(t){ return Number(t.split(':')[0]) < 12 ? 'AM' : 'PM'; }
function range(s, e){
  if (!e) return `${t12(s)} ${ampm(s)}`;
  return ampm(s) === ampm(e) ? `${t12(s)} – ${t12(e)} ${ampm(e)}` : `${t12(s)} ${ampm(s)} – ${t12(e)} ${ampm(e)}`;
}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- Horario base ---------- */
function seedBlocks(){
  const L = [];
  const add = (day, start, end, title, type, who, freq = 'all') =>
    L.push({ id:`seed-${L.length}`, day, start, end, title, type, who, freq, updatedAt:1 });
  const tarde = d => {
    add(d,'15:45','17:15','Ejercicio','personal','cada');
    add(d,'17:15','18:45','Hobby (lectura, juegos, proyectos)','personal','cada');
  };
  add(0,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','a');
  add(0,'15:00','15:30','Barrer y sacar la basura','quehacer','b');
  add(0,'15:30','15:45','Limpiar arenero de los gatos','quehacer','a');
  tarde(0);
  add(0,'18:45','19:45','Café o té y plática del día','pareja','ambos');
  add(0,'19:45','21:00','Cena juntos','pareja','ambos');

  add(1,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','b');
  add(1,'15:00','15:15','Limpiar arenero de los gatos','quehacer','a');
  tarde(1);
  add(1,'18:45','19:45','Serie o juego de mesa','pareja','ambos');
  add(1,'19:45','21:00','Cena juntos','pareja','ambos');

  add(2,'15:00','15:45','Lavar y tender ropa','quehacer','a');
  add(2,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','b');
  add(2,'15:30','15:45','Limpiar arenero de los gatos','quehacer','b');
  tarde(2);
  add(2,'18:45','19:45','Cocinar juntos la cena','pareja','ambos');
  add(2,'19:45','21:00','Cena sin pantallas','pareja','ambos');

  add(3,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','a');
  add(3,'15:00','15:45','Limpieza rápida (baño o cocina)','quehacer','b');
  add(3,'15:30','15:45','Limpiar arenero de los gatos','quehacer','a');
  tarde(3);
  add(3,'18:45','19:45','Caminata o paseo corto juntos','pareja','ambos');
  add(3,'19:45','21:00','Cena juntos','pareja','ambos');

  add(4,'15:00','15:30','Lavar trastes y recoger cocina','quehacer','a');
  add(4,'15:00','15:30','Doblar y guardar ropa','quehacer','b');
  add(4,'15:30','15:45','Limpiar arenero de los gatos','quehacer','b');
  tarde(4);
  add(4,'18:45','21:00','Noche de cita en casa','pareja','ambos');

  add(5,'13:00','14:30','Ejercicio','personal','cada');
  add(5,'14:30','16:00','Hobby (lectura, juegos, proyectos)','personal','cada');
  add(5,'16:00','21:00','Salida: comida o cena fuera, paseo o cine','salida','ambos','13');
  add(5,'16:00','18:30','Tarde libre','personal','cada','24');
  add(5,'18:30','21:00','Noche en casa: cocinar juntos y película','pareja','ambos','24');

  add(6,'09:00','10:30','Limpieza general','quehacer','ambos');
  add(6,'10:30','12:00','Desayuno largo / brunch','pareja','ambos');
  add(6,'12:00','13:00','Súper y despensa','quehacer','ambos');
  add(6,'13:00','14:30','Hobby (lectura, juegos, proyectos)','personal','cada');
  add(6,'14:30','17:00','Tiempo libre','personal','cada');
  add(6,'17:00','17:30','Planear la semana y el menú','pareja','ambos');
  add(6,'17:30','18:30','Preparar cenas de la semana','quehacer','ambos');
  add(6,'18:30','21:00','Descanso antes de la semana','personal','cada');
  return L;
}

/* ---------- Estado ---------- */
const empty = () => ({ v:1, settings:{ nameA:'Él', nameB:'Ella', updatedAt:0 }, blocks:[], events:[], notes:[], checks:[] });
function load(){
  try { const r = JSON.parse(store.get(LS)); if (r && r.v) return Object.assign(empty(), r); } catch(e){}
  return empty();
}
let S = load();
if (!S.blocks.length) S.blocks = seedBlocks();

function mergeColl(a = [], b = []){
  const m = new Map();
  for (const x of a) if (x && x.id) m.set(x.id, x);
  for (const y of b){ if (!y || !y.id) continue; const x = m.get(y.id); if (!x || (y.updatedAt||0) > (x.updatedAt||0)) m.set(y.id, y); }
  return [...m.values()];
}
function merge(s1, s2){
  s2 = s2 || {};
  const a = s1.settings || {}, b = s2.settings || {};
  return { v:1, settings:(b.updatedAt||0) > (a.updatedAt||0) ? b : a,
    blocks:mergeColl(s1.blocks, s2.blocks), events:mergeColl(s1.events, s2.events),
    notes:mergeColl(s1.notes, s2.notes), checks:mergeColl(s1.checks, s2.checks) };
}
const saveLocal = () => store.set(LS, JSON.stringify(S));
const live = coll => S[coll].filter(x => !x.deleted);
function upsert(coll, obj){
  obj.updatedAt = now();
  const i = S[coll].findIndex(x => x.id === obj.id);
  if (i >= 0) S[coll][i] = obj; else S[coll].push(obj);
  commit();
}
function removeItem(coll, id){
  const x = S[coll].find(x => x.id === id);
  if (x){ x.deleted = true; x.updatedAt = now(); commit(); }
}
function commit(){ saveLocal(); render(); schedulePush(); }

/* ---------- Vista ---------- */
const ui = {
  view: 'semana',
  week: mondayOf(new Date()),
  month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  who: 'todos',
  day: wdi(new Date())
};
const me = () => store.get(LS_ME) || '';
const nameOf = w => w === 'a' ? S.settings.nameA : w === 'b' ? S.settings.nameB : w === 'ambos' ? 'Ambos' : 'Cada quien';
const whoOk = b => ui.who === 'todos' || b.who === ui.who || b.who === 'ambos' || b.who === 'cada';

function blocksFor(date){
  const key = dk(date), wd = wdi(date), n = Math.ceil(date.getDate() / 7);
  return live('blocks').filter(b => {
    if (b.freq === 'once') return b.date === key;
    if (b.day !== wd) return false;
    if (b.freq === '13') return n === 1 || n === 3;
    if (b.freq === '24') return n === 2 || n === 4;
    return true;
  }).filter(whoOk).sort((x, y) => (x.start||'').localeCompare(y.start||'') || x.title.localeCompare(y.title));
}
const eventsFor = key => live('events').filter(e => e.date === key).sort((a,b) => (a.title||'').localeCompare(b.title||''));
const isDone = (id, key) => S.checks.some(c => c.id === `${id}|${key}` && c.done && !c.deleted);

function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === ui.view ? 'page' : 'false'));
  const main = $('#main');
  if (ui.view === 'semana') main.innerHTML = viewWeek();
  else if (ui.view === 'mes') main.innerHTML = viewMonth();
  else if (ui.view === 'notas') main.innerHTML = viewNotes();
  else main.innerHTML = viewSettings();
}
let pendingRender = false;
function safeRender(){
  const a = document.activeElement;
  if ((a && a.closest && a.closest('#main') && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) || $('#dlg').open){ pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => {
  if (pendingRender && !$('#dlg').open){
    const a = document.activeElement;
    if (!(a && a.closest && a.closest('#main') && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))){ pendingRender = false; render(); }
  }
}, 50));

function whoSeg(){
  const opts = [['todos','Todos'],['a',S.settings.nameA],['b',S.settings.nameB]];
  return `<div class="seg" role="group" aria-label="Ver horario de">${opts.map(([v,l]) =>
    `<button data-act="who" data-v="${v}" aria-pressed="${ui.who===v}">${esc(l)}</button>`).join('')}</div>`;
}
function markHtml(e){
  const k = KINDS[e.kind] || KINDS.otro;
  return `<button class="mark" style="--k:${k.c}" data-act="edit-event" data-id="${esc(e.id)}"><span class="dot"></span><span>${esc(e.title)}</span></button>`;
}

function viewWeek(){
  const start = ui.week, end = addDays(start, 6), tk = todayKey();
  const title = start.getMonth() === end.getMonth()
    ? `${start.getDate()} – ${end.getDate()} de ${MONTHS[end.getMonth()]}`
    : `${start.getDate()} ${MONTHS[start.getMonth()].slice(0,3)} – ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}`;
  let chips = '', cols = '';
  for (let i = 0; i < 7; i++){
    const d = addDays(start, i), key = dk(d);
    chips += `<button style="--dc:${DAYCOL[i]}" data-act="pick-day" data-i="${i}" aria-pressed="${ui.day===i}">${DAYS_S[i]}<b>${d.getDate()}</b></button>`;
    const evs = eventsFor(key).map(markHtml).join('');
    const bl = blocksFor(d).map(b => {
      const done = isDone(b.id, key);
      return `<div class="blk t-${esc(b.type)}${done?' done':''}">
        <input type="checkbox" data-act="toggle" data-id="${esc(b.id)}" data-date="${key}" ${done?'checked':''} aria-label="Marcar como hecho: ${esc(b.title)}">
        <button class="main" data-act="edit-block" data-id="${esc(b.id)}" data-date="${key}">
          <div class="time">${esc(range(b.start, b.end))}${b.freq==='13'||b.freq==='24'?' · cada 2 semanas':''}</div>
          <div class="ttl">${esc(b.title)}</div>
          <div class="who">${esc(nameOf(b.who))}</div>
        </button></div>`;
    }).join('');
    cols += `<section class="day${key===tk?' today':''}${ui.day===i?' active':''}" style="--dc:${DAYCOL[i]}">
      <header><span class="dn">${DAYS[i]}</span><b>${d.getDate()}</b>
        <button class="add" data-act="add-block" data-date="${key}" aria-label="Agregar actividad el ${DAYS[i]}">+</button></header>
      <div class="list">${evs}${bl || (evs ? '' : '<div class="empty">Día libre</div>')}</div>
    </section>`;
  }
  return `<div class="bar">
      <button class="icon-btn" data-act="wk" data-n="-1" aria-label="Semana anterior">‹</button>
      <h2>${esc(title)}</h2>
      <button class="icon-btn" data-act="wk" data-n="1" aria-label="Semana siguiente">›</button>
      <button class="btn" data-act="wk-today">Hoy</button>
      <div class="spacer"></div>
      ${whoSeg()}
      <button class="btn" data-act="add-event" data-date="${dk(addDays(start, Math.min(ui.day,6)))}">+ Fecha importante</button>
    </div>
    <div class="daychips">${chips}</div>
    <div class="week">${cols}</div>
    <div class="legend">${Object.entries(TYPES).map(([k,l]) => `<span class="t-${k}"><i></i>${l}</span>`).join('')}
      <span>Toca una actividad para editarla · marca la casilla cuando esté hecha</span></div>`;
}

function viewMonth(){
  const m = ui.month, first = new Date(m.getFullYear(), m.getMonth(), 1), start = mondayOf(first), tk = todayKey();
  let html = DAYS_S.map((d,i) => `<div class="mhead" style="--dc:${DAYCOL[i]}">${d}</div>`).join('');
  for (let k = 0; k < 42; k++){
    const d = addDays(start, k), key = dk(d), i = k % 7;
    const items = eventsFor(key).map(e => ({ t:e.title, c:(KINDS[e.kind]||KINDS.otro).c }));
    blocksFor(d).filter(b => b.type === 'salida').forEach(b => items.push({ t:b.title.split(':')[0], c:KINDS.salida.c }));
    const shown = items.slice(0, 3).map(x => `<div class="pill" style="--k:${x.c}"><i class="dot"></i><span>${esc(x.t)}</span></div>`).join('');
    const more = items.length > 3 ? `<div class="more">+${items.length-3} más</div>` : '';
    html += `<button class="cell${d.getMonth()!==m.getMonth()?' out':''}${key===tk?' today':''}" style="--dc:${DAYCOL[i]}" data-act="day" data-date="${key}" aria-label="${d.getDate()} de ${MONTHS[d.getMonth()]}${items.length?', '+items.length+' marcadores':''}">
      <span class="num">${d.getDate()}</span>${shown}${more}</button>`;
  }
  const from = todayKey(), to = dk(addDays(new Date(), 90));
  const up = live('events').filter(e => e.date >= from && e.date <= to).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 12);
  const upHtml = up.length ? up.map(e => {
    const d = parseDk(e.date), k = KINDS[e.kind] || KINDS.otro;
    return `<button class="up-row" style="--k:${k.c}" data-act="edit-event" data-id="${esc(e.id)}">
      <span class="up-date">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</span><span class="dot"></span>
      <span><b>${esc(e.title)}</b><small>${esc(k.l)}${e.note?' · '+esc(e.note):''}</small></span></button>`;
  }).join('') : '<div class="empty">Todavía no hay fechas marcadas. Toca un día del calendario para agregar una.</div>';
  return `<div class="bar">
      <button class="icon-btn" data-act="mo" data-n="-1" aria-label="Mes anterior">‹</button>
      <h2 style="text-transform:capitalize">${MONTHS[m.getMonth()]} ${m.getFullYear()}</h2>
      <button class="icon-btn" data-act="mo" data-n="1" aria-label="Mes siguiente">›</button>
      <button class="btn" data-act="mo-today">Hoy</button>
      <div class="spacer"></div>
      <button class="btn primary" data-act="add-event" data-date="${todayKey()}">+ Marcador</button>
    </div>
    <div class="month">${html}</div>
    <div class="legend">${Object.values(KINDS).map(k => `<span><i style="background:${k.c};border-color:${k.c};border-radius:50%"></i>${k.l}</span>`).join('')}</div>
    <div class="upcoming"><h3>Próximas fechas</h3>${upHtml}</div>`;
}

function viewNotes(){
  const notes = live('notes').sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const cards = notes.map((n, i) => {
    const sw = NOTE_COLORS.map(c => `<button type="button" class="swatch" style="background:${c}" data-act="note-color" data-id="${esc(n.id)}" data-c="${c}" aria-label="Cambiar color"></button>`).join('');

      <button class="btn primary" data-act="note-add">+ Nueva notita</button></div>
    ${cards ? `<div class="notes">${cards}</div>` : '<div class="panel"><p>Aquí van recados, ideas para salidas, lista del súper o lo que quieran dejarse el uno al otro.</p><button class="btn primary" data-act="note-add">+ Primera notita</button></div>'}`;

/* ---------- Diálogos ---------- */
const dlg = $('#dlg'), form = $('#dlgForm');
let onSave = null, onDelete = null;
function openDialog(title, body, save, del){
  onSave = save; onDelete = del || null;
  form.innerHTML = `<h3>${esc(title)}</h3>${body}
    <div class="actions">${del ? '<button type="button" class="btn danger" data-dlg="del">Borrar</button>' : ''}
      <button type="button" class="btn" data-dlg="cancel">Cancelar</button>
      ${save ? '<button type="submit" class="btn primary" value="ok">Guardar</button>' : ''}</div>`;
  dlg.showModal();
  const f = form.querySelector('input:not([type=radio]),textarea'); if (f && save) f.focus();
}
function closeDialog(){ dlg.close(); if (pendingRender){ pendingRender = false; render(); } }
form.addEventListener('submit', e => {
  e.preventDefault();
  if (onSave && onSave(new FormData(form)) !== false) closeDialog();
});
form.addEventListener('click', e => {
  const b = e.target.closest('[data-dlg]'); if (!b) return;
  if (b.dataset.dlg === 'cancel') closeDialog();
  if (b.dataset.dlg === 'del' && onDelete && confirmDel(b)){ onDelete(); closeDialog(); }
  if (b.dataset.dlg === 'add-ev'){ const k = b.dataset.date; closeDialog(); eventDialog(null, k); }
  if (b.dataset.dlg === 'ev'){ const id = b.dataset.id; closeDialog(); eventDialog(live('events').find(x => x.id === id)); }
});
dlg.addEventListener('close', () => { if (pendingRender){ pendingRender = false; render(); } });
function confirmDel(b){
  if (b.dataset.sure) return true;
  b.dataset.sure = '1'; b.textContent = '¿Seguro? Toca otra vez';
  return false;
}
const opt = (obj, sel) => Object.entries(obj).map(([v,l]) => `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l.l || l)}</option>`).join('');

function blockDialog(b, dateKey){
  const isNew = !b;
  const d = dateKey ? parseDk(dateKey) : new Date();
  b = b || { id:uid(), title:'', day:wdi(d), start:'18:00', end:'19:00', type:'pareja', who:'ambos', freq:'all', date:dateKey || todayKey() };
  const whoOpts = { ambos:'Ambos', a:S.settings.nameA, b:S.settings.nameB, cada:'Cada quien' };
  openDialog(isNew ? 'Nueva actividad' : 'Editar actividad', `
    <label class="f">Actividad<input name="title" required maxlength="80" value="${esc(b.title)}" placeholder="Ej. Cena con amigos"></label>
    <div class="fields">
      <label class="f">Inicio<input name="start" type="time" required value="${esc(b.start)}"></label>
      <label class="f">Fin<input name="end" type="time" value="${esc(b.end||'')}"></label>
    </div>
    <div class="fields">
      <label class="f">Tipo<select name="type">${opt(TYPES, b.type)}</select></label>
      <label class="f">Quién<select name="who">${opt(whoOpts, b.who)}</select></label>
    </div>
    <div class="fields">
      <label class="f">Repetir<select name="freq" id="freqSel">${opt(FREQ, b.freq)}</select></label>
      <label class="f" id="daySel">Día<select name="day">${DAYS.map((n,i) => `<option value="${i}" ${i===b.day?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="f" id="dateSel">Fecha<input name="date" type="date" value="${esc(b.date || dateKey || todayKey())}"></label>
    </div>`,
    fd => {
      const freq = fd.get('freq');
      const nb = { ...b, title:fd.get('title').trim(), start:fd.get('start'), end:fd.get('end'),
        type:fd.get('type'), who:fd.get('who'), freq };
      if (freq === 'once'){ nb.date = fd.get('date'); nb.day = wdi(parseDk(nb.date)); }
      else { nb.day = Number(fd.get('day')); delete nb.date; }
      if (!nb.title) return false;
      upsert('blocks', nb); toast('Guardado');
    },
    isNew ? null : () => { removeItem('blocks', b.id); toast('Actividad borrada'); });
  const toggleFreq = () => { const once = $('#freqSel').value === 'once'; $('#daySel').classList.toggle('hidden', once); $('#dateSel').classList.toggle('hidden', !once); };
  $('#freqSel').addEventListener('change', toggleFreq); toggleFreq();
}

function eventDialog(e, dateKey){
  const isNew = !e;
  e = e || { id:uid(), date:dateKey || todayKey(), title:'', kind:'importante', note:'' };
  openDialog(isNew ? 'Nueva fecha importante' : 'Editar fecha', `
    <label class="f">Qué es<input name="title" required maxlength="80" value="${esc(e.title)}" placeholder="Ej. Aniversario, pago de renta…"></label>
    <div class="fields">
      <label class="f">Fecha<input name="date" type="date" required value="${esc(e.date)}"></label>
      <label class="f">Tipo<select name="kind">${opt(KINDS, e.kind)}</select></label>
    </div>
    <label class="f">Nota (opcional)<textarea name="note" maxlength="300">${esc(e.note||'')}</textarea></label>`,
    fd => {
      const ne = { ...e, title:fd.get('title').trim(), date:fd.get('date'), kind:fd.get('kind'), note:fd.get('note').trim() };
      if (!ne.title || !ne.date) return false;
      upsert('events', ne); toast('Fecha guardada');
    },
    isNew ? null : () => { removeItem('events', e.id); toast('Fecha borrada'); });
}

function dayDialog(key){
  const d = parseDk(key), evs = eventsFor(key);
  const list = evs.length ? evs.map(e => { const k = KINDS[e.kind]||KINDS.otro;
      return `<button type="button" class="mark" style="--k:${k.c}" data-dlg="ev" data-id="${esc(e.id)}"><span class="dot"></span><span>${esc(e.title)} <small style="font-weight:400">· ${esc(k.l)}</small></span></button>`; }).join('')
    : '<div class="empty">Nada marcado este día.</div>';
  const bl = blocksFor(d).filter(b => b.type === 'salida' || b.type === 'pareja').map(b => `<div class="pill" style="--k:${b.type==='salida'?KINDS.salida.c:'#e05b8f'}"><i class="dot"></i><span>${esc(range(b.start,b.end))} · ${esc(b.title)}</span></div>`).join('');

    <div class="choice">
      <label><input type="radio" name="me" value="a" checked> ${esc(S.settings.nameA)}</label>
      <label><input type="radio" name="me" value="b"> ${esc(S.settings.nameB)}</label>
    </div>`, fd => { store.set(LS_ME, fd.get('me')); render(); });

/* ---------- Eventos de la página ---------- */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v){ ui.view = v.dataset.view; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.closest('dialog')) return;
  const a = el.dataset.act, id = el.dataset.id, date = el.dataset.date;
  switch (a){
    case 'wk': ui.week = addDays(ui.week, 7 * Number(el.dataset.n)); render(); break;
    case 'wk-today': ui.week = mondayOf(new Date()); ui.day = wdi(new Date()); render(); break;
    case 'pick-day': ui.day = Number(el.dataset.i); render(); break;
    case 'who': ui.who = el.dataset.v; render(); break;
    case 'add-block': blockDialog(null, date); break;
    case 'edit-block': blockDialog(live('blocks').find(x => x.id === id), date); break;
    case 'add-event': eventDialog(null, date); break;
    case 'edit-event': eventDialog(live('events').find(x => x.id === id)); break;
    case 'mo': ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + Number(el.dataset.n), 1); render(); break;
    case 'mo-today': ui.month = new Date(new Date().getFullYear(), new Date().getMonth(), 1); render(); break;
    case 'day': dayDialog(date); break;
    case 'note-add': {
      const n = { id:uid(), text:'', color:NOTE_COLORS[S.notes.length % NOTE_COLORS.length], author:me(), createdAt:now() };
      upsert('notes', n);
      const t = document.querySelector(`[data-note="${n.id}"]`); if (t) t.focus();
      break;
    }
    case 'note-color': { const n = live('notes').find(x => x.id === id); if (n) upsert('notes', { ...n, color:el.dataset.c }); break; }
    case 'note-del': {
      if (!el.dataset.sure){ el.dataset.sure = '1'; el.textContent = '¿?'; el.setAttribute('aria-label','Toca otra vez para borrar'); setTimeout(() => { if (el.isConnected){ delete el.dataset.sure; el.textContent = '✕'; } }, 2500); break; }
      removeItem('notes', id); toast('Notita borrada'); break;
    }
    case 'pin-save': store.set(LS_PIN, $('#pinIn').value.trim()); toast('PIN guardado'); push(); break;
    case 'sync-now': push(); toast('Sincronizando…'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob), aEl = document.createElement('a');
      aEl.href = url; aEl.download = `agenda-pareja-${todayKey()}.json`; aEl.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      break;
    }
    case 'import': $('#importFile').click(); break;
    case 'reseed': {
      const t = now();
      seedBlocks().forEach(sb => { const i = S.blocks.findIndex(x => x.id === sb.id); const nb = { ...sb, updatedAt:t }; if (i >= 0) S.blocks[i] = nb; else S.blocks.push(nb); });
      commit(); toast('Horario base cargado'); break;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'toggle'){
    const cid = `${el.dataset.id}|${el.dataset.date}`;
    upsert('checks', { id:cid, done:el.checked });
  } else if (el.dataset.act === 'me'){ store.set(LS_ME, el.value); }
  else if (el.dataset.set){
    const val = el.value.trim(); if (!val) return;
    S.settings = { ...S.settings, [el.dataset.set]:val, updatedAt:now() }; commit();
  }
});
const noteTimers = {};
document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.note; if (!id) return;
  const text = e.target.value;
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(() => {
    const n = S.notes.find(x => x.id === id); if (!n) return;
    Object.assign(n, { text, updatedAt:now() }); saveLocal(); schedulePush();
  }, 500);
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!data || !data.v) throw 0; S = merge(S, data); commit(); toast('Respaldo restaurado'); }
  catch(err){ toast('Ese archivo no es un respaldo válido'); }
  e.target.value = '';
});

/* ---------- Sincronización ---------- */
const sync = { mode:'checking', timer:null, busy:false };
function setMode(m){
  sync.mode = m;
  const el = $('#sync'); el.dataset.mode = m;
  el.querySelector('span').textContent = { cloud:'Sincronizado', local:'Solo en este teléfono', pin:'Falta PIN', error:'Sin conexión', checking:'Conectando…' }[m];
  if (ui.view === 'ajustes') safeRender();
}
async function api(method, body){
  const h = { 'Content-Type':'application/json' }, pin = store.get(LS_PIN);
  if (pin) h['x-pin'] = pin;
  return fetch('/api/state', { method, headers:h, cache:'no-store', body:body ? JSON.stringify(body) : undefined });
}
function applyRemote(rs){
  if (!rs) return;
  const before = JSON.stringify(S);
  S = merge(S, rs);
  if (JSON.stringify(S) !== before){ saveLocal(); safeRender(); }
}
async function handle(r){
  if (r.status === 401){ setMode('pin'); return; }
  if (r.status === 404 || r.status === 501){ setMode('local'); return; }
  if (!r.ok){ setMode('error'); return; }
  const d = await r.json(); setMode('cloud'); applyRemote(d.state);
}
async function push(){
  if (location.protocol === 'file:'){ setMode('local'); return; }
  if (sync.busy){ schedulePush(); return; }
  sync.busy = true;
  try { await handle(await api('POST', { state:S })); } catch(e){ setMode(navigator.onLine ? 'local' : 'error'); }
  sync.busy = false;
}
async function pull(){
  if (location.protocol === 'file:' || sync.mode === 'local' || sync.busy) return;
  try { await handle(await api('GET')); } catch(e){ setMode('error'); }
}
function schedulePush(){ clearTimeout(sync.timer); sync.timer = setTimeout(push, 800); }
setInterval(pull, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
window.addEventListener('online', push);

/* ---------- Inicio ---------- */
saveLocal();
render();
push();
if (!me()) setTimeout(whoAmIDialog, 300);
})();
</script>
